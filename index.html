<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学Aラボ</title>
<meta name="description" content="数学Aの授業で使える、場合の数・確率・図形の性質・整数を、さわって動かして見られるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 見た目：方眼ノート（紙・墨・緑青・朱）。分子ラボ3Dとそろえる */
:root {
  --bg: #f1ede4; --panel: #fbf9f4; --ink: #24282b; --muted: #6d6b63; --line: #d6d0c2; --chip: #ebe6da;
  --accent: #2c6352; --accent-ink: #fbf9f4; --accent-soft: rgba(44, 99, 82, .16);
  --warm: #b8502c; --warm-soft: rgba(184, 80, 44, .16);
  --blue: #2f5f9e; --blue-soft: rgba(47, 95, 158, .16);
  --gold: #b88a12; --violet: #7a4fa3;
  --stage-1: #fdfcf8; --stage-2: #ece7dc; --grid: rgba(36, 40, 43, .06);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
    --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
    --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
    --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
    --gold: #e3c15a; --violet: #c3a3e6;
    --stage-1: #26332d; --stage-2: #141b17; --grid: rgba(235, 232, 221, .06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
  --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
  --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
  --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
  --gold: #e3c15a; --violet: #c3a3e6;
  --stage-1: #26332d; --stage-2: #141b17; --grid: rgba(235, 232, 221, .06);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  display: flex; flex-direction: column; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { font-size: .68em; line-height: 0; }

/* 上のバー */
.top {
  display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1.5px solid var(--ink); background: var(--panel);
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .04em; margin: 0; white-space: nowrap; }
.brand b { color: var(--warm); }
.secnav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.secnav::-webkit-scrollbar { display: none; }
.secnav button { border: 0; background: transparent; padding: 6px 12px; font-size: 14.5px; color: var(--muted); white-space: nowrap; font-weight: 700; }
.secnav button:hover { color: var(--ink); }
.secnav button[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--warm); }
.secnav .ico { margin-right: 4px; }

/* 全体の配置：左に一覧、まん中にステージ、右に説明 */
.app {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  grid-template-columns: 230px minmax(0, 1fr) 350px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.lib { display: flex; flex-direction: column; overflow: auto; padding: 10px; gap: 4px; }
.lib h2 { font-family: var(--font-display); font-size: 15px; margin: 4px 6px 6px; color: var(--muted); letter-spacing: .06em; }
.item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 8px 10px; }
.item:hover { background: var(--chip); }
.item b { display: block; font-weight: 700; font-size: 15px; }
.item small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
.item[aria-current="true"] { border-color: var(--ink); background: var(--panel); box-shadow: 2px 2px 0 var(--ink); }
.item .num { font-family: var(--font-data); color: var(--warm); font-size: 12px; margin-right: 6px; }

.stage-wrap {
  position: relative; border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 40% 35%, var(--stage-1), var(--stage-2));
}
.stage-wrap.is-max { position: fixed; inset: 0; z-index: 50; border-radius: 0; }
.stage { position: absolute; inset: 0; }
.stage-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 3; }
.ibtn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 9px; font-size: 13px; font-weight: 700; }
.ibtn:hover { border-color: var(--ink); }
.stage-hint { position: absolute; left: 10px; bottom: 8px; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; pointer-events: none; z-index: 2; max-width: calc(100% - 20px); }

/* 説明カード */
.card { display: flex; flex-direction: column; overflow: hidden; }
.card-head { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
.card-head .cat { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.card-head h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.3; }
.card-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 16px; }
.readout {
  border: 1.5px solid var(--ink); border-radius: 3px; background: var(--bg); padding: 10px 12px; margin-bottom: 12px;
  font-size: 15px; line-height: 1.7; min-height: 48px;
}
.readout .big { font-family: var(--font-data); font-size: 20px; font-weight: 600; }
.readout .eq { font-family: var(--font-data); }
.readout .hl { color: var(--warm); font-weight: 700; }
.readout .ac { color: var(--accent); font-weight: 700; }
.readout .bl { color: var(--blue); font-weight: 700; }
.readout .mt { color: var(--muted); font-size: 13px; }
.readout hr { border: 0; border-top: 1px dashed var(--line); margin: 6px 0; }
.ctrl { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.ctrl .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctrl label.sl { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.ctrl label.sl output { font-family: var(--font-data); font-weight: 600; min-width: 3.2em; text-align: right; }
.ctrl input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctrl .lab { font-size: 12px; color: var(--muted); letter-spacing: .04em; width: 100%; margin-bottom: -2px; }
.btn { border: 1px solid var(--ink); background: var(--panel); border-radius: 4px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
.btn:hover { background: var(--chip); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.btn.main:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 10px; font-size: 13.5px; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); font-weight: 700; }
.tgl { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 10px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.tgl::before { content: ""; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 2px; }
.tgl[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
.tgl[aria-pressed="true"]::before { background: var(--tc, var(--accent)); border-color: var(--tc, var(--accent)); }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--accent); }
.text p { margin: 0 0 10px; }
.text ul { margin: 0 0 10px; padding-left: 1.2em; }
.text li { margin-bottom: 4px; }
.text .formula { font-family: var(--font-data); background: var(--chip); border-left: 3px solid var(--warm); padding: 6px 10px; margin: 8px 0 12px; display: block; }
.text b { color: var(--warm); }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; font-family: var(--font-data); margin: 0 2px; }
.fr > i { font-style: normal; padding: 0 3px; }
.fr > i:first-child { border-bottom: 1.5px solid currentColor; }
.ov { text-decoration: overline; }

/* ステージの SVG */
.sv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.sv text { font-family: var(--font-body); fill: var(--ink); }
.sv .mono { font-family: var(--font-data); }
.sv .disp { font-family: var(--font-display); font-weight: 800; }
.sv .mut { fill: var(--muted); }
.sv .tw { fill: var(--warm); } .sv .ta { fill: var(--accent); } .sv .tb { fill: var(--blue); }
.ink { stroke: var(--ink); fill: none; stroke-width: 2; }
.thin { stroke: var(--muted); fill: none; stroke-width: 1.2; }
.dash { stroke-dasharray: 6 5; }
.s-ac { stroke: var(--accent); } .s-wm { stroke: var(--warm); } .s-bl { stroke: var(--blue); } .s-gd { stroke: var(--gold); } .s-vi { stroke: var(--violet); }
.f-ac { fill: var(--accent); } .f-wm { fill: var(--warm); } .f-bl { fill: var(--blue); } .f-gd { fill: var(--gold); } .f-vi { fill: var(--violet); }
.f-acs { fill: var(--accent-soft); } .f-wms { fill: var(--warm-soft); } .f-bls { fill: var(--blue-soft); }
.f-pn { fill: var(--panel); } .f-ink { fill: var(--ink); } .f-chip { fill: var(--chip); } .f-none { fill: none; }
.handle { cursor: grab; }
.handle .dot { fill: var(--warm); stroke: var(--panel); stroke-width: 3; }
.handle .hit { fill: transparent; }
.handle:hover .dot, .handle.on .dot { stroke: var(--ink); }
.pointlbl { font-family: var(--font-display) !important; font-weight: 800; font-size: 22px; paint-order: stroke; stroke: var(--stage-1); stroke-width: 5px; stroke-linejoin: round; }
.tag { font-size: 14px; paint-order: stroke; stroke: var(--stage-1); stroke-width: 4px; stroke-linejoin: round; }
.anim { transition: transform .55s cubic-bezier(.3, .7, .2, 1), opacity .4s; }
.pop { animation: pop .35s ease-out both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.pop { transform-box: fill-box; transform-origin: center; }
.fadein { animation: fadein .4s ease-out both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* HTMLで描くステージ（クイズなど） */
.hstage { position: absolute; inset: 0; overflow: auto; padding: 22px; }
.quiz { max-width: 640px; margin: 0 auto; }
.quiz .qn { font-family: var(--font-data); color: var(--muted); font-size: 13px; }
.quiz .qtext { font-size: 20px; font-weight: 700; margin: 6px 0 14px; line-height: 1.6; }
.quiz .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quiz .choice { border: 1.5px solid var(--ink); background: var(--panel); border-radius: 4px; padding: 14px 10px; font-size: 19px; font-family: var(--font-data); font-weight: 600; box-shadow: 2px 2px 0 var(--ink); }
.quiz .choice:hover:not(:disabled) { background: var(--chip); }
.quiz .choice.right { background: var(--accent); color: var(--accent-ink); opacity: 1; }
.quiz .choice.wrong { border-color: var(--warm); color: var(--warm); opacity: 1; }
.quiz .explain { margin-top: 16px; border-left: 3px solid var(--accent); background: var(--panel); padding: 10px 14px; }
.quiz a.btn { color: var(--ink); }
.quiz .bar { height: 6px; background: var(--chip); margin: 8px 0 16px; }
.quiz .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.quiz .fig { display: flex; justify-content: center; margin: 0 0 12px; }
.quiz .fig svg { max-width: 300px; width: 100%; height: auto; }
.stamp { display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: var(--warm); border: 3px solid var(--warm); border-radius: 50%; width: 96px; height: 96px; font-size: 26px; transform: rotate(-12deg); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 5px var(--warm); }
.center { text-align: center; }

/* スマホ・タブレット */
.libsel { display: none; }
@media (max-width: 1100px) { .app { grid-template-columns: 200px minmax(0, 1fr) 310px; } }
@media (max-width: 900px) {
  body { height: 100dvh; }
  .top { padding: 4px 10px; gap: 6px; }
  .brand { font-size: 16px; }
  .secnav button { padding: 6px 8px; font-size: 13.5px; }
  .secnav .ico { display: none; }
  .app { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; }
  .lib { flex: none; flex-direction: row; overflow-x: auto; padding: 5px 6px; gap: 4px; scrollbar-width: none; }
  .lib::-webkit-scrollbar { display: none; }
  .lib h2 { display: none; }
  .item { flex: 0 0 auto; width: auto; padding: 4px 10px; white-space: nowrap; }
  .item b { font-size: 13.5px; }
  .item small { display: none; }
  .item[aria-current="true"] { box-shadow: none; }
  .stage-wrap { flex: 1 1 54%; min-height: 220px; }
  .card { flex: 1 1 46%; min-height: 0; }
  .card-head { padding: 6px 12px 4px; display: flex; align-items: baseline; gap: 8px; }
  .card-head h2 { font-size: 17px; }
  .card-body { padding: 8px 12px 12px; }
  .readout { font-size: 14px; padding: 6px 10px; margin-bottom: 8px; }
  .readout .big { font-size: 17px; }
  .stage-hint { display: none; }
  .quiz .qtext { font-size: 17px; }
  .quiz .choice { font-size: 16px; padding: 10px 6px; }
  .hstage { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { .anim { transition: none; } .pop, .fadein { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">数学A<b>ラボ</b></h1>
  <nav class="secnav" id="secnav" aria-label="分野"></nav>
</header>
<main class="app">
  <aside class="panel lib" id="lib" aria-label="えらぶ"></aside>
  <section class="stage-wrap" id="stageWrap" aria-label="ステージ">
    <div class="stage" id="stage"></div>
    <div class="stage-tools"><button type="button" class="ibtn" id="maxBtn" title="全画面（プロジェクター用）">⛶ 全画面</button></div>
    <div class="stage-hint" id="hint"></div>
  </section>
  <aside class="panel card" id="card" aria-label="説明">
    <div class="card-head"><div class="cat" id="cardCat"></div><h2 id="cardTitle"></h2></div>
    <div class="card-body">
      <div class="readout" id="readout" aria-live="polite"></div>
      <div class="ctrl" id="ctrl"></div>
      <div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-t="point">ポイント</button><button type="button" role="tab" aria-selected="false" data-t="detail">くわしく</button></div>
      <div class="text" id="text"></div>
    </div>
  </aside>
</main>
<script>
"use strict";
/* ===== 共通の部品 ===== */
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs || {}) {
    if (k === "text") el.textContent = attrs[k];
    else if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(el);
  return el;
}
function setA(el, attrs) { for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
function svgPt(svg, e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return { x: q.x, y: q.y };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const deg = r => r * 180 / Math.PI;
const fmt = (v, d = 1) => { const t = (Math.round(v * 10 ** d) / 10 ** d).toFixed(d); return t === "-0.0" ? "0.0" : t; };

/* 数の計算 */
function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
function nPr(n, r) { if (r < 0 || r > n) return 0; let v = 1; for (let i = 0; i < r; i++) v *= n - i; return v; }
function nCr(n, r) { if (r < 0 || r > n) return 0; r = Math.min(r, n - r); let v = 1; for (let i = 1; i <= r; i++) v = v * (n - r + i) / i; return Math.round(v); }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function factorize(n) { const f = []; for (let p = 2; p * p <= n; p++) { let e = 0; while (n % p === 0) { n /= p; e++; } if (e) f.push([p, e]); } if (n > 1) f.push([n, 1]); return f; }
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const sup = n => String(n).split("").map(c => SUP[+c] ?? c).join("");
const SUBD = "₀₁₂₃₄₅₆₇₈₉";
const subd = n => String(n).split("").map(c => SUBD[+c] ?? c).join("");
/* 分数の HTML（約分する） */
function frac(n, d, raw) {
  if (!raw) { const g = gcd(n, d) || 1; n /= g; d /= g; }
  if (d === 1) return `<span class="eq">${n}</span>`;
  return `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
}
const P = (n, r) => `<sub>${n}</sub>P<sub>${r}</sub>`;
const C = (n, r) => `<sub>${n}</sub>C<sub>${r}</sub>`;
const COLORS = ["#c0392b", "#2c7a5f", "#2f5f9e", "#c9930e", "#7a4fa3", "#d9661f", "#2a8fa3", "#8a6d3b", "#c2417a", "#5b7d1f"];

/* ===== アプリの骨組み ===== */
const CATS = [
  { id: "cnt", name: "場合の数", ico: "🔢" },
  { id: "prob", name: "確率", ico: "🎲" },
  { id: "geo", name: "図形の性質", ico: "📐" },
  { id: "int", name: "整数の性質", ico: "🧮" },
  { id: "quiz", name: "挑戦", ico: "🏁" },
];
const SIMS = [];
function sim(def) { SIMS.push(def); }

const store = {
  get(k, d) { try { const v = localStorage.getItem("mathA:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mathA:" + k, JSON.stringify(v)); } catch (e) { /* 保存できなくても動く */ } },
};

let current = null; // { def, cleanups: [] }
let uid = 0;

function makeCtx(def) {
  const stage = $("#stage"), ctrl = $("#ctrl"), readout = $("#readout");
  const cleanups = [];
  const ctx = {
    stage, ctrl, readout, cleanups,
    id: (p = "") => `${def.id}-${p}${++uid}`,
    svg(w = 800, hgt = 560) {
      const el = s("svg", { viewBox: `0 0 ${w} ${hgt}`, class: "sv", preserveAspectRatio: "xMidYMid meet" });
      stage.appendChild(el);
      return el;
    },
    html(cls = "hstage") { const d = h("div", { class: cls }); stage.appendChild(d); return d; },
    out(html) { readout.innerHTML = html; },
    hint(t) { const el = $("#hint"); el.textContent = t || ""; el.hidden = !t; },
    on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); cleanups.push(() => target.removeEventListener(ev, fn, opt)); },
    after(ms, fn) { const t = setTimeout(fn, ms); cleanups.push(() => clearTimeout(t)); return t; },
    every(ms, fn) { const t = setInterval(fn, ms); cleanups.push(() => clearInterval(t)); return t; },
    loop(fn) {
      let id = 0, last = performance.now(), alive = true;
      const step = now => { if (!alive) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (fn(dt, now) !== false) id = requestAnimationFrame(step); };
      id = requestAnimationFrame(step);
      const stop = () => { alive = false; cancelAnimationFrame(id); };
      cleanups.push(stop);
      return stop;
    },
    row(...kids) { const r = h("div", { class: "row" }, ...kids); ctrl.appendChild(r); return r; },
    label(t) { const l = h("div", { class: "lab" }, t); ctrl.appendChild(l); return l; },
    btn(text, fn, opts = {}) { const b = h("button", { type: "button", class: "btn" + (opts.main ? " main" : ""), onclick: fn, title: opts.title }, text); return b; },
    slider(label, o, fn) {
      const out = h("output", {}, (o.fmt || String)(o.value));
      const inp = h("input", { type: "range", min: o.min, max: o.max, step: o.step || 1, value: o.value, "aria-label": label });
      inp.addEventListener("input", () => { const v = +inp.value; out.textContent = (o.fmt || String)(v); fn(v); });
      const el = h("label", { class: "sl" }, h("span", {}, label), inp, out);
      (o.parent || ctrl).appendChild(el);
      return {
        el, inp,
        get: () => +inp.value,
        set(v, silent) { inp.value = v; out.textContent = (o.fmt || String)(+inp.value); if (!silent) fn(+inp.value); },
        range(min, max) { inp.min = min; inp.max = max; out.textContent = (o.fmt || String)(+inp.value); },
      };
    },
    seg(label, options, value, fn, parent) {
      const wrap = h("div", { class: "seg", role: "group", "aria-label": label || "" });
      let cur = value;
      const btns = options.map(o => {
        const b = h("button", { type: "button", "aria-pressed": String(o.v === value), title: o.title, html: o.t });
        b.addEventListener("click", () => { if (b.disabled) return; api.set(o.v); });
        wrap.appendChild(b); return b;
      });
      const api = {
        el: wrap,
        get: () => cur,
        set(v, silent) { cur = v; btns.forEach((b, i) => b.setAttribute("aria-pressed", String(options[i].v === v))); if (!silent) fn(v); },
        disable(v, dis) { const i = options.findIndex(o => o.v === v); if (i >= 0) btns[i].disabled = dis; },
      };
      if (label) (parent || ctrl).appendChild(h("div", { class: "lab" }, label));
      (parent || ctrl).appendChild(wrap);
      return api;
    },
    toggle(text, value, fn, color) {
      const b = h("button", { type: "button", class: "tgl", "aria-pressed": String(!!value), style: color ? `--tc:${color}` : null, html: text });
      let v = !!value;
      b.addEventListener("click", () => api.set(!v));
      const api = { el: b, get: () => v, set(nv, silent) { v = nv; b.setAttribute("aria-pressed", String(v)); if (!silent) fn(v); } };
      return api;
    },
    /* ドラッグできる点 */
    handle(svg, parent, x, y, onMove, opts = {}) {
      const g = s("g", { class: "handle" + (opts.cls ? " " + opts.cls : "") }, parent);
      s("circle", { class: "hit", r: opts.hit || 24 }, g);
      const dot = s("circle", { class: "dot", r: opts.r || 9 }, g);
      if (opts.color) dot.style.fill = opts.color;
      let lbl = null;
      if (opts.label) lbl = s("text", { class: "pointlbl", "text-anchor": "middle", text: opts.label }, g);
      const api = {
        g, x, y,
        place(nx, ny) {
          api.x = nx; api.y = ny; g.setAttribute("transform", `translate(${nx},${ny})`);
          if (lbl) { const o = opts.labelOffset ? opts.labelOffset(api) : { x: 0, y: -16 }; setA(lbl, { x: o.x, y: o.y + 7 }); }
        },
        relabel() { api.place(api.x, api.y); },
      };
      api.place(x, y);
      g.addEventListener("pointerdown", e => {
        e.preventDefault(); e.stopPropagation();
        g.setPointerCapture(e.pointerId); g.classList.add("on");
        const start = svgPt(svg, e), ox = api.x - start.x, oy = api.y - start.y;
        const move = ev => { const p = svgPt(svg, ev); onMove(p.x + ox, p.y + oy, api); };
        const up = () => { g.classList.remove("on"); g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); g.removeEventListener("pointercancel", up); opts.onEnd && opts.onEnd(); };
        g.addEventListener("pointermove", move); g.addEventListener("pointerup", up); g.addEventListener("pointercancel", up);
      });
      return api;
    },
  };
  return ctx;
}

function open(id, push = true) {
  const def = SIMS.find(d => d.id === id) || SIMS[0];
  if (current) { current.cleanups.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
  clear($("#stage")); clear($("#ctrl")); $("#readout").innerHTML = ""; $("#readout").hidden = false;
  const ctx = makeCtx(def);
  ctx.hint(def.hint || "");
  current = { def, cleanups: ctx.cleanups };
  const cat = CATS.find(c => c.id === def.cat);
  $("#cardCat").textContent = cat.name;
  $("#cardTitle").textContent = def.name;
  document.title = `${def.name}｜数学Aラボ`;
  renderNav(def);
  setTab(store.get("tab", "point"));
  try { def.build(ctx); } catch (e) { console.error(e); ctx.out("表示できませんでした：" + e.message); }
  if (push && location.hash !== "#" + def.id) history.replaceState(null, "", "#" + def.id);
  store.set("last", def.id);
}
function setTab(t) {
  const def = current && current.def;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.t === t)));
  $("#text").innerHTML = def ? (t === "detail" ? def.detail : def.point) || "" : "";
  store.set("tab", t);
}
function renderNav(def) {
  const nav = clear($("#secnav"));
  CATS.forEach(c => {
    const first = SIMS.find(d => d.cat === c.id);
    nav.appendChild(h("button", { type: "button", "aria-current": String(c.id === def.cat), onclick: () => open(store.get("lastIn:" + c.id, first.id)) }, h("span", { class: "ico", "aria-hidden": "true" }, c.ico), c.name));
  });
  store.set("lastIn:" + def.cat, def.id);
  const lib = clear($("#lib"));
  const cat = CATS.find(c => c.id === def.cat);
  lib.appendChild(h("h2", {}, cat.name));
  SIMS.filter(d => d.cat === def.cat).forEach((d, i) => {
    lib.appendChild(h("button", { type: "button", class: "item", "aria-current": String(d.id === def.id), onclick: () => open(d.id) },
      h("b", {}, h("span", { class: "num" }, String(i + 1).padStart(2, "0")), d.name), d.sub ? h("small", {}, d.sub) : null));
  });
  const cur = lib.querySelector('[aria-current="true"]');
  if (cur && cur.scrollIntoView && window.innerWidth <= 900) cur.scrollIntoView({ inline: "center", block: "nearest" });
}
</script>
<script>
"use strict";
/* ===================== 場合の数 ===================== */

/* --- 集合とベン図 --- */
sim({
  id: "venn", cat: "cnt", name: "集合とベン図", sub: "∩・∪・補集合・ド・モルガン",
  hint: "スライダーで A・B を変えると、数が動いて入れかわります",
  point: `<ul><li>A∩B（共通部分）は <b>両方に入っている</b> 所、A∪B（和集合）は <b>どちらかに入っている</b> 所。</li>
<li>A∪B の個数は、A と B をたすと <b>重なりを2回</b> 数えてしまうので、1回ひく。</li></ul>
<span class="formula">n(A∪B) = n(A) + n(B) − n(A∩B)</span>
<ul><li>補集合 <span class="ov">A</span> は「A でないもの」。<span class="formula">n(<span class="ov">A</span>) = n(U) − n(A)</span></li>
<li>ド・モルガンの法則：<span class="ov">A∪B</span> = <span class="ov">A</span>∩<span class="ov">B</span>、<span class="ov">A∩B</span> = <span class="ov">A</span>∪<span class="ov">B</span>。ボタンで ぬられる所を見くらべよう。</li></ul>`,
  detail: `<p>ここでは全体集合 U を 1 から N までの整数、A を「a の倍数」、B を「b の倍数」にしています。</p>
<p>A∩B は「a の倍数でもあり b の倍数でもある数」なので、<b>a と b の最小公倍数の倍数</b> になります。たとえば 2 の倍数と 3 の倍数の共通部分は 6 の倍数。</p>
<p>「1 から 100 までで、2 でも 3 でも割り切れない数はいくつ？」のような問題は、<b><span class="ov">A</span>∩<span class="ov">B</span> = <span class="ov">A∪B</span></b>（ド・モルガン）を使って、全体から A∪B をひけば求まります。</p>
<p>3つの集合のときは：<span class="formula">n(A∪B∪C) = n(A)+n(B)+n(C) − n(A∩B) − n(B∩C) − n(C∩A) + n(A∩B∩C)</span></p>`,
  build(c) {
    const svg = c.svg(800, 560);
    const U = { x: 30, y: 30, w: 740, h: 500 };
    const A = { x: 300, y: 292, r: 178 }, B = { x: 500, y: 292, r: 178 };
    const id = c.id("v");
    const defs = s("defs", {}, svg);
    const cp = (nm, circ) => { const e = s("clipPath", { id: id + nm }, defs); s("circle", { cx: circ.x, cy: circ.y, r: circ.r }, e); };
    cp("cA", A); cp("cB", B);
    const mk = (nm, outs) => { const m = s("mask", { id: id + nm }, defs); s("rect", { x: 0, y: 0, width: 800, height: 560, fill: "#fff" }, m); outs.forEach(o => s("circle", { cx: o.x, cy: o.y, r: o.r, fill: "#000" }, m)); };
    mk("nA", [A]); mk("nB", [B]); mk("nAB", [A, B]);
    const regs = {
      both: s("circle", { cx: A.x, cy: A.y, r: A.r, "clip-path": `url(#${id}cB)` }, svg),
      a: s("circle", { cx: A.x, cy: A.y, r: A.r, mask: `url(#${id}nB)` }, svg),
      b: s("circle", { cx: B.x, cy: B.y, r: B.r, mask: `url(#${id}nA)` }, svg),
      none: s("rect", { x: U.x, y: U.y, width: U.w, height: U.h, mask: `url(#${id}nAB)` }, svg),
    };
    Object.values(regs).forEach(r => { r.setAttribute("class", "f-acs"); r.style.transition = "opacity .3s"; });
    s("rect", { x: U.x, y: U.y, width: U.w, height: U.h, class: "ink", rx: 4 }, svg);
    s("circle", { cx: A.x, cy: A.y, r: A.r, class: "ink s-wm", "stroke-width": 3 }, svg);
    s("circle", { cx: B.x, cy: B.y, r: B.r, class: "ink s-bl", "stroke-width": 3 }, svg);
    s("text", { x: U.x + 14, y: U.y + 30, class: "disp", "font-size": 24, text: "U" }, svg);
    const la = s("text", { x: A.x - 60, y: A.y - A.r - 8, class: "disp tw", "font-size": 20, "text-anchor": "middle" }, svg);
    const lb = s("text", { x: B.x + 60, y: B.y - B.r - 8, class: "disp tb", "font-size": 20, "text-anchor": "middle" }, svg);
    const layer = s("g", {}, svg);
    const nodes = new Map();

    const ops = {
      A: { t: "A", r: ["a", "both"] }, B: { t: "B", r: ["b", "both"] },
      AnB: { t: "A∩B", r: ["both"] }, AuB: { t: "A∪B", r: ["a", "b", "both"] },
      nA: { t: '<span class="ov">A</span>', r: ["b", "none"] },
      nAnnB: { t: '<span class="ov">A</span>∩<span class="ov">B</span>', r: ["none"] },
      nAunB: { t: '<span class="ov">A</span>∪<span class="ov">B</span>', r: ["a", "b", "none"] },
    };
    let N = 30, a = 2, b = 3, op = "AuB";
    const sN = c.slider("全体 U：1〜", { min: 10, max: 60, value: N }, v => { N = v; draw(); });
    const sa = c.slider("A：○の倍数", { min: 2, max: 9, value: a }, v => { a = v; draw(); });
    const sb = c.slider("B：○の倍数", { min: 2, max: 9, value: b }, v => { b = v; draw(); });
    const sg = c.seg("ぬる所", Object.entries(ops).map(([k, o]) => ({ v: k, t: o.t })), op, v => { op = v; draw(); });

    const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
    function spots(test, need) {
      for (let sp = 40; sp >= 18; sp -= 2) {
        const out = [];
        for (let y = U.y + sp * 0.75; y < U.y + U.h - sp * 0.4; y += sp * 0.9)
          for (let x = U.x + sp * 0.6; x < U.x + U.w - sp * 0.4; x += sp) {
            const p = { x, y };
            if (x < U.x + 60 && y < U.y + 50) continue;
            if (test(p, sp * 0.55)) out.push(p);
          }
        if (out.length >= need) return { pts: out, sp };
      }
      return { pts: [], sp: 18 };
    }
    const tests = {
      both: (p, m) => dist(p, A) < A.r - m && dist(p, B) < B.r - m,
      a: (p, m) => dist(p, A) < A.r - m && dist(p, B) > B.r + m,
      b: (p, m) => dist(p, B) < B.r - m && dist(p, A) > A.r + m,
      none: (p, m) => dist(p, A) > A.r + m && dist(p, B) > B.r + m,
    };
    const regionOf = n => (n % a === 0 ? (n % b === 0 ? "both" : "a") : (n % b === 0 ? "b" : "none"));

    function draw() {
      la.textContent = `A（${a}の倍数）`; lb.textContent = `B（${b}の倍数）`;
      const groups = { both: [], a: [], b: [], none: [] };
      for (let n = 1; n <= N; n++) groups[regionOf(n)].push(n);
      const on = new Set(ops[op].r);
      Object.entries(regs).forEach(([k, el]) => { el.style.opacity = on.has(k) ? 1 : 0; });
      const seen = new Set();
      for (const k in groups) {
        const { pts, sp } = spots(tests[k], groups[k].length);
        groups[k].forEach((n, i) => {
          const p = pts[i] || { x: 760, y: 520 };
          let nd = nodes.get(n);
          if (!nd) {
            const g = s("g", { class: "anim" }, layer);
            const ci = s("circle", { r: 13 }, g);
            const tx = s("text", { "text-anchor": "middle", y: 5, class: "mono", "font-size": 14, text: n }, g);
            nd = { g, ci, tx }; nodes.set(n, nd);
            g.style.transform = `translate(${p.x}px, ${p.y}px)`;
          }
          const r = Math.min(15, sp * 0.42);
          setA(nd.ci, { r });
          nd.tx.setAttribute("font-size", Math.round(r * 1.05));
          nd.tx.setAttribute("y", r * 0.38);
          nd.g.style.transform = `translate(${p.x}px, ${p.y}px)`;
          const hot = on.has(k);
          nd.ci.setAttribute("class", hot ? "f-pn ink s-ac" : "f-pn thin");
          nd.ci.setAttribute("stroke-width", hot ? 2.2 : 1);
          nd.tx.setAttribute("class", "mono" + (hot ? "" : " mut"));
          nd.tx.style.fontWeight = hot ? 700 : 400;
          seen.add(n);
        });
      }
      for (const [n, nd] of nodes) if (!seen.has(n)) { nd.g.remove(); nodes.delete(n); }

      const nA = Math.floor(N / a), nB = Math.floor(N / b), L = lcm(a, b), nAB = Math.floor(N / L), nU = N, nAuB = nA + nB - nAB;
      const cnt = ops[op].r.reduce((t, k) => t + groups[k].length, 0);
      let f = "";
      if (op === "A") f = `n(A) = ${N}÷${a} の整数部分 = <span class="big hl">${nA}</span>`;
      else if (op === "B") f = `n(B) = ${N}÷${b} の整数部分 = <span class="big hl">${nB}</span>`;
      else if (op === "AnB") f = `A∩B は ${L} の倍数（${a}と${b}の最小公倍数）<br>n(A∩B) = <span class="big hl">${nAB}</span>`;
      else if (op === "AuB") f = `n(A∪B) = n(A) + n(B) − n(A∩B)<br><span class="eq">= ${nA} + ${nB} − ${nAB} =</span> <span class="big hl">${nAuB}</span>`;
      else if (op === "nA") f = `n(<span class="ov">A</span>) = n(U) − n(A) <span class="eq">= ${nU} − ${nA} =</span> <span class="big hl">${nU - nA}</span>`;
      else if (op === "nAnnB") f = `<span class="ov">A</span>∩<span class="ov">B</span> = <span class="ov">A∪B</span>（ド・モルガン）<br>n = n(U) − n(A∪B) <span class="eq">= ${nU} − ${nAuB} =</span> <span class="big hl">${nU - nAuB}</span>`;
      else f = `<span class="ov">A</span>∪<span class="ov">B</span> = <span class="ov">A∩B</span>（ド・モルガン）<br>n = n(U) − n(A∩B) <span class="eq">= ${nU} − ${nAB} =</span> <span class="big hl">${nU - nAB}</span>`;
      c.out(`${f}<hr><span class="mt">ぬられた所の数を数えると ${cnt} 個</span>`);
    }
    draw();
  },
});

/* --- 順列（席にならべる・樹形図・円順列） --- */
sim({
  id: "perm", cat: "cnt", name: "順列", sub: "ならべ方・樹形図・円順列・重複順列",
  hint: "「1つならべる」を何回か押すと、ちがうならび方が集まっていきます",
  point: `<ul><li>n 個から r 個を選んで <b>1列にならべる</b>：1番目は n 通り、2番目は（1つ使ったので）n−1 通り…とかけ算する。</li></ul>
<span class="formula">ₙPᵣ = n×(n−1)×…×(n−r+1)　（r 個かける）</span>
<ul><li><b>重複順列</b>（同じものを何回使ってもよい）：毎回 n 通りなので <span class="formula">nʳ</span></li>
<li><b>円順列</b>：円にならべると、回して重なるものは同じ。n 通りの回し方が1つになるので <span class="formula">n! ÷ n = (n−1)!</span></li></ul>`,
  detail: `<p><b>樹形図</b>は、1番目・2番目…と順に「えらべるもの」を枝分かれでかいたもの。枝の先（葉）の数が、ならべ方の数です。どの枝からも同じ本数だけ分かれるので、かけ算で数えられます（積の法則）。</p>
<p>n! は「n の階乗」で、n×(n−1)×…×2×1。ₙPₙ = n!、0! = 1 と決めます。</p>
<p>円順列で「1つを固定して考える」とは、1番の席をてっぺんに決めてしまうこと。のこりの (n−1) 個を順にならべるので (n−1)! 通り。</p>
<p>じゅず順列（うら返しても同じ）は、さらに 2 でわって (n−1)!÷2。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let n = 4, r = 3, mode = "P", view = "seat";
    const found = new Map();
    let busy = false;
    const sn = c.slider("ならべるもの n", { min: 2, max: 7, value: n }, v => { n = v; if (r > n || mode === "circ") r = mode === "circ" ? n : Math.min(r, n); sr.range(1, n); sr.set(r, true); reset(); });
    const sr = c.slider("えらぶ数 r", { min: 1, max: n, value: r }, v => { r = mode === "circ" ? n : v; reset(); });
    c.seg("ならべ方", [{ v: "P", t: "順列 ₙPᵣ" }, { v: "Pi", t: "重複順列 nʳ" }, { v: "circ", t: "円順列" }], mode, v => {
      mode = v; if (mode === "circ") { r = n; sr.set(r, true); } sr.inp.disabled = mode === "circ"; reset();
    });
    const sv = c.seg("見せ方", [{ v: "seat", t: "席にならべる" }, { v: "tree", t: "樹形図" }], view, v => { view = v; reset(); });
    c.row(c.btn("1つならべる", () => one(), { main: true }), c.btn("全部ならべる", () => all()), c.btn("リセット", () => reset()));

    const total = () => mode === "P" ? nPr(n, r) : mode === "Pi" ? n ** r : fact(n - 1);
    const key = arr => arr.join("");
    function canonCirc(arr) { const i = arr.indexOf(0); return arr.slice(i).concat(arr.slice(0, i)); }

    function ball(g, x, y, k, rad = 18) {
      const b = s("g", { transform: `translate(${x},${y})` }, g);
      s("circle", { r: rad, fill: COLORS[k], stroke: "var(--ink)", "stroke-width": 1.5 }, b);
      s("text", { "text-anchor": "middle", y: rad * 0.36, "font-size": rad, fill: "#fff", "font-weight": 700, text: k + 1 }, b);
      return b;
    }
    let G = null, slotsLayer = null, listLayer = null;
    function reset() {
      found.clear(); busy = false;
      clear(svg); G = s("g", {}, svg);
      const treeOk = mode !== "circ" && total() <= 36 && r <= 4;
      sv.disable("tree", !treeOk);
      if (!treeOk && view === "tree") { view = "seat"; sv.set("seat", true); }
      if (view === "tree") drawTree(); else drawSeats();
      readout();
    }
    function drawSeats() {

        for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; s("circle", { cx: cx + R * Math.cos(a), cy: cy + R * Math.sin(a), r: 24, class: "f-chip thin" }, slotsLayer); }
      } else {
        const w = Math.min(90, 700 / r), x0 = 400 - (r - 1) * w / 2;
        for (let i = 0; i < r; i++) {
          s("rect", { x: x0 + i * w - 28, y: 190, width: 56, height: 56, rx: 4, class: "f-chip thin" }, slotsLayer);
          s("text", { x: x0 + i * w, y: 180, "text-anchor": "middle", class: "mut", "font-size": 13, text: `${i + 1}番目` }, slotsLayer);
          const ways = mode === "P" ? n - i : n;
          s("text", { x: x0 + i * w, y: 280, "text-anchor": "middle", class: "mono tw", "font-size": 18, "font-weight": 700, text: `${ways}通り` }, slotsLayer);
          if (i < r - 1) s("text", { x: x0 + i * w + w / 2, y: 280, "text-anchor": "middle", class: "mono", "font-size": 18, text: "×" }, slotsLayer);

      listLayer = s("g", {}, G);
      drawList();
    }
    function slotPos(i) {
      if (mode === "circ") { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return { x: 400 + 110 * Math.cos(a), y: 250 + 110 * Math.sin(a) }; }
      const w = Math.min(90, 700 / r), x0 = 400 - (r - 1) * w / 2; return { x: x0 + i * w, y: 218 };
    }
    function randomArr() {
      if (mode === "Pi") return Array.from({ length: r }, () => rnd(n));
      const pool = shuffle([...Array(n).keys()]); return pool.slice(0, r);
    }
    function one() {
      if (busy || view === "tree") { if (view === "tree") pickLeaf(rnd(leaves.length)); return; }
      busy = true;
      let arr = randomArr();
      if (found.size < total()) { let t = 0; while (found.has(key(mode === "circ" ? canonCirc(arr) : arr)) && t++ < 200) arr = randomArr(); }
      const fly = s("g", {}, G);
      arr.forEach((k, i) => {
        const b = ball(fly, 70 + k * 56, 80, k, 20);
        b.removeAttribute("transform");
        b.style.transform = `translate(${70 + k * 56}px, 80px)`;
        b.classList.add("anim");
        c.after(60 + i * 160, () => { const p = slotPos(i); b.style.transform = `translate(${p.x}px, ${p.y}px)`; });
      });
      c.after(160 * arr.length + 520, () => {
        if (mode === "circ") {
          // 回して同じものを見せる
          const g = fly; let step = 0;
          const spin = () => {
            if (step >= n) { finish(); return; }
            step++;
            g.style.transition = "transform .45s"; g.style.transformOrigin = "400px 250px";
            g.style.transform = `rotate(${step * 360 / n}deg)`;
            c.after(520, spin);
          };
          readout(`回しても同じならび… ${n} 通りの回し方が 1 つの円順列`);
          spin();
        } else finish();
        function finish() {
          found.set(key(mode === "circ" ? canonCirc(arr) : arr), mode === "circ" ? canonCirc(arr) : arr);
          c.after(mode === "circ" ? 200 : 500, () => { fly.remove(); drawList(); readout(); busy = false; });
        }
      });
    }
    function all() {
      if (view === "tree") { leaves.forEach((_, i) => c.after(i * 25, () => markLeaf(i))); return; }
      const lim = 240;
      const gen = [];
      const rec = (cur, used) => {
        if (gen.length >= lim) return;
        if (cur.length === r) { gen.push(cur.slice()); return; }
        for (let k = 0; k < n; k++) { if (mode !== "Pi" && used[k]) continue; if (mode === "circ" && cur.length === 0 && k !== 0) continue; used[k] = 1; cur.push(k); rec(cur, used); cur.pop(); used[k] = 0; }
      };
      rec([], []);
      gen.forEach(a => found.set(key(a), a));
      drawList(); readout();
    }
    function drawList() {
      if (!listLayer) return;
      clear(listLayer);
      const items = [...found.values()];
      const tot = total();
      s("text", { x: 30, y: 392, "font-size": 15, text: `見つけたならび方：${found.size} / ${tot} 通り` }, listLayer);
      if (!items.length) return;
      if (mode === "circ") {
        const cell = 46, cols = Math.floor(740 / cell), maxRows = 3;
        items.slice(0, cols * maxRows).forEach((a, i) => {
          const cx = 30 + cell / 2 + (i % cols) * cell, cy = 428 + Math.floor(i / cols) * cell;
          s("circle", { cx, cy, r: 16, class: "thin" }, listLayer);
          a.forEach((k, j) => { const an = -Math.PI / 2 + j * 2 * Math.PI / n; s("circle", { cx: cx + 16 * Math.cos(an), cy: cy + 16 * Math.sin(an), r: 5, fill: COLORS[k] }, listLayer); });
        });
        if (items.length > cols * maxRows) s("text", { x: 770, y: 392, "text-anchor": "end", class: "mut", "font-size": 13, text: `（${cols * maxRows} 個まで表示）` }, listLayer);
        return;
      }
      const dot = r <= 3 ? 9 : 7, w = r * dot * 2 + 12, cols = Math.floor(740 / w), rowH = dot * 2 + 6, maxRows = Math.floor(150 / rowH);
      items.slice(0, cols * maxRows).forEach((a, i) => {
        const x = 30 + (i % cols) * w, y = 410 + Math.floor(i / cols) * rowH;
        a.forEach((k, j) => s("circle", { cx: x + dot + j * dot * 2, cy: y + dot, r: dot - 1, fill: COLORS[k] }, listLayer));
      });
      if (items.length > cols * maxRows) s("text", { x: 770, y: 392, "text-anchor": "end", class: "mut", "font-size": 13, text: `（${cols * maxRows} 個まで表示）` }, listLayer);
    }
    /* 樹形図 */
    let leaves = [];
    function drawTree() {
      leaves = [];
      const levels = r, x0 = 60, dx = Math.min(170, 640 / levels);
      const cnt = total(), top = 34, bottom = 530, gap = (bottom - top) / Math.max(1, cnt - 1);
      const rad = clamp(gap * 0.42, 7, 15);
      s("circle", { cx: x0 - 30, cy: (top + bottom) / 2, r: 5, class: "f-ink" }, G);
      for (let l = 0; l < levels; l++) s("text", { x: x0 + l * dx + dx * 0.5, y: 22, "text-anchor": "middle", class: "mut", "font-size": 13, text: `${l + 1}番目` }, G);
      // 位置計算と描画を2段で
      const nodes = [];
      const place = (path, used, depth) => {
        const kids = [];
        for (let k = 0; k < n; k++) if (mode === "Pi" || !used[k]) kids.push(k);
        const out = [];
        kids.forEach(k => {
          used[k] = (used[k] || 0) + 1; path.push(k);
          let y, children = [];
          if (depth === r - 1) { y = top + nodes.leafCount * gap; if (cnt === 1) y = (top + bottom) / 2; nodes.leafCount++; }
          else { children = place(path, used, depth + 1); y = children.reduce((t, o) => t + o.y, 0) / children.length; }
          out.push({ k, y, depth, children, path: path.slice() });
          path.pop(); used[k]--;
        });
        return out;
      };
      nodes.leafCount = 0;
      const roots = place([], [], 0);
      const edgeG = s("g", {}, G), nodeG = s("g", {}, G);
      leaves = [];
      const drawN = (list, px, py) => list.forEach(o => {
        const x = x0 + o.depth * dx + dx * 0.5;
        const e = s("line", { x1: px, y1: py, x2: x - rad, y2: o.y, class: "thin fadein", style: `animation-delay:${o.depth * .25}s` }, edgeG);
        const b = ball(nodeG, x, o.y, o.k, rad); b.classList.add("fadein"); b.style.animationDelay = `${o.depth * .25 + .1}s`;
        o.edge = e; o.node = b;
        if (o.children.length) drawN(o.children, x + rad, o.y);
        else {
          const lb = s("text", { x: x + rad + 10, y: o.y + 5, class: "mono fadein", "font-size": clamp(rad, 11, 14), style: `animation-delay:${r * .25}s`, text: o.path.map(k => k + 1).join("") }, nodeG);
          leaves.push({ o, lb });
          b.style.cursor = "pointer"; b.addEventListener("click", () => pickLeaf(leaves.findIndex(L => L.o === o)));
        }
      });
      drawN(roots, x0 - 25, (top + bottom) / 2);
      leaves.allNodes = roots;
      G.dataset.rad = rad;
    }
    function pathNodes(target) {
      const out = [];
      const walk = (list, acc) => { for (const o of list) { const a = acc.concat(o); if (o === target) { out.push(...a); return true; } if (walk(o.children, a)) return true; } return false; };
      walk(leaves.allNodes, []);
      return out;
    }
    function markLeaf(i) { const L = leaves[i]; if (!L) return; L.lb.style.fill = "var(--warm)"; L.lb.style.fontWeight = 700; found.set(key(L.o.path), L.o.path); readout(); }
    function pickLeaf(i) {
      const L = leaves[i]; if (!L) return;
      G.querySelectorAll("line").forEach(e => { e.setAttribute("class", "thin"); e.removeAttribute("stroke-width"); });
      pathNodes(L.o).forEach(o => { o.edge.setAttribute("class", "ink s-wm"); o.edge.setAttribute("stroke-width", 3.5); });
      markLeaf(i);
      readout(`えらんだ枝：${L.o.path.map(k => k + 1).join(" → ")}`);
    }
    function readout(extra) {
      const tot = total();
      let f;
      if (mode === "P") f = `${P(n, r)} = ${Array.from({ length: r }, (_, i) => n - i).join(" × ")} = <span class="big hl">${tot}</span> 通り`;
      else if (mode === "Pi") f = `${n}<sup>${r}</sup> = ${Array(r).fill(n).join(" × ")} = <span class="big hl">${tot}</span> 通り`;
      else f = `(${n}−1)! = ${n > 2 ? Array.from({ length: n - 1 }, (_, i) => n - 1 - i).join(" × ") : "1"} = <span class="big hl">${tot}</span> 通り<br><span class="mt">${n}! = ${fact(n)} 通りのならべ方を、回し方 ${n} 通りでわる</span>`;
      c.out(f + `<hr><span class="mt">見つけた：${found.size} / ${tot}</span>` + (extra ? `<br>${extra}` : ""));
    }
    reset();
  },
});

  detail: `<p>ₙCᵣ = ₙ₋₁Cᵣ₋₁ + ₙ₋₁Cᵣ のわけ：n 人から r 人えらぶとき、ある1人（Aさん）に注目します。Aさんを <b>えらぶ</b> なら、のこり n−1 人から r−1 人（ₙ₋₁Cᵣ₋₁ 通り）。<b>えらばない</b> なら、n−1 人から r 人（ₙ₋₁Cᵣ 通り）。たすと全部です。</p>
<p>二項定理：<span class="formula">(a+b)ⁿ = ₙC₀aⁿ + ₙC₁aⁿ⁻¹b + … + ₙCₙbⁿ</span> (a+b) を n 個かけるとき、b を r 個の かっこ から選ぶ選び方が ₙCᵣ 通りあるからです。（二項定理は数学Ⅱでくわしく学びます）</p>

        f += `<br><span class="mt">(a+b)<sup>${n}</sup> = ${terms.join(" + ")}</span>`;

/* --- 最短経路 --- */
sim({
  id: "route", cat: "cnt", name: "最短経路", sub: "→ と ↑ のならべ方",
  hint: "S から交差点をなぞって G まで行こう（右か上だけ）。×をおくこともできます",
  point: `<ul><li>最短の道は「→ を ${"w"} 回、↑ を ${"h"} 回」ならべたもの。</li>
<li>w+h 回のうち、どこで → を使うかをえらぶだけなので</li></ul>
<span class="formula"><sub>w+h</sub>C<sub>w</sub> ＝ (w+h)!／(w! h!)</span>
<ul><li>交差点に「そこまでの道の数」を書くと、<b>左からの数 ＋ 下からの数</b> になる（パスカルの三角形と同じ）。</li>
<li>通れない点（×）があっても、この「たし算」で数えられる。</li></ul>`,
  detail: `<p>たとえば横 5・たて 3 なら、→→→→→↑↑↑ の 8 個をならべる「同じものをふくむ順列」と考えて 8!／(5!3!) = 56 通り。8 か所から ↑ の場所 3 つをえらぶと考えても ₈C₃ = 56。</p>
<p><b>ある点 P を通る道</b>は、(S から P への道の数) × (P から G への道の数)。</p>
<p><b>ある点を通らない道</b>は、(全部の道) − (その点を通る道)。「×をおく」で通れない点をおくと、たし算の数え方で同じ答えになることを確かめられます。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let W = 5, H = 3, path = [[0, 0]], blocked = new Set(), mode = "walk", showNums = false;
    const found = new Set();
    c.slider("横 w", { min: 1, max: 8, value: W }, v => { W = v; reset(); });
    c.slider("たて h", { min: 1, max: 6, value: H }, v => { H = v; reset(); });
    c.seg("タップすると", [{ v: "walk", t: "道をなぞる" }, { v: "block", t: "×（通れない）をおく" }], mode, v => { mode = v; });
    c.row(c.btn("ランダムに1本", () => randomWalk(), { main: true }), c.btn("数を書きこむ", () => { showNums = true; draw(true); }), c.btn("リセット", () => { blocked.clear(); reset(); }));
    let sz, X0, Y0;
    const P = (i, j) => ({ x: X0 + i * sz, y: Y0 - j * sz });
    function dp() {
      const a = Array.from({ length: W + 1 }, () => Array(H + 1).fill(0));
      for (let i = 0; i <= W; i++) for (let j = 0; j <= H; j++) {
        if (blocked.has(i + "," + j)) { a[i][j] = 0; continue; }
        if (i === 0 && j === 0) { a[i][j] = 1; continue; }
        a[i][j] = (i > 0 ? a[i - 1][j] : 0) + (j > 0 ? a[i][j - 1] : 0);
      }
      return a;
    }
    function reset() { path = [[0, 0]]; found.clear(); showNums = false; blocked.forEach(k => { const [i, j] = k.split(",").map(Number); if (i > W || j > H) blocked.delete(k); }); draw(); }
    let numG;
    const RG = s("g", {}, svg);
    const hit = s("rect", { x: 0, y: 0, width: 800, height: 560, fill: "transparent" }, svg);
    hit.addEventListener("pointerdown", down);
    function draw(anim) {
      { const svg = clear(RG); drawInto(svg, anim); }
      readout();
    }
    function drawInto(svg, anim) {
      sz = Math.min(640 / W, 420 / H, 100); X0 = 400 - W * sz / 2; Y0 = 300 + H * sz / 2;
      for (let i = 0; i <= W; i++) { const a = P(i, 0), b = P(i, H); s("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "thin", "stroke-width": 2 }, svg); }
      for (let j = 0; j <= H; j++) { const a = P(0, j), b = P(W, j); s("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "thin", "stroke-width": 2 }, svg); }
      const pl = path.map(([i, j]) => { const p = P(i, j); return `${p.x},${p.y}`; }).join(" ");
      s("polyline", { points: pl, class: "ink s-wm", "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
      const S = P(0, 0), G = P(W, H);
      s("text", { x: S.x - 16, y: S.y + 30, class: "pointlbl", text: "S" }, svg);
      s("text", { x: G.x + 34, y: G.y + 8, class: "pointlbl", text: "G" }, svg);
      const a = dp();
      numG = s("g", {}, svg);
      for (let i = 0; i <= W; i++) for (let j = 0; j <= H; j++) {
        const p = P(i, j), k = i + "," + j;
        if (blocked.has(k)) { s("path", { d: `M${p.x - 11},${p.y - 11}l22,22m0,-22l-22,22`, class: "ink s-wm", "stroke-width": 4 }, svg); continue; }
        const end = path[path.length - 1];
        const isEnd = end[0] === i && end[1] === j;
        s("circle", { cx: p.x, cy: p.y, r: isEnd ? 9 : 5, class: isEnd ? "f-wm" : "f-ink" }, svg);
        if (showNums) {
          const t = s("text", { x: p.x + 8, y: p.y - 8, class: "mono ta" + (anim ? " pop" : ""), "font-size": Math.min(18, sz * 0.32), "font-weight": 700, text: a[i][j] }, numG);
          if (anim) t.style.animationDelay = `${(i + j) * 0.18}s`;
        }
      }
    }
    function near(pt) {
      let best = null, bd = 1e9;
      for (let i = 0; i <= W; i++) for (let j = 0; j <= H; j++) { const p = P(i, j), d = Math.hypot(p.x - pt.x, p.y - pt.y); if (d < bd) { bd = d; best = [i, j]; } }
      return bd < sz * 0.45 ? best : null;
    }
    function tryAdd(q) {
      if (!q) return;
      const k = q[0] + "," + q[1];
      const idx = path.findIndex(p => p[0] === q[0] && p[1] === q[1]);
      if (idx >= 0) { if (idx < path.length - 1) { path = path.slice(0, idx + 1); draw(); } return; }
      const e = path[path.length - 1];
      if (blocked.has(k)) return;
      if ((q[0] === e[0] + 1 && q[1] === e[1]) || (q[0] === e[0] && q[1] === e[1] + 1)) { path.push(q); arrive(); draw(); }
    }
    function arrive() { const e = path[path.length - 1]; if (e[0] === W && e[1] === H) found.add(path.map(p => p.join(",")).join("|")); }
    function down(e) {
      const q = near(svgPt(svg, e));
      if (mode === "block") {
        if (!q) return; const k = q.join(",");
        if ((q[0] === 0 && q[1] === 0) || (q[0] === W && q[1] === H)) return;
        blocked.has(k) ? blocked.delete(k) : blocked.add(k);
        path = [[0, 0]]; found.clear(); draw(); return;
      }
      const tgt = e.currentTarget; tgt.setPointerCapture(e.pointerId);
      tryAdd(q);
      const mv = ev => tryAdd(near(svgPt(svg, ev)));
      const up = () => { tgt.removeEventListener("pointermove", mv); tgt.removeEventListener("pointerup", up); };
      tgt.addEventListener("pointermove", mv); tgt.addEventListener("pointerup", up);
    }
    function randomWalk() {
      const a = dp();
      if (a[W][H] === 0) { c.out("通れる道がありません。×を減らしてね"); return; }
      // G から逆向きに、道の数に比例してえらぶ（どの道も同じ確率）
      let i = W, j = H; const back = [[i, j]];
      while (i || j) { const l = i > 0 ? a[i - 1][j] : 0, d = j > 0 ? a[i][j - 1] : 0; if (Math.random() * (l + d) < l) i--; else j--; back.push([i, j]); }
      const full = back.reverse(); path = [[0, 0]]; draw();
      full.slice(1).forEach((p, k) => c.after(90 * (k + 1), () => { path.push(p); if (k === full.length - 2) arrive(); draw(); }));
    }
    function readout() {
      const a = dp(), tot = a[W][H];
      const arrows = path.slice(1).map((p, k) => p[0] > path[k][0] ? "→" : "↑").join("");
      let f = blocked.size === 0
        ? `→ ${W} 個と ↑ ${H} 個のならべ方<br>${C(W + H, W)} = ${frac(fact(W + H), fact(W) * fact(H), true).replace(/<i>\d+<\/i><i>\d+<\/i>/, `<i>${W + H}!</i><i>${W}!×${H}!</i>`)} = <span class="big hl">${tot}</span> 通り`
        : `×をさけると <span class="big hl">${tot}</span> 通り<br><span class="mt">（×がなければ ${nCr(W + H, W)} 通り）</span>`;
      f += `<hr><span class="mono">${arrows || "（S からなぞってね）"}</span><br><span class="mt">見つけた道：${found.size} / ${tot}</span>`;
      c.out(f);
    }
    draw();
  },
});

sim({

<ul><li>0 個の人がいてもよい（仕切りがとなり合う・はしにある）。</li>

  detail: `<p>例：同じりんご 5 個を A・B・C の3人に分ける。○○｜○｜○○ は A=2, B=1, C=2。○ 5 個と｜2 本、合わせて 7 か所のうち｜の場所 2 つをえらぶので ₇C₂ = 21 通り。</p>

  build(c) {
    const svg = c.svg(800, 560);
    let n = 5, k = 3, atLeast = false;
    let bars = [];

    c.row(tg.el, c.btn("ランダム", () => { const L = len(); bars = shuffle([...Array(L).keys()]).slice(0, k - 1).sort((a, b) => a - b); makeHandles(); draw(); }, { main: true }), c.btn("次の分け方", () => next()));
    const free = () => atLeast ? n - k : n;
    const len = () => free() + k - 1;
    function init() {
      if (atLeast && n < k) { bars = []; draw(); return; }
      bars = Array.from({ length: k - 1 }, (_, i) => i);
      makeHandles(); draw();
    }
    function next() {
      // 仕切りの位置の組合せを辞書順で次へ
      const L = len(), m = k - 1; let i = m - 1;
      while (i >= 0 && bars[i] === L - m + i) i--;
      if (i < 0) bars = Array.from({ length: m }, (_, j) => j);
      else { bars[i]++; for (let j = i + 1; j < m; j++) bars[j] = bars[j - 1] + 1; }
      draw();
    }
    const body = s("g", {}, svg), HL = s("g", {}, svg);
    let handles = [];
    const geom = () => { const L = len(), cell = Math.min(64, 720 / L); return { L, cell, x0: 400 - (L - 1) * cell / 2, y: 150 }; };
    function makeHandles() {
      clear(HL); handles = [];
      if (atLeast && n < k) return;
      bars.forEach((b, bi) => {
        const hd = c.handle(svg, HL, 0, 0, nx => {
          const { L, cell, x0 } = geom();
          const p = clamp(Math.round((nx - x0) / cell), 0, L - 1);
          if (bars.includes(p)) return;
          bars[bi] = p; draw();
        }, { r: 1, hit: 30, onEnd: () => { bars.sort((a, b2) => a - b2); makeHandles(); draw(); } });
        s("rect", { x: -5, y: -40, width: 10, height: 80, rx: 3, class: "f-ink" }, hd.g);
        handles.push(hd);

    function draw() {

      if (handles.length !== bars.length) makeHandles();
      const { L, cell, x0, y } = geom();
      s("text", { x: 40, y: 50, class: "mut", "font-size": 15, text: `${free()} 個の ○ と ${k - 1} 本の ｜ を、${L} か所にならべる` }, svg);
      const sorted = bars.slice().sort((a, b) => a - b);
      const cs = (() => { const out = []; let prev = -1; [...sorted, L].forEach(b => { out.push(b - prev - 1); prev = b; }); return out; })();
      let person = 0;
      for (let p = 0; p < L; p++) {
        const x = x0 + p * cell;
        s("rect", { x: x - cell / 2 + 3, y: y - 34, width: cell - 6, height: 68, rx: 4, class: "f-chip" }, svg);
        if (sorted.includes(p)) { person++; continue; }
        s("circle", { cx: x, cy: y, r: Math.min(20, cell * 0.33), fill: COLORS[person], stroke: "var(--ink)", "stroke-width": 1.5 }, svg);
      }
      handles.forEach((hd, i) => hd.place(x0 + bars[i] * cell, y));
      const bw = Math.min(150, 720 / k), bx0 = 400 - (k - 1) * bw / 2;
      cs.forEach((m, i) => {
        const x = bx0 + i * bw, by = 470;
        s("path", { d: `M${x - bw * 0.36},${by - 90} L${x - bw * 0.3},${by} L${x + bw * 0.3},${by} L${x + bw * 0.36},${by - 90}`, class: "ink", fill: "var(--panel)" }, svg);
        const tot = m + (atLeast ? 1 : 0);
        for (let q = 0; q < tot; q++) {
          const cols = 3, rr = 11, gx = x + ((q % cols) - 1) * rr * 2.1, gy = by - rr - 2 - Math.floor(q / cols) * rr * 2;
          s("circle", { cx: gx, cy: gy, r: rr, fill: atLeast && q === 0 ? "var(--muted)" : COLORS[i], stroke: "var(--ink)", "stroke-width": 1 }, svg);
        }
        s("text", { x, y: by + 32, "text-anchor": "middle", class: "disp", "font-size": 20, text: `${names[i]}：${tot}個` }, svg);
      });
      if (atLeast) s("text", { x: 40, y: 545, class: "mut", "font-size": 13, text: "灰色の ○ は先に配った1個" }, svg);
      const tot = nCr(L, k - 1);
      c.out(`${names.slice(0, k).split("").map((nm, i) => `${nm}=${cs[i] + (atLeast ? 1 : 0)}`).join(", ")}<hr>${atLeast ? `1個ずつ配ったのこり ${free()} 個を分ける<br>` : ""}${C(L, k - 1)} = <span class="big hl">${tot}</span> 通り`);
    }
    init();
  },
});

    const cell = 64, gx = 70, gy = 90;
    const T = s("g", {}, svg), D = s("g", {}, svg);
    const isA = (a, b) => EV[ev].f(a, b);
    function draw() {
      clear(T);
      for (let i = 1; i <= 6; i++) { diceFace(T, gx + (i - 0.5) * cell, gy - 36, 40, i); diceFace(T, gx - 36, gy + (i - 0.5) * cell, 40, i); }
      s("text", { x: gx + 3 * cell, y: gy - 66, "text-anchor": "middle", class: "mut", "font-size": 13, text: "サイコロ B（青）" }, T);
      s("text", { x: gx - 62, y: gy + 3 * cell, "text-anchor": "middle", class: "mut", "font-size": 13, transform: `rotate(-90 ${gx - 62} ${gy + 3 * cell})`, text: "サイコロ A（赤）" }, T);
      let cnt = 0;
      for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) {
        const x = gx + (b - 1) * cell, y = gy + (a - 1) * cell;
        const inA = isA(a, b), on = comp ? !inA : inA;
        if (on) cnt++;
        s("rect", { x: x + 2, y: y + 2, width: cell - 4, height: cell - 4, rx: 4, class: on ? (comp ? "f-bls ink s-bl" : "f-wms ink s-wm") : "f-pn thin", "stroke-width": on ? 2 : 1 }, T);
        const sh = EV[ev].show;
        const v = sh === "sum" ? a + b : sh === "prod" ? a * b : sh === "diff" ? Math.abs(a - b) : `${a},${b}`;
        s("text", { x: x + cell / 2, y: y + cell / 2 + 6, "text-anchor": "middle", class: "mono" + (on ? "" : " mut"), "font-size": sh === "none" ? 14 : 18, "font-weight": on ? 700 : 400, text: v }, T);
        if (last && last[0] === a && last[1] === b) s("rect", { x: x - 2, y: y - 2, width: cell + 4, height: cell + 4, rx: 6, class: "ink", "stroke-width": 4 }, T);
      }
      const lbl = { sum: "マスの数字 = 和", prod: "マスの数字 = 積", diff: "マスの数字 = 差", none: "マス = (A の目, B の目)" }[EV[ev].show];
      s("text", { x: gx, y: gy + 6 * cell + 26, class: "mut", "font-size": 13, text: lbl }, T);
      // 結果の棒
      const bx = 520, by = 420, bw = 240;
      s("text", { x: bx, y: by - 14, "font-size": 14, text: "計算した確率と、実験の割合" }, T);
      const p = cnt / 36;
      s("rect", { x: bx, y: by, width: bw, height: 18, class: "f-chip" }, T);
      s("rect", { x: bx, y: by, width: bw * p, height: 18, class: comp ? "f-bl" : "f-wm" }, T);
      s("text", { x: bx + bw + 8, y: by + 14, class: "mono", "font-size": 13, text: fmt(p, 3) }, T);
      const rf = tries ? (comp ? (tries - hits) : hits) / tries : 0;
      s("rect", { x: bx, y: by + 28, width: bw, height: 18, class: "f-chip" }, T);
      s("rect", { x: bx, y: by + 28, width: bw * rf, height: 18, class: "f-ac" }, T);
      s("text", { x: bx + bw + 8, y: by + 42, class: "mono", "font-size": 13, text: tries ? fmt(rf, 3) : "—" }, T);
      s("text", { x: bx, y: by + 66, class: "mut", "font-size": 12.5, text: `上：計算　下：実験（${tries} 回中 ${comp ? tries - hits : hits} 回）` }, T);
      const name = comp ? `P(<span class="ov">A</span>)` : "P(A)";
      let f = `${name} = ${frac(cnt, 36, true)} = ${frac(cnt, 36)} <span class="mt">≒ ${fmt(p, 3)}</span>`;
      if (comp) { const ca = 36 - cnt; f += `<br>= 1 − P(A) = 1 − ${frac(ca, 36)} <span class="mt">（A は ${ca} マス）</span>`; }
      c.out(`<span class="big">${f}</span>`);
    }
    function showDice(a, b, spin) {
      clear(D);
      const da = diceFace(D, 580, 200, 96, a, { fill: "#fbe9e4", sw: 2.5 });
      const db = diceFace(D, 700, 200, 96, b, { fill: "#e3ecf8", sw: 2.5 });
      if (spin) { [da, db].forEach((d, i) => d.setAttribute("transform", d.getAttribute("transform") + ` rotate(${(Math.random() - .5) * 40})`)); }
      s("text", { x: 640, y: 290, "text-anchor": "middle", class: "disp", "font-size": 22, text: spin ? "…" : `${a} と ${b}` }, D);
      if (!spin) { const inA = isA(a, b), on = comp ? !inA : inA; s("text", { x: 640, y: 326, "text-anchor": "middle", class: on ? (comp ? "tb" : "tw") : "mut", "font-size": 20, "font-weight": 700, text: on ? "あたり！" : "はずれ" }, D); }
    }
    let rolling = false;
    function roll(times) {
      if (rolling) return;
      if (times > 1) {
        for (let i = 0; i < times; i++) { const a = rnd(6) + 1, b = rnd(6) + 1; tries++; if (isA(a, b)) hits++; last = [a, b]; }
        showDice(last[0], last[1]); draw(); return;
      }
      rolling = true; let t = 0;
      const tick = () => {
        showDice(rnd(6) + 1, rnd(6) + 1, true);
        if (++t < 9) c.after(60, tick);
        else { const a = rnd(6) + 1, b = rnd(6) + 1; tries++; if (isA(a, b)) hits++; last = [a, b]; showDice(a, b); draw(); rolling = false; }
      };
      tick();
    }
    showDice(3, 4); draw();
  },
});

/* --- 大数の法則 --- */
sim({
  id: "lln", cat: "prob", name: "大数の法則", sub: "たくさんやると確率に近づく",
  hint: "「×100」「×1000」でどんどん試してみよう。線は確率の値に近づいていきます",
  point: `<ul><li>実験を何回もくり返すと、あることがらが起こる <b>割合（相対度数）</b> は、その確率に近づいていく。</li>
<li>回数が少ないうちは大きくぶれる。10回では「たまたま」が大きい。</li>
<li>「もう1本」で何本も試すと、どの線も同じ値に集まっていく。</li></ul>`,
  detail: `<p>横の軸は「回数」を 1, 10, 100, 1000, 10000 と10倍ごとに同じ間かくでかいています（対数目盛り）。こうすると、はじめの大きなぶれも、あとの小さなぶれも見やすくなります。</p>
<p>注意：コインで表が5回続いても、次に裏が出やすくなるわけではありません。1回1回は前の結果に関係なく、いつも 1/2 です。たくさんの回数で「ならされる」ことで割合が 1/2 に近づきます。</p>
<p>反対に、実験で得た割合から確率を見つもることもできます（統計的確率）。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    const EX = {
      coin: { t: "コインの表", p: 1 / 2, pt: "1/2", trial: () => rnd(2) === 0, icon: v => v ? "表" : "裏" },
      die1: { t: "サイコロの 1", p: 1 / 6, pt: "1/6", trial: () => rnd(6) === 0, roll: true },
      sum7: { t: "2つのサイコロの和が 7", p: 1 / 6, pt: "1/6", trial: () => rnd(6) + rnd(6) + 2 === 7 },
      ge3: { t: "サイコロで 3 以上", p: 2 / 3, pt: "2/3", trial: () => rnd(6) >= 2 },
    };
    let ex = "coin", series = [], auto = false;
    c.seg("実験", Object.entries(EX).map(([v, o]) => ({ v, t: o.t })), ex, v => { ex = v; series = []; newSeries(); draw(); });
    c.row(c.btn("×1", () => run(1)), c.btn("×10", () => run(10)), c.btn("×100", () => run(100), { main: true }), c.btn("×1000", () => run(1000)));
    const ta = c.toggle("自動でつづける", false, v => { auto = v; });
    c.row(ta.el, c.btn("もう1本", () => { if (series.length >= 6) series.shift(); newSeries(); draw(); }), c.btn("リセット", () => { series = []; newSeries(); draw(); }));
    const MAX = 10000;
    function newSeries() { series.push({ n: 0, k: 0, pts: [], recent: [], color: COLORS[series.length % 10] }); }
    function run(m) {
      const S = series[series.length - 1];
      for (let i = 0; i < m && S.n < MAX; i++) { const v = EX[ex].trial(); S.n++; if (v) S.k++; S.recent.push(v); if (S.recent.length > 20) S.recent.shift(); S.pts.push(S.k / S.n); }
      draw();
    }
    c.every(120, () => { if (auto) { const S = series[series.length - 1]; if (S.n >= MAX) { ta.set(false); return; } run(Math.max(1, Math.ceil(S.n / 15))); } });
    const L = 80, R = 760, T = 110, B = 500;
    const xs = n => L + (R - L) * Math.log10(n) / 4, ys = v => B - (B - T) * v;
    function draw() {
      clear(svg);
      const e = EX[ex];
      for (let d = 0; d <= 4; d++) { const x = xs(10 ** d); s("line", { x1: x, y1: T, x2: x, y2: B, class: "thin", "stroke-opacity": .5 }, svg); s("text", { x, y: B + 22, "text-anchor": "middle", class: "mono mut", "font-size": 13, text: 10 ** d }, svg); }
      for (let v = 0; v <= 1.0001; v += 0.25) { s("line", { x1: L, y1: ys(v), x2: R, y2: ys(v), class: "thin", "stroke-opacity": .4 }, svg); s("text", { x: L - 10, y: ys(v) + 5, "text-anchor": "end", class: "mono mut", "font-size": 13, text: v.toFixed(2) }, svg); }
      s("text", { x: (L + R) / 2, y: B + 46, "text-anchor": "middle", class: "mut", "font-size": 13, text: "回数（10倍ごとに同じ幅）" }, svg);
      s("line", { x1: L, y1: ys(e.p), x2: R, y2: ys(e.p), class: "ink s-wm dash", "stroke-width": 2.5 }, svg);
      s("text", { x: R, y: ys(e.p) - 8, "text-anchor": "end", class: "tw tag", "font-weight": 700, text: `確率 ${e.pt} ≒ ${fmt(e.p, 3)}` }, svg);
      series.forEach((S, si) => {
        if (!S.pts.length) return;
        const step = Math.max(1, Math.floor(S.pts.length / 1500));
        const pts = [];
        for (let i = 0; i < S.pts.length; i += i < 200 ? 1 : step) pts.push(`${xs(i + 1)},${ys(S.pts[i])}`);
        pts.push(`${xs(S.pts.length)},${ys(S.pts[S.pts.length - 1])}`);
        const last = si === series.length - 1;
        s("polyline", { points: pts.join(" "), fill: "none", stroke: S.color, "stroke-width": last ? 2.6 : 1.6, "stroke-opacity": last ? 1 : .55, "stroke-linejoin": "round" }, svg);
        s("circle", { cx: xs(S.pts.length), cy: ys(S.pts[S.pts.length - 1]), r: last ? 6 : 4, fill: S.color }, svg);
      });
      // 最近の結果
      const S = series[series.length - 1];
      s("text", { x: L, y: 40, "font-size": 14, class: "mut", text: "さいきんの結果" }, svg);
      S.recent.forEach((v, i) => {
        const x = L + 120 + i * 28, y = 36;
        s("circle", { cx: x, cy: y, r: 11, class: v ? "f-wm" : "f-chip", stroke: "var(--ink)", "stroke-width": 1 }, svg);
        if (e.icon) s("text", { x, y: y + 4.5, "text-anchor": "middle", "font-size": 12, fill: v ? "#fff" : null, text: e.icon(v) }, svg);
      });
      s("text", { x: L, y: 76, "font-size": 15, text: `${e.t}　● = あたり` }, svg);
      const rf = S.n ? S.k / S.n : 0;
      c.out(`${S.n} 回中 ${S.k} 回 → 割合 <span class="big hl">${S.n ? fmt(rf, 4) : "—"}</span><br><span class="mt">確率 ${e.pt} ≒ ${fmt(e.p, 4)}　（ずれ ${S.n ? fmt(Math.abs(rf - e.p), 4) : "—"}）</span>`);
    }
    newSeries(); draw();
  },
});

/* --- 反復試行（ゴルトンボード） --- */
sim({
  id: "binom", cat: "prob", name: "反復試行", sub: "ゴルトンボードで玉を落とす",
  hint: "玉はくぎに当たるたびに、確率 p で右へ進みます。下の箱をタップすると計算が出ます",
  point: `<ul><li>確率 p のことを n 回くり返して、ちょうど k 回起こる確率：</li></ul>
<span class="formula">ₙCₖ pᵏ (1−p)ⁿ⁻ᵏ</span>
<ul><li>ₙCₖ は「n 回のうち、どの k 回で起こるか」のえらび方 ＝ その箱に行く道の数。</li>
<li>pᵏ(1−p)ⁿ⁻ᵏ は、その道1本を通る確率。</li>
<li>玉をたくさん落とすと、箱の玉の数が計算（● の印）に近い山の形になる。</li></ul>`,
  detail: `<p>ゴルトンボードでは、玉がくぎに当たるたびに右へ（確率 p）か左へ（確率 1−p）落ちます。n 段のくぎを通ると、右へ行った回数 k で入る箱が決まります。</p>
<p>k 回右へ行く道は ₙCₖ 本あり（最短経路と同じ考え方）、どの道も通る確率は pᵏ(1−p)ⁿ⁻ᵏ。だから箱 k に入る確率は ₙCₖ pᵏ(1−p)ⁿ⁻ᵏ です。</p>
<p>例：サイコロを 5 回ふって 1 の目がちょうど 2 回出る確率は ₅C₂ (1/6)²(5/6)³ = 1250/7776。</p>
<p>p = 1/2 のときは左右対称、p が小さいと山は左によります。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let n = 6, pi = 2, pickK = null;
    const PS = [{ v: 0, t: "1/6", p: 1 / 6, a: 1, b: 6 }, { v: 1, t: "1/3", p: 1 / 3, a: 1, b: 3 }, { v: 2, t: "1/2", p: 1 / 2, a: 1, b: 2 }, { v: 3, t: "2/3", p: 2 / 3, a: 2, b: 3 }];
    c.slider("くぎの段数 n", { min: 1, max: 12, value: n }, v => { n = v; reset(); });
    c.seg("右へ行く確率 p", PS.map(o => ({ v: o.v, t: o.t })), pi, v => { pi = v; reset(); });
    c.row(c.btn("1個", () => drop(1)), c.btn("10個", () => drop(10), { main: true }), c.btn("100個", () => drop(100)), c.btn("空にする", () => reset()));
    let bins = [], balls = [], queue = 0, total = 0;
    const g = { top: 60, bot: 530 };
    let dx, dy, X0;
    const layerStatic = s("g", {}, svg), layerBars = s("g", {}, svg), layerBalls = s("g", {}, svg);
    function geo() { dx = Math.min(56, 640 / (n + 1)); dy = Math.min(30, 230 / n); X0 = 400; }
    const pegX = (i, j) => X0 + (j - i / 2) * dx, pegY = i => g.top + 30 + i * dy;
    const binX = k => X0 + (k - n / 2) * dx;
    function reset() {
      bins = Array(n + 1).fill(0); balls.forEach(b => b.el.remove()); balls = []; queue = 0; total = 0;
      if (pickK != null && pickK > n) pickK = null;
      geo(); drawStatic(); drawBars();
    }
    function drawStatic() {
      clear(layerStatic);
      s("path", { d: `M${X0 - 26},${g.top - 30} L${X0 - 8},${g.top + 10} M${X0 + 26},${g.top - 30} L${X0 + 8},${g.top + 10}`, class: "ink" }, layerStatic);
      for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) s("circle", { cx: pegX(i, j), cy: pegY(i), r: 4, class: "f-ink" }, layerStatic);
      const binTop = pegY(n) + 10;
      for (let k = 0; k <= n + 1; k++) { const x = binX(k) - dx / 2; s("line", { x1: x, y1: binTop, x2: x, y2: g.bot, class: "thin" }, layerStatic); }
      s("line", { x1: binX(0) - dx / 2, y1: g.bot, x2: binX(n) + dx / 2, y2: g.bot, class: "ink" }, layerStatic);
      for (let k = 0; k <= n; k++) {
        const hit = s("rect", { x: binX(k) - dx / 2, y: binTop, width: dx, height: g.bot - binTop + 30, fill: "transparent", style: "cursor:pointer" }, layerStatic);
        s("text", { x: binX(k), y: g.bot + 20, "text-anchor": "middle", class: "mono", "font-size": Math.min(15, dx * 0.5), text: k }, layerStatic);
        hit.addEventListener("click", () => { pickK = k; drawBars(); });
      }
      s("text", { x: binX(n) + dx / 2 + 6, y: g.bot + 20, class: "mut", "font-size": 12, text: "← 右へ行った回数 k" }, layerStatic);
    }
    const prob = k => { const p = PS[pi].p; return nCr(n, k) * p ** k * (1 - p) ** (n - k); };
    function drawBars() {
      clear(layerBars);
      const binTop = pegY(n) + 18, H = g.bot - binTop;
      const maxP = Math.max(...bins.map((_, k) => prob(k)));
      const maxC = Math.max(1, ...bins);
      const scale = total ? H / Math.max(maxC, maxP * total) : H / maxP;
      for (let k = 0; k <= n; k++) {
        const x = binX(k), hb = bins[k] * scale;
        if (pickK === k) s("rect", { x: x - dx / 2, y: binTop - 8, width: dx, height: H + 8, class: "f-bls" }, layerBars);
        const he = (total ? prob(k) * total : prob(k)) * scale;
        s("rect", { x: x - dx * 0.38, y: g.bot - hb, width: dx * 0.76, height: hb, class: "f-ac", "fill-opacity": .85 }, layerBars);
        s("circle", { cx: x, cy: g.bot - he, r: 4.5, class: "f-wm", stroke: "var(--panel)", "stroke-width": 1.5 }, layerBars);
        if (bins[k] && dx > 26) s("text", { x, y: g.bot - Math.max(hb, he) - 10, "text-anchor": "middle", class: "mono ta", "font-size": 12, text: bins[k] }, layerBars);
      }
      readout();
    }
    function readout() {
      const o = PS[pi];
      let f = `<span class="mt">● = 計算から予想される数　■ = 実際の玉（${total} 個）</span>`;
      if (pickK != null) {
        const k = pickK;
        const num = nCr(n, k) * o.a ** k * (o.b - o.a) ** (n - k), den = o.b ** n;
        f = `右へちょうど ${k} 回（${n} 回中）<br>${C(n, k)} (${o.t})<sup>${k}</sup> (1−${o.t})<sup>${n - k}</sup><br>= ${nCr(n, k)} × ${frac(o.a ** k * (o.b - o.a) ** (n - k), den, true)} = ${den < 1e7 ? frac(num, den) : ""} <span class="big hl">≒ ${fmt(prob(k), 4)}</span>`
          + (total ? `<br><span class="mt">実験：${total} 個中 ${bins[k]} 個 → ${fmt(bins[k] / total, 4)}</span>` : "") + `<hr>` + f;
      } else f = `下の箱をタップすると、その箱に入る確率を計算します<hr>` + f;
      c.out(f);
    }
    function drop(m) { queue += m; }
    c.loop(dt => {
      if (queue > 0 && balls.length < 160) {
        const spawn = Math.min(queue, queue > 30 ? 4 : 1);
        for (let i = 0; i < spawn; i++) {
          if (balls.length && balls[balls.length - 1].t < 0.35 && queue <= 30) break;
          queue--;
          const el = s("circle", { r: Math.min(7, dx * 0.2), fill: COLORS[rnd(10)], stroke: "var(--ink)", "stroke-width": .8 }, layerBalls);
          balls.push({ el, row: -1, j: 0, t: 0, nj: 0 });
        }
      }
      const speed = queue > 30 ? 9 : 4.5;
      for (const b of balls) {
        b.t += dt * speed;
        while (b.t >= 1) {
          b.t -= 1; b.row++; b.j = b.nj;
          if (b.row < n) b.nj = b.j + (Math.random() < PS[pi].p ? 1 : 0);
          else { b.done = true; break; }
        }
        if (b.done) continue;
        let x0, y0, x1, y1;
        if (b.row < 0) { x0 = X0; y0 = g.top - 20; x1 = pegX(0, 0); y1 = pegY(0) - 9; }
        else { x0 = pegX(b.row, b.j); y0 = pegY(b.row) - 9; x1 = b.row + 1 < n ? pegX(b.row + 1, b.nj) : binX(b.nj); y1 = b.row + 1 < n ? pegY(b.row + 1) - 9 : g.bot - 8; }
        const t = b.t, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t - Math.sin(Math.PI * t) * dy * 0.3;
        b.el.setAttribute("cx", x); b.el.setAttribute("cy", y);
      }
      let changed = false;
      balls = balls.filter(b => { if (b.done) { bins[b.j]++; total++; b.el.remove(); changed = true; return false; } return true; });
      if (changed) drawBars();
    });
    reset();
  },
});

/* --- 条件付き確率 --- */
sim({
  id: "cond", cat: "prob", name: "条件付き確率", sub: "面積図と 1000 人の図",
  hint: "スライダーで割合を変えてみよう。「陽性なら本当に病気？」の答えは意外な値になります",
  point: `<ul><li>A が起こったときに B が起こる確率を <b>P<sub>A</sub>(B)</b> とかく（A の中での B の割合）。</li></ul>
<span class="formula">P<sub>A</sub>(B) = P(A∩B) ÷ P(A)</span>
<ul><li><b>乗法定理</b>：P(A∩B) = P(A) × P<sub>A</sub>(B)　（面積図のたて×横）</li>
<li>「B だったとき、原因が A である確率」P<sub>B</sub>(A) は、B 全体（色のついた所）の中で A∩B がしめる割合。</li></ul>`,
  detail: `<p>病気の検査の例：病気の人が 1%、病気の人が陽性になる確率 90%、病気でない人がまちがって陽性になる確率 5%。</p>

<script>

<li><b>傍心</b>：1つの内角と2つの外角の二等分線の交点。傍接円の中心（3つある）。</li></ul>`,
