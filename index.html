      legend.forEach(([k, t], i) => { const x = 40 + (i % 2) * 260, y = 32 + Math.floor(i / 2) * 26; s("rect", { x, y: y - 13, width: 18, height: 18, fill: COL[k], stroke: "var(--ink)", "stroke-width": 1 }, svg); s("text", { x: x + 26, y: y + 2, "font-size": 15, text: t }, svg); });
      if (view === "dots") {
        const cols = 40, sz = 17, x0 = 400 - cols * sz / 2, y0 = 100;
        const kinds = [["AB", nAB], ["AnB", nA - nAB], ["nAB", nnAB], ["nAnB", nnA - nnAB]];
        let i = 0;
        kinds.forEach(([k, m]) => { for (let q = 0; q < m; q++, i++) { const x = x0 + (i % cols) * sz, y = y0 + Math.floor(i / cols) * sz; s("rect", { x: x + 1.5, y: y + 1.5, width: sz - 3, height: sz - 3, rx: 2, fill: COL[k], stroke: k === "nAnB" ? "var(--line)" : "none" }, svg); } });
        s("text", { x: x0, y: y0 + 25 * sz + 24, class: "mut", "font-size": 13, text: `1マス = 1${o.unit}（全部で 1000${o.unit}）` }, svg);
      } else {
        const X = 150, Y = 100, S = 400;
        const w = S * a;
        const part = (x, y, ww, hh, k) => s("rect", { x, y, width: Math.max(0, ww), height: Math.max(0, hh), fill: COL[k], stroke: "var(--ink)", "stroke-width": 1.5 }, svg);
        part(X, Y + S * (1 - ba), w, S * ba, "AB"); part(X, Y, w, S * (1 - ba), "AnB");

        s("text", { x: X + w + (S - w) / 2, y: Y + S + 24, "text-anchor": "middle", class: "tag", text: `${o.nA} ${100 - pA}%` }, svg);
        s("text", { x: X - 8, y: Y + S * (1 - ba / 2) + 5, "text-anchor": "end", class: "tag tw", "font-weight": 700, text: `${pBA}%` }, svg);
        s("text", { x: X + S + 8, y: Y + S * (1 - bna / 2) + 5, class: "tag tb", "font-weight": 700, text: `${pBnA}%` }, svg);
        s("text", { x: X + S + 60, y: Y + 40, class: "mut", "font-size": 14, text: "横の長さ = P(A)" }, svg);
        s("text", { x: X + S + 60, y: Y + 62, class: "mut", "font-size": 14, text: "たての長さ = P_A(B)" }, svg);
        s("text", { x: X + S + 60, y: Y + 84, class: "mut", "font-size": 14, text: "面積 = 確率" }, svg);
      }
      const pAB = a * ba, pB = pAB + (1 - a) * bna, post = pB ? pAB / pB : 0;
      c.out(`P(A∩B) = P(A)×P<sub>A</sub>(B) = ${fmt(a, 2)}×${fmt(ba, 2)} = ${fmt(pAB, 4)}<br>P(B) = ${fmt(pAB, 4)} + ${fmt((1 - a) * bna, 4)} = ${fmt(pB, 4)}<hr><b>${o.B}のとき ${o.A} である確率</b><br>P<sub>B</sub>(A) = <span class="fr"><i>P(A∩B)</i><i>P(B)</i></span> = <span class="big hl">${fmt(post * 100, 1)}%</span><br><span class="mt">1000${o.unit}なら：${o.B} ${nAB + nnAB}${o.unit}のうち ${o.A} は ${nAB}${o.unit}</span>`);
    }

<script>
"use strict";
/* ===================== 図形の性質 ===================== */
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }), len: a => Math.hypot(a.x, a.y), dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  dot: (a, b) => a.x * b.x + a.y * b.y, cross: (a, b) => a.x * b.y - a.y * b.x,
  mid: (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }), perp: a => ({ x: -a.y, y: a.x }),
  lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }),
};
/* 直線 p1p2 と 直線 p3p4 の交点 */
function inter(p1, p2, p3, p4) {
  const d1 = V.sub(p2, p1), d2 = V.sub(p4, p3), den = V.cross(d1, d2);
  if (Math.abs(den) < 1e-9) return null;
  const t = V.cross(V.sub(p3, p1), d2) / den;
  return V.add(p1, V.mul(d1, t));
}
function foot(p, a, b) { const d = V.sub(b, a), t = V.dot(V.sub(p, a), d) / V.dot(d, d); return V.add(a, V.mul(d, t)); }
function angleAt(p, a, b) { const u = V.sub(a, p), v = V.sub(b, p); return deg(Math.acos(clamp(V.dot(u, v) / (V.len(u) * V.len(v) || 1), -1, 1))); }
function circum(A, B, Cc) {
  const d = 2 * (A.x * (B.y - Cc.y) + B.x * (Cc.y - A.y) + Cc.x * (A.y - B.y));
  if (Math.abs(d) < 1e-9) return null;
  const a2 = A.x ** 2 + A.y ** 2, b2 = B.x ** 2 + B.y ** 2, c2 = Cc.x ** 2 + Cc.y ** 2;
  return { x: (a2 * (B.y - Cc.y) + b2 * (Cc.y - A.y) + c2 * (A.y - B.y)) / d, y: (a2 * (Cc.x - B.x) + b2 * (A.x - Cc.x) + c2 * (B.x - A.x)) / d };
}
/* 長い直線（画面いっぱい） */
function longLine(g, p, q, cls, extra = {}) {
  const d = V.norm(V.sub(q, p)), a = V.add(p, V.mul(d, -3000)), b = V.add(p, V.mul(d, 3000));
  return s("line", Object.assign({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: cls }, extra), g);
}
function seg(g, p, q, cls, extra = {}) { return s("line", Object.assign({ x1: p.x, y1: p.y, x2: q.x, y2: q.y, class: cls }, extra), g); }
/* 角の弧：頂点 p、向き a・b の間 */
function arcAt(g, p, a, b, r, cls, extra = {}) {
  let t1 = Math.atan2(a.y - p.y, a.x - p.x), t2 = Math.atan2(b.y - p.y, b.x - p.x);
  let d = t2 - t1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const e = t1 + d;
  const P1 = { x: p.x + r * Math.cos(t1), y: p.y + r * Math.sin(t1) }, P2 = { x: p.x + r * Math.cos(e), y: p.y + r * Math.sin(e) };
  return s("path", Object.assign({ d: `M${p.x},${p.y} L${P1.x},${P1.y} A${r},${r} 0 0 ${d > 0 ? 1 : 0} ${P2.x},${P2.y} Z`, class: cls }, extra), g);
}
function bisDir(p, a, b) { return V.norm(V.add(V.norm(V.sub(a, p)), V.norm(V.sub(b, p)))); }
function angleLabel(g, p, a, b, r, text, cls = "tag") {
  const d = bisDir(p, a, b), q = V.add(p, V.mul(d, r));

}
function tick(g, p, q, n = 1, cls = "ink") {
  const m = V.mid(p, q), d = V.norm(V.sub(q, p)), nn = V.perp(d);
  for (let i = 0; i < n; i++) { const c0 = V.add(m, V.mul(d, (i - (n - 1) / 2) * 6)); seg(g, V.add(c0, V.mul(nn, -7)), V.add(c0, V.mul(nn, 7)), cls, { "stroke-width": 2 }); }
}
const lbl = (P, Q) => `${P}${Q}`;
/* ドラッグできる三角形（共通） */
function triangleHandles(c, svg, layer, pts, onChange, names = ["A", "B", "C"]) {
  const H = [];
  const center = () => ({ x: (H[0].x + H[1].x + H[2].x) / 3, y: (H[0].y + H[1].y + H[2].y) / 3 });
  pts.forEach((p, i) => {
    H.push(c.handle(svg, layer, p.x, p.y, (x, y, hd) => { hd.place(clamp(x, 20, 780), clamp(y, 20, 540)); H.forEach(o => o.relabel()); onChange(); },
      { label: names[i], labelOffset: hd => { const cc = H.length === 3 ? center() : { x: 400, y: 300 }; const d = V.norm(V.sub(hd, cc)); return { x: d.x * 24, y: d.y * 24 }; } }));
  });
  H.forEach(o => o.relabel());
  return H;
}

/* --- 三角形の五心 --- */
sim({
  id: "centers", cat: "geo", name: "三角形の五心", sub: "外心・内心・重心・垂心・傍心",
  formula: `<span class="cw">OA = OB = OC</span>　<span class="cb">AG : GM = 2 : 1</span>　<span class="ca">内接円の半径 r</span>`,
  hint: "A・B・C の点をドラッグして、三角形の形を変えてみよう",
  point: `<ul><li><b>外心 O</b>：3辺の垂直二等分線の交点。外接円の中心（OA=OB=OC）。</li>
<li><b>内心 I</b>：3つの角の二等分線の交点。内接円の中心（3辺までの距離が等しい）。</li>
<li><b>重心 G</b>：3本の中線の交点。中線を <b>2：1</b> に分ける。</li>
<li><b>垂心 H</b>：3つの頂点から対辺へひいた垂線の交点。</li>
<li><b>傍心</b>：1つの内角と2つの外角の二等分線の交点。傍接円の中心（3つある）。</li></ul>`,
  detail: `<p>どの心も「3本の線が1点で交わる」ことがポイント。2本の交点を求めれば、3本目も必ずそこを通ります。</p>
<p>外心は、鋭角三角形なら内部、直角三角形なら <b>斜辺の中点</b>、鈍角三角形なら外部にあります。垂心も同じように動きます（直角三角形では直角の頂点）。三角形を動かして確かめよう。</p>
<p><b>オイラー線</b>：正三角形でなければ、外心 O・重心 G・垂心 H は一直線にならび、OG：GH = 1：2 になります。</p>
<p>正三角形では、外心・内心・重心・垂心がすべて同じ点になります。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    const on = { O: true, I: false, G: false, H: false, E: false, L: false };
    const T = { O: ["外心 O", "var(--warm)"], I: ["内心 I", "var(--accent)"], G: ["重心 G", "var(--blue)"], H: ["垂心 H", "var(--violet)"], E: ["傍心", "var(--gold)"], L: ["オイラー線", "var(--ink)"] };
    c.label("表示するもの");
    const tg = Object.keys(T).map(k => c.toggle(T[k][0], on[k], v => { on[k] = v; draw(); }, T[k][1]));
    c.row(...tg.map(t => t.el));
    c.row(c.btn("正三角形", () => setT([{ x: 400, y: 90 }, { x: 230, y: 385 }, { x: 570, y: 385 }])), c.btn("直角三角形", () => setT([{ x: 260, y: 120 }, { x: 260, y: 420 }, { x: 600, y: 420 }])), c.btn("鈍角三角形", () => setT([{ x: 300, y: 300 }, { x: 160, y: 420 }, { x: 660, y: 420 }])));
    const G = s("g", {}, svg), HL = s("g", {}, svg);
    const H = triangleHandles(c, svg, HL, [{ x: 330, y: 110 }, { x: 180, y: 420 }, { x: 610, y: 420 }], () => draw());
    function setT(ps) { ps.forEach((p, i) => H[i].place(p.x, p.y)); H.forEach(o => o.relabel()); draw(); }
    function dotL(p, name, col) {
      s("circle", { cx: p.x, cy: p.y, r: 6, fill: col, stroke: "var(--panel)", "stroke-width": 2 }, G);
      s("text", { x: p.x + 10, y: p.y - 9, class: "pointlbl", "font-size": 18, fill: col, text: name }, G);
    }
    function draw() {
      clear(G);
      const [A, B, Cc] = H.map(o => ({ x: o.x, y: o.y }));
      const a = V.dist(B, Cc), b = V.dist(Cc, A), cl = V.dist(A, B);
      const area = Math.abs(V.cross(V.sub(B, A), V.sub(Cc, A))) / 2;
      s("polygon", { points: `${A.x},${A.y} ${B.x},${B.y} ${Cc.x},${Cc.y}`, class: "ink", fill: "var(--panel)", "fill-opacity": .5, "stroke-width": 2.5 }, G);
      const lines = [];
      let info = [];
      const Ang = [angleAt(A, B, Cc), angleAt(B, Cc, A), angleAt(Cc, A, B)];
      if (area < 50) { c.out("三角形がつぶれています。点を動かしてね"); return; }
      const Oc = circum(A, B, Cc), R = V.dist(Oc, A);
      const Gc = { x: (A.x + B.x + Cc.x) / 3, y: (A.y + B.y + Cc.y) / 3 };
      const Hc = { x: A.x + B.x + Cc.x - 2 * Oc.x, y: A.y + B.y + Cc.y - 2 * Oc.y };
      const per = a + b + cl, Ic = { x: (a * A.x + b * B.x + cl * Cc.x) / per, y: (a * A.y + b * B.y + cl * Cc.y) / per }, r = 2 * area / per;
      if (on.E) {
        const col = T.E[1];
        [[-a, b, cl, a], [a, -b, cl, b], [a, b, -cl, cl]].forEach(([wa, wb, wc, side], i) => {
          const sw = wa + wb + wc, E = { x: (wa * A.x + wb * B.x + wc * Cc.x) / sw, y: (wa * A.y + wb * B.y + wc * Cc.y) / sw }, re = area / ((per / 2) - side);
          s("circle", { cx: E.x, cy: E.y, r: re, fill: "none", stroke: col, "stroke-width": 1.8, "stroke-dasharray": "3 4" }, G);
          [A, B, Cc].forEach(P => seg(G, P, E, "thin", { stroke: col, "stroke-opacity": .6 }));
          dotL(E, ["I_A", "I_B", "I_C"][i], col);
        });
        // 三角形の辺をのばす
        [[A, B], [B, Cc], [Cc, A]].forEach(([p, q]) => longLine(G, p, q, "thin dash"));
      }
      if (on.O) {
        const col = T.O[1];
        [[B, Cc, 1], [Cc, A, 2], [A, B, 3]].forEach(([p, q, n]) => { const m = V.mid(p, q); longLine(G, m, V.add(m, V.perp(V.sub(q, p))), "thin", { stroke: col, "stroke-width": 1.4 }); tick(G, p, m, n, "ink s-wm"); tick(G, m, q, n, "ink s-wm"); });
        s("circle", { cx: Oc.x, cy: Oc.y, r: R, fill: "none", stroke: col, "stroke-width": 2.2 }, G);
        [A, B, Cc].forEach(P => seg(G, Oc, P, "dash", { stroke: col, "stroke-width": 1.6 }));
        dotL(Oc, "O", col);
        const pos = Math.max(...Ang) > 90.05 ? "三角形の外" : Math.max(...Ang) > 89.95 ? "斜辺の中点" : "三角形の中";
        info.push(`<span class="hl">外心 O</span>：OA = OB = OC = ${fmt(R)}（外接円の半径）<br><span class="mt">いまは ${pos}</span>`);
      }
      if (on.I) {
        const col = T.I[1];
        [[A, B, Cc], [B, Cc, A], [Cc, A, B]].forEach(([P, Q, Rr]) => { const D = inter(P, Ic, Q, Rr); if (D) seg(G, P, D, "", { stroke: col, "stroke-width": 1.6 }); arcAt(G, P, Q, Ic, 22, "", { fill: col, "fill-opacity": .25 }); arcAt(G, P, Ic, Rr, 26, "", { fill: col, "fill-opacity": .12 }); });
        s("circle", { cx: Ic.x, cy: Ic.y, r, fill: "none", stroke: col, "stroke-width": 2.2 }, G);
        [[B, Cc], [Cc, A], [A, B]].forEach(([p, q]) => { const F = foot(Ic, p, q); seg(G, Ic, F, "dash", { stroke: col, "stroke-width": 1.4 }); });
        dotL(Ic, "I", col);
        info.push(`<span class="ac">内心 I</span>：3辺までの距離 = ${fmt(r)}（内接円の半径）`);
      }
      if (on.G) {
        const col = T.G[1];
        [[A, V.mid(B, Cc)], [B, V.mid(Cc, A)], [Cc, V.mid(A, B)]].forEach(([P, M]) => { seg(G, P, M, "", { stroke: col, "stroke-width": 1.8 }); s("circle", { cx: M.x, cy: M.y, r: 3.5, fill: col }, G); });
        [[B, Cc], [Cc, A], [A, B]].forEach(([p, q], i) => { const M = V.mid(p, q); tick(G, p, M, i + 1, "ink s-bl"); tick(G, M, q, i + 1, "ink s-bl"); });
        dotL(Gc, "G", col);
        const Ma = V.mid(B, Cc);
        info.push(`<span class="bl">重心 G</span>：AG：GM = ${fmt(V.dist(A, Gc))}：${fmt(V.dist(Gc, Ma))} = 2：1`);
      }
      if (on.H) {
        const col = T.H[1];
        [[A, B, Cc], [B, Cc, A], [Cc, A, B]].forEach(([P, Q, Rr]) => {
          const F = foot(P, Q, Rr); seg(G, P, F, "", { stroke: col, "stroke-width": 1.8 });
          const t = V.dot(V.sub(F, Q), V.sub(Rr, Q)) / V.dot(V.sub(Rr, Q), V.sub(Rr, Q));
          if (t < 0 || t > 1) seg(G, t < 0 ? Q : Rr, F, "dash", { stroke: col, "stroke-width": 1.2 });
          seg(G, Hc, P, "dash", { stroke: col, "stroke-width": 1.2 });
          const u = V.norm(V.sub(Rr, Q)), w = V.norm(V.sub(P, F)), k = 10;
          if (V.dist(P, F) > 12) s("path", { d: `M${F.x + u.x * k},${F.y + u.y * k} L${F.x + u.x * k + w.x * k},${F.y + u.y * k + w.y * k} L${F.x + w.x * k},${F.y + w.y * k}`, fill: "none", stroke: col, "stroke-width": 1.5 }, G);
        });
        dotL(Hc, "H", col);
        info.push(`<span style="color:var(--violet);font-weight:700">垂心 H</span>：3本の垂線が1点で交わる`);
      }
      if (on.L) {
        if (V.dist(Oc, Hc) > 2) {
          longLine(G, Oc, Hc, "ink", { "stroke-width": 2.5, "stroke-dasharray": "12 6" });
          if (!on.O) dotL(Oc, "O", T.O[1]); if (!on.G) dotL(Gc, "G", T.G[1]); if (!on.H) dotL(Hc, "H", T.H[1]);
          info.push(`<b>オイラー線</b>：OG：GH = ${fmt(V.dist(Oc, Gc))}：${fmt(V.dist(Gc, Hc))} = 1：2`);
        } else info.push(`正三角形なので O・G・H が重なっています`);
      }
      c.out(`∠A = ${fmt(Ang[0])}°, ∠B = ${fmt(Ang[1])}°, ∠C = ${fmt(Ang[2])}°<hr>${info.join("<br>") || '<span class="mt">上の「表示するもの」をえらんでね</span>'}`);
    }
    draw();
  },
});

/* --- 角の二等分線と比 --- */
sim({
  id: "bisector", cat: "geo", name: "角の二等分線と比", sub: "AB：AC = BD：DC",
  formula: `<span class="cw">AB</span> : <span class="ca">AC</span> = <span class="cw">BD</span> : <span class="ca">DC</span>`,
  hint: "点をドラッグして形を変えても、2本の帯の分かれ目はいつもそろいます",
  point: `<ul><li>∠A の二等分線が BC と交わる点を D とすると</li></ul>
<span class="formula">AB：AC = BD：DC</span>
<ul><li>外角の二等分線と BC の延長の交点 E でも <b>AB：AC = BE：EC</b>（外分）。</li>
<li>下の帯グラフで、上（AB：AC）と下（BD：DC）の分かれ目がそろっていることを確かめよう。</li></ul>`,
  detail: `<p>証明のアイデア：C を通って AD に平行な線をひき、BA の延長との交点を E とすると、∠ACE = ∠AEC となり AE = AC。平行線と比の性質から BD：DC = BA：AE = AB：AC。</p>
<p>面積で考えることもできます：△ABD と △ADC は、D から見た高さが同じなので面積の比 = BD：DC。また A から見ると、AD をはさむ角が等しいので面積の比 = AB：AC。</p>
<p>計算例：AB = 6、AC = 4、BC = 5 なら BD = 5 × 6/(6+4) = 3。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let ext = false;
    const t = c.toggle("外角の二等分線も", ext, v => { ext = v; draw(); }, "var(--blue)");
    c.row(t.el);
    const G = s("g", {}, svg), HL = s("g", {}, svg);
    const H = triangleHandles(c, svg, HL, [{ x: 300, y: 90 }, { x: 150, y: 380 }, { x: 560, y: 380 }], () => draw());
    function bar(y, l1, l2, n1, n2, col1, col2) {
      const X = 120, W = 560, t1 = l1 / (l1 + l2);
      s("rect", { x: X, y, width: W * t1, height: 26, fill: col1 }, G);
      s("rect", { x: X + W * t1, y, width: W * (1 - t1), height: 26, fill: col2 }, G);
      s("rect", { x: X, y, width: W, height: 26, class: "ink", "stroke-width": 1.5 }, G);
      s("text", { x: X - 10, y: y + 19, "text-anchor": "end", "font-size": 15, text: `${n1}：${n2}` }, G);
      s("text", { x: X + W * t1 / 2, y: y + 19, "text-anchor": "middle", class: "mono", "font-size": 14, fill: "#fff", text: fmt(l1) }, G);
      s("text", { x: X + W * t1 + W * (1 - t1) / 2, y: y + 19, "text-anchor": "middle", class: "mono", "font-size": 14, fill: "#fff", text: fmt(l2) }, G);
      return X + W * t1;
    }
    function draw() {
      clear(G);
      const [A, B, Cc] = H.map(o => ({ x: o.x, y: o.y }));
      if (Math.abs(V.cross(V.sub(B, A), V.sub(Cc, A))) < 100) { c.out("三角形がつぶれています"); return; }
      const ab = V.dist(A, B), ac = V.dist(A, Cc);
      const D = V.lerp(B, Cc, ab / (ab + ac));
      s("polygon", { points: `${A.x},${A.y} ${B.x},${B.y} ${Cc.x},${Cc.y}`, class: "ink", fill: "var(--panel)", "fill-opacity": .5, "stroke-width": 2.5 }, G);
      seg(G, B, D, "", { stroke: "var(--warm)", "stroke-width": 6, "stroke-opacity": .6 });
      seg(G, D, Cc, "", { stroke: "var(--accent)", "stroke-width": 6, "stroke-opacity": .6 });
      seg(G, A, B, "", { stroke: "var(--warm)", "stroke-width": 3 });
      seg(G, A, Cc, "", { stroke: "var(--accent)", "stroke-width": 3 });
      arcAt(G, A, B, D, 40, "", { fill: "var(--gold)", "fill-opacity": .35, stroke: "var(--gold)" });
      arcAt(G, A, D, Cc, 46, "", { fill: "var(--gold)", "fill-opacity": .18, stroke: "var(--gold)" });
      angleLabel(G, A, B, D, 60, "●"); angleLabel(G, A, D, Cc, 64, "●");
      seg(G, A, D, "ink", { "stroke-width": 2.5 });
      s("circle", { cx: D.x, cy: D.y, r: 6, class: "f-ink" }, G);
      s("text", { x: D.x, y: D.y + 28, "text-anchor": "middle", class: "pointlbl", text: "D" }, G);
      let extra = "";
      if (ext) {
        if (Math.abs(ab - ac) < 1) extra = `<br><span class="mt">AB = AC のとき、外角の二等分線は BC と平行で交わらない</span>`;
        else {
          const E = V.add(B, V.mul(V.sub(Cc, B), ab / (ab - ac)));
          longLine(G, B, Cc, "thin dash");
          seg(G, A, E, "", { stroke: "var(--blue)", "stroke-width": 2.2 });
          s("circle", { cx: E.x, cy: E.y, r: 6, class: "f-bl" }, G);
          s("text", { x: E.x, y: E.y + 28, "text-anchor": "middle", class: "pointlbl tb", text: "E" }, G);
          extra = `<br><span class="bl">BE：EC = ${fmt(V.dist(B, E))}：${fmt(V.dist(E, Cc))} = ${fmt(V.dist(B, E) / V.dist(E, Cc), 3)}</span>`;
        }
      }
      const x1 = bar(450, ab, ac, "AB", "AC", "var(--warm)", "var(--accent)");
      const bd = V.dist(B, D), dc = V.dist(D, Cc);
      bar(500, bd, dc, "BD", "DC", "var(--warm)", "var(--accent)");
      s("line", { x1, y1: 440, x2: x1, y2: 536, class: "ink dash", "stroke-width": 2 }, G);
      c.out(`AB：AC = ${fmt(ab)}：${fmt(ac)} → <span class="hl">${fmt(ab / ac, 3)}</span><br>BD：DC = ${fmt(bd)}：${fmt(dc)} → <span class="hl">${fmt(bd / dc, 3)}</span>${extra}`);
    }
    draw();
  },
});

/* --- チェバ・メネラウス --- */
sim({
  id: "ceva", cat: "geo", name: "チェバとメネラウス", sub: "比のかけ算はいつも 1",
  formula: `<span class="cv">AF/FB</span> × <span class="cw">BD/DC</span> × <span class="ca">CE/EA</span> = 1`,
  hint: "点 P（チェバ）や 直線の2点（メネラウス）をドラッグ。比のかけ算はいつも 1 になります",
  point: `<ul><li><b>チェバの定理</b>：三角形の頂点と点 P を結ぶ線が対辺と D・E・F で交わるとき</li></ul>
<span class="formula">(BD/DC)×(CE/EA)×(AF/FB) = 1</span>
<ul><li><b>メネラウスの定理</b>：直線が3辺（またはその延長）と D・E・F で交わるときも、同じ形の式が成り立つ。</li>
<li>覚え方：<b>頂点 → 分点 → 頂点 → 分点 …</b> と三角形をひとまわり。「読む順を見る」で確かめよう。</li></ul>`,
  detail: `<p>チェバの定理は、面積の比で証明できます。BD：DC = △ABP：△ACP など、3つの比をかけると面積が約分されて 1 になります。</p>
<p>メネラウスの定理は、三角形の頂点から直線へ平行線をひいて、平行線と比を使って証明します。</p>
<p>使い方：3つの比のうち2つがわかれば、のこり1つが求まります。たとえば BD：DC = 1：2、CE：EA = 3：1 なら AF：FB = 2：3。</p>
<p>P を三角形の外に出しても（線を延長すれば）チェバの定理は成り立ちます。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let mode = "ceva";
    c.seg("定理", [{ v: "ceva", t: "チェバ" }, { v: "men", t: "メネラウス" }], mode, v => { mode = v; ph.forEach(o => o.g.style.display = mode === "ceva" ? "" : "none"); lh.forEach(o => o.g.style.display = mode === "men" ? "" : "none"); draw(); });
    c.row(c.btn("読む順を見る", () => trace(), { main: true }));
    const G = s("g", {}, svg), TR = s("g", {}, svg), HL = s("g", {}, svg);
    const H = triangleHandles(c, svg, HL, [{ x: 330, y: 80 }, { x: 140, y: 440 }, { x: 600, y: 440 }], () => draw());
    const ph = [c.handle(svg, HL, 340, 300, (x, y, hd) => { hd.place(x, y); draw(); }, { label: "P", color: "var(--blue)", labelOffset: () => ({ x: 18, y: -12 }) })];
    const lh = [c.handle(svg, HL, 120, 200, (x, y, hd) => { hd.place(x, y); draw(); }, { color: "var(--blue)" }), c.handle(svg, HL, 720, 380, (x, y, hd) => { hd.place(x, y); draw(); }, { color: "var(--blue)" })];
    lh.forEach(o => o.g.style.display = "none");
    let last = null;
    function draw() {
      clear(G); clear(TR);
      const [A, B, Cc] = H.map(o => ({ x: o.x, y: o.y }));
      if (Math.abs(V.cross(V.sub(B, A), V.sub(Cc, A))) < 100) { c.out("三角形がつぶれています"); return; }
      let D, E, F;
      if (mode === "ceva") {
        const Pp = { x: ph[0].x, y: ph[0].y };
        D = inter(A, Pp, B, Cc); E = inter(B, Pp, Cc, A); F = inter(Cc, Pp, A, B);
      } else {
        const L1 = { x: lh[0].x, y: lh[0].y }, L2 = { x: lh[1].x, y: lh[1].y };
        D = inter(L1, L2, B, Cc); E = inter(L1, L2, Cc, A); F = inter(L1, L2, A, B);
        longLine(G, L1, L2, "", { stroke: "var(--blue)", "stroke-width": 2.5 });
      }
      [[A, B], [B, Cc], [Cc, A]].forEach(([p, q]) => longLine(G, p, q, "thin dash"));
      s("polygon", { points: `${A.x},${A.y} ${B.x},${B.y} ${Cc.x},${Cc.y}`, class: "ink", fill: "var(--panel)", "fill-opacity": .5, "stroke-width": 2.5 }, G);
      if (!D || !E || !F) { c.out("平行になって交わらない線があります。少し動かしてね"); last = null; return; }
      if (mode === "ceva") { const Pp = { x: ph[0].x, y: ph[0].y }; [[A, D], [B, E], [Cc, F]].forEach(([p, q]) => { seg(G, p, q, "", { stroke: "var(--blue)", "stroke-width": 1.8 }); seg(G, Pp, q, "", { stroke: "var(--blue)", "stroke-width": 1.8 }); seg(G, Pp, p, "", { stroke: "var(--blue)", "stroke-width": 1.8 }); }); }
      const cols = ["var(--warm)", "var(--accent)", "var(--violet)"];
      [[B, D, Cc, 0], [Cc, E, A, 1], [A, F, B, 2]].forEach(([p, m, q, i]) => {
        seg(G, p, m, "", { stroke: cols[i], "stroke-width": 6, "stroke-opacity": .55, "stroke-linecap": "round" });
        seg(G, m, q, "", { stroke: cols[i], "stroke-width": 6, "stroke-opacity": .25, "stroke-linecap": "round" });
      });
      [[D, "D"], [E, "E"], [F, "F"]].forEach(([p, n]) => { s("circle", { cx: p.x, cy: p.y, r: 6, class: "f-ink" }, G); s("text", { x: p.x + 12, y: p.y + 22, class: "pointlbl", "font-size": 19, text: n }, G); });
      const r1 = V.dist(B, D) / V.dist(D, Cc), r2 = V.dist(Cc, E) / V.dist(E, A), r3 = V.dist(A, F) / V.dist(F, B);
      last = { A, B, Cc, D, E, F };
      c.out(`<span style="color:var(--violet)">AF/FB</span> × <span class="hl">BD/DC</span> × <span class="ac">CE/EA</span><br>= <span style="color:var(--violet)">${fmt(r3, 3)}</span> × <span class="hl">${fmt(r1, 3)}</span> × <span class="ac">${fmt(r2, 3)}</span><br>= <span class="big">${fmt(r1 * r2 * r3, 3)}</span>`);
    }
    function trace() {
      if (!last) return;
      const { A, B, Cc, D, E, F } = last;
      const order = [[A, F, "A"], [F, B, "F"], [B, D, "B"], [D, Cc, "D"], [Cc, E, "C"], [E, A, "E"]];
      clear(TR);
      const dot = s("circle", { r: 10, class: "f-gd", stroke: "var(--ink)", "stroke-width": 2 }, TR);
      const txt = s("text", { x: 400, y: 40, "text-anchor": "middle", class: "disp", "font-size": 24 }, TR);
      let i = 0, t = 0, seq = "";
      c.loop(dt => {
        t += dt * 1.2;
        if (t >= 1) { t = 0; seq += (i % 2 === 0 ? order[i][2] + order[i + 1][2] + (i < 4 ? "/" : "/") : "") ; i++; if (i >= order.length) { txt.textContent = "AF/FB × BD/DC × CE/EA = 1"; dot.remove(); return false; } }
        const [p, q] = order[i];
        const pos = V.lerp(p, q, t);
        setA(dot, { cx: pos.x, cy: pos.y });
        const parts = ["A→F", "F→B", "B→D", "D→C", "C→E", "E→A"];
        txt.textContent = parts.slice(0, i + 1).join("  ") + (i % 2 === 0 ? "（分子）" : "（分母）");
      });
    }
    draw();
  },
});

/* --- 円周角の定理など --- */
sim({
  id: "inscribed", cat: "geo", name: "円周角と円", sub: "円周角・内接四角形・接弦定理",
  formula: `<span class="ca">円周角</span> = <span class="cw">中心角</span> ÷ 2　　内接四角形：∠A + ∠C = 180°`,
  hint: "円の上の点をドラッグ。どこへ動かしても角の大きさは変わりません",
  point: `<ul><li><b>円周角の定理</b>：同じ弧に対する円周角は <b>どこでも等しく</b>、中心角の <b>半分</b>。</li>
<li>半円の弧（直径）に対する円周角は <b>90°</b>。</li>
<li><b>円に内接する四角形</b>：向かい合う角の和は 180°。外角は となりの内角の対角に等しい。</li>
<li><b>接弦定理</b>：接線と弦のつくる角は、その角の内部にある弧に対する円周角に等しい。</li></ul>`,
  detail: `<p>円周角の定理の証明は、P と中心 O を通る直径をひいて、二等辺三角形（OP = OA = OB）の外角を使います。</p>
<p>内接四角形の対角の和が 180° になるのは、∠A と ∠C がそれぞれ中心角 2a と 2c の半分で、2a + 2c = 360° だから。</p>
<p>逆に、向かい合う角の和が 180° の四角形は円に内接します（4点が同じ円周上にある条件）。</p>
<p>接弦定理は、弦の端の点 B を C に近づけていった「円周角の行きつく先」と考えるとイメージしやすいです。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    const O = { x: 360, y: 285 }, R = 210;
    let mode = "ins", morePs = false;
    c.seg("見るもの", [{ v: "ins", t: "円周角の定理" }, { v: "quad", t: "内接四角形" }, { v: "tan", t: "接弦定理" }], mode, v => { mode = v; build2(); });
    const tm = c.toggle("P をふやす", morePs, v => { morePs = v; build2(); }, "var(--accent)");
    c.row(tm.el, c.btn("直径にする", () => { ang.B = ang.A + Math.PI; build2(); }));
    const ang = { A: Math.PI * 0.85, B: Math.PI * 0.15, P: -Math.PI * 0.55, P2: -Math.PI * 0.3, P3: -Math.PI * 0.82, Q1: Math.PI * 1.05, Q2: Math.PI * 0.55, Q3: -Math.PI * 0.05, Q4: -Math.PI * 0.6, T: Math.PI * 0.5, TB: -Math.PI * 0.05, TC: -Math.PI * 0.7 };
    const at = a => ({ x: O.x + R * Math.cos(a), y: O.y + R * Math.sin(a) });
    const G = s("g", {}, svg), HL = s("g", {}, svg);
    let hs = {};
    function mk(name, label, color) {
      const p = at(ang[name]);
      hs[name] = c.handle(svg, HL, p.x, p.y, (x, y, hd) => { ang[name] = Math.atan2(y - O.y, x - O.x); const q = at(ang[name]); hd.place(q.x, q.y); draw(); },
        { label, color, labelOffset: hd => { const d = V.norm(V.sub(hd, O)); return { x: d.x * 26, y: d.y * 26 }; } });
    }
    function build2() {
      clear(HL); hs = {};
      tm.el.hidden = mode !== "ins";
      if (mode === "ins") { mk("A", "A"); mk("B", "B"); mk("P", "P", "var(--accent)"); if (morePs) { mk("P2", "P'", "var(--accent)"); mk("P3", "P''", "var(--accent)"); } }
      else if (mode === "quad") { mk("Q1", ""); mk("Q2", ""); mk("Q3", ""); mk("Q4", ""); }
      else { mk("T", "A", "var(--blue)"); mk("TB", "B"); mk("TC", "C", "var(--accent)"); }
      draw();
    }
    function draw() {
      clear(G);
      s("circle", { cx: O.x, cy: O.y, r: R, class: "ink", "stroke-width": 2.5 }, G);
      s("circle", { cx: O.x, cy: O.y, r: 4, class: "f-ink" }, G);
      s("text", { x: O.x + 8, y: O.y + 20, class: "pointlbl", "font-size": 18, text: "O" }, G);
      if (mode === "ins") drawIns(); else if (mode === "quad") drawQuad(); else drawTan();
    }
    function drawIns() {
      const A = at(ang.A), B = at(ang.B);
      const Ps = ["P", "P2", "P3"].filter(k => hs[k]).map(k => at(ang[k]));
      const Pm = Ps[0];
      // P と反対側の弧 AB に色
      const side = V.cross(V.sub(B, A), V.sub(Pm, A));
      const tA = ang.A, tB = ang.B;
      // 中心角（P の反対側の弧）
      let sweep = ((tB - tA) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI); // A→B 正の向き
      const mid = tA + sweep / 2, M = at(mid);
      const Mside = V.cross(V.sub(B, A), V.sub(M, A));
      let start = tA, sw = sweep;
      if (Mside * side > 0) { start = tB; sw = 2 * Math.PI - sweep; }
      const arcPts = n => Array.from({ length: n + 1 }, (_, i) => at(start + sw * i / n));
      const ap = arcPts(60);
      s("path", { d: `M${ap.map(p => `${p.x},${p.y}`).join(" L")}`, fill: "none", stroke: "var(--warm)", "stroke-width": 7, "stroke-linecap": "round", "stroke-opacity": .7 }, G);
      const r2 = 46;
      const cp = Array.from({ length: 41 }, (_, i) => ({ x: O.x + r2 * Math.cos(start + sw * i / 40), y: O.y + r2 * Math.sin(start + sw * i / 40) }));
      s("path", { d: `M${O.x},${O.y} L${cp.map(p => `${p.x},${p.y}`).join(" L")} Z`, fill: "var(--warm)", "fill-opacity": .25, stroke: "var(--warm)" }, G);
      seg(G, O, A, "ink s-wm", { "stroke-width": 2 }); seg(G, O, B, "ink s-wm", { "stroke-width": 2 });
      const central = deg(sw);
      const lab = { x: O.x + 70 * Math.cos(start + sw / 2), y: O.y + 70 * Math.sin(start + sw / 2) };
      s("text", { x: lab.x, y: lab.y + 5, "text-anchor": "middle", class: "tag tw", "font-weight": 700, text: `${fmt(central)}°` }, G);
      seg(G, A, B, "thin");
      Ps.forEach((Pp, i) => {
        seg(G, Pp, A, "ink s-ac", { "stroke-width": 2.2 }); seg(G, Pp, B, "ink s-ac", { "stroke-width": 2.2 });
        arcAt(G, Pp, A, B, 34, "", { fill: "var(--accent)", "fill-opacity": .25, stroke: "var(--accent)" });
        angleLabel(G, Pp, A, B, 58, `${fmt(angleAt(Pp, A, B))}°`, "tag ta");
      });
      const ins = angleAt(Pm, A, B);
      const dia = Math.abs(central - 180) < 0.6;
      c.out(`円周角 ∠APB = <span class="big ac">${fmt(ins)}°</span><br>中心角 ∠AOB = <span class="hl">${fmt(central)}°</span>（弧 AB）<br>${fmt(central)}° ÷ 2 = ${fmt(central / 2)}°${dia ? `<hr><b>AB が直径 → 円周角は 90°</b>` : ""}`);
    }
    function drawQuad() {
      const keys = ["Q1", "Q2", "Q3", "Q4"].sort((a, b) => ang[a] - ang[b]);
      const pts = keys.map(k => at(ang[k]));
      const names = ["A", "B", "C", "D"];
      keys.forEach((k, i) => { hs[k].g.querySelector("text") || s("text", { class: "pointlbl", "text-anchor": "middle" }, hs[k].g); const d = V.norm(V.sub(pts[i], O)); setA(hs[k].g.querySelector("text"), { x: d.x * 26, y: d.y * 26 + 7 }).textContent = names[i]; });
      s("polygon", { points: pts.map(p => `${p.x},${p.y}`).join(" "), class: "ink", fill: "var(--panel)", "fill-opacity": .6, "stroke-width": 2.5 }, G);
      const angs = pts.map((p, i) => angleAt(p, pts[(i + 3) % 4], pts[(i + 1) % 4]));
      const cols = ["var(--warm)", "var(--blue)", "var(--warm)", "var(--blue)"];
      pts.forEach((p, i) => { arcAt(G, p, pts[(i + 3) % 4], pts[(i + 1) % 4], 30, "", { fill: cols[i], "fill-opacity": .3, stroke: cols[i] }); angleLabel(G, p, pts[(i + 3) % 4], pts[(i + 1) % 4], 54, `${fmt(angs[i])}°`, "tag"); });
      // C の外角
      const Cp = pts[2], ext = V.add(Cp, V.mul(V.norm(V.sub(Cp, pts[1])), 90));
      seg(G, Cp, ext, "thin dash", { "stroke-width": 2 });
      arcAt(G, Cp, ext, pts[3], 22, "", { fill: "var(--warm)", "fill-opacity": .5 });
      c.out(`<span class="hl">∠A + ∠C</span> = ${fmt(angs[0])}° + ${fmt(angs[2])}° = <span class="big hl">${fmt(angs[0] + angs[2])}°</span><br><span class="bl">∠B + ∠D</span> = ${fmt(angs[1])}° + ${fmt(angs[3])}° = <span class="big bl">${fmt(angs[1] + angs[3])}°</span><hr><span class="mt">C の外角（小さい扇形）= 180° − ∠C = ${fmt(180 - angs[2])}° = ∠A</span>`);
    }
    function drawTan() {
      const A = at(ang.T), B = at(ang.TB), Cc = at(ang.TC);
      const t = V.perp(V.norm(V.sub(A, O)));
      longLine(G, A, V.add(A, t), "ink s-bl", { "stroke-width": 2.5 });
      s("text", { x: A.x + t.x * 150 + 8, y: A.y + t.y * 150 - 8, class: "tag tb", text: "接線" }, G);
      seg(G, A, B, "ink", { "stroke-width": 2.2 }); seg(G, A, Cc, "thin", { "stroke-width": 1.8 }); seg(G, B, Cc, "ink s-ac", { "stroke-width": 2.2 }); seg(G, A, Cc, "ink s-ac", { "stroke-width": 2.2 });
      // C と反対側の接線の向き
      const side = V.cross(V.sub(B, A), V.sub(Cc, A));
      let tt = t; if (Math.sign(V.cross(V.sub(B, A), t)) === Math.sign(side)) tt = V.mul(t, -1);
      const T2 = V.add(A, V.mul(tt, 100));
      const tanAng = angleAt(A, T2, B);
      arcAt(G, A, T2, B, 40, "", { fill: "var(--warm)", "fill-opacity": .35, stroke: "var(--warm)" });
      angleLabel(G, A, T2, B, 64, `${fmt(tanAng)}°`, "tag tw");
      const ins = angleAt(Cc, A, B);
      arcAt(G, Cc, A, B, 36, "", { fill: "var(--accent)", "fill-opacity": .3, stroke: "var(--accent)" });
      angleLabel(G, Cc, A, B, 60, `${fmt(ins)}°`, "tag ta");
      c.out(`接線と弦 AB の角 = <span class="big hl">${fmt(tanAng)}°</span><br>弧 AB に対する円周角 ∠ACB = <span class="big ac">${fmt(ins)}°</span><hr><span class="mt">B を A に近づけたり、C を動かしたりしても等しいまま</span>`);
    }
    build2();
  },
});

/* --- 方べきの定理 --- */
sim({
  id: "power", cat: "geo", name: "方べきの定理", sub: "PA×PB = PC×PD",
  formula: `<span class="ca">PA × PB</span> = <span class="cb">PC × PD</span> = <span class="cv">PT²</span>`,
  hint: "P や 直線の向き（青い点）をドラッグ。右の長方形の面積はいつも同じです",
  point: `<ul><li>点 P を通る2本の直線が円と A・B、C・D で交わるとき</li></ul>
<span class="formula">PA × PB = PC × PD</span>
<ul><li>P が円の <b>内側</b> でも <b>外側</b> でも成り立つ。</li>
<li>1本が接線（接点 T）になると <span class="formula">PA × PB = PT²</span></li>
<li>右の長方形（たて PA・横 PB）は、形が変わっても <b>面積が同じ</b>。</li></ul>`,
  detail: `<p>証明：△PAC と △PDB が相似（円周角の定理で角が等しい）なので PA：PD = PC：PB、だから PA×PB = PC×PD。</p>
<p>この値は P と円だけで決まり、半径 r、中心 O までの距離 d とすると |d² − r²| になります。直線の向きに関係ありません。</p>
<p>計算例：PA = 3、PB = 8、PC = 4 なら PD = 3×8÷4 = 6。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    const O = { x: 300, y: 290 }, R = 170;
    let showT = true;
    const tt = c.toggle("接線もかく（P が外のとき）", showT, v => { showT = v; draw(); }, "var(--violet)");
    c.row(tt.el, c.btn("P を外へ", () => { Ph.place(600, 140); draw(); }), c.btn("P を中へ", () => { Ph.place(330, 330); draw(); }));
    const G = s("g", {}, svg), HL = s("g", {}, svg);
    const Ph = c.handle(svg, HL, 560, 170, (x, y, hd) => { hd.place(clamp(x, 20, 780), clamp(y, 20, 540)); draw(); }, { label: "P", labelOffset: () => ({ x: 18, y: -14 }) });
    const D1 = c.handle(svg, HL, 120, 260, (x, y, hd) => { hd.place(x, y); draw(); }, { color: "var(--accent)", r: 7 });
    const D2 = c.handle(svg, HL, 200, 470, (x, y, hd) => { hd.place(x, y); draw(); }, { color: "var(--blue)", r: 7 });
    function hits(Pp, Q) {
      const u = V.norm(V.sub(Q, Pp)), f = V.sub(Pp, O);
      const b = V.dot(u, f), cc = V.dot(f, f) - R * R, disc = b * b - cc;
      if (disc < 0) return null;
      const t1 = -b - Math.sqrt(disc), t2 = -b + Math.sqrt(disc);

          if (fs === 3) s("text", { x: X, y: y0 - 4, class: "mut", "font-size": 12, text: `× ${f[2][0]}${sup(li)}（= ${L}）` }, svg);
          pw(q, b).forEach((v, j) => s("text", { x: X + cw * (j + 1.5), y: y0 + chh * 0.7, "text-anchor": "middle", class: "mono tb", "font-size": 13, "font-weight": 700, text: `${q}${sup(j)}` }, svg));
          pw(p, a).forEach((u, i) => {
            s("text", { x: X + cw * 0.5, y: y0 + chh * (i + 1.7), "text-anchor": "middle", class: "mono tw", "font-size": 13, "font-weight": 700, text: `${p}${sup(i)}` }, svg);
            pw(q, b).forEach((v, j) => cellAt(X + cw * (j + 1), y0 + chh * (i + 1), cw, chh, u * v * L, null, (i + j) * 0.04));
          });
        });
      } else {
        s("text", { x: X, y: Y, "font-size": 15, text: "素因数が4種類以上：約数を小さい順に" }, svg);
        const all = []; for (let d = 1; d <= N; d++) if (N % d === 0) all.push(d);
        all.forEach((d, i) => cellAt(X + (i % 6) * 70, Y + 20 + Math.floor(i / 6) * 40, 66, 36, d, null, i * 0.02));
      }
      function cellAt(x, y, w, hh, v, sub, delay) {
        divs.push(v);
        const g = s("g", { class: "pop", style: `cursor:pointer;animation-delay:${delay}s` }, svg);
        const on = pick === v, pair = pick && N / pick === v;
        s("rect", { x: x + 2, y: y + 2, width: w - 4, height: hh - 4, rx: 3, class: on ? "f-acs ink s-ac" : pair ? "f-bls ink s-bl" : "f-pn thin" }, g);
        s("text", { x: x + w / 2, y: y + hh / 2 + 6, "text-anchor": "middle", class: "mono", "font-size": Math.min(17, w / 3.2), "font-weight": on || pair ? 700 : 400, text: v }, g);
        if (sub) s("text", { x: x + w / 2, y: y - 4, "text-anchor": "middle", class: "mono mut", "font-size": 12, text: sub }, g);
        g.addEventListener("click", () => { pick = v; draw(); });
      }
      const expr = f.map(([p, e]) => e > 1 ? `${p}<sup>${e}</sup>` : `${p}`).join(" × ");
      const cnt = f.reduce((t, [, e]) => t * (e + 1), 1);
      const sum = f.reduce((t, [p, e]) => t * pw(p, e).reduce((a, b) => a + b, 0), 1);
      const square = f.every(([, e]) => e % 2 === 0);
      let out = f.length === 1 && f[0][1] === 1 ? `${N} は <span class="big hl">素数</span>（約数は 1 と ${N}）` :
        `${N} = <span class="big hl">${expr}</span><br>約数の個数 = ${f.map(([, e]) => `(${e}+1)`).join("")} = <b>${cnt}</b> 個<br>約数の和 = ${f.map(([p, e]) => `(${pw(p, e).join("+")})`).join("")} = <b>${sum}</b>`;
      if (square && N > 1) out += `<br><span class="ac">平方数（${Math.sqrt(N)}²）なので約数の個数は奇数</span>`;
      if (pick) out += `<hr>${pick} × ${N / pick} = ${N}（<span class="ac">${pick}</span> と <span class="bl">${N / pick}</span> は組になる約数）`;
      c.out(out);
    }
    draw();
  },
});

/* --- ユークリッドの互除法 --- */
sim({
  id: "euclid", cat: "int", name: "ユークリッドの互除法", sub: "長方形を正方形で切っていく",
  formula: `a = b × q + r　→　gcd(a, b) = gcd(b, r)`,
  hint: "「次へ」で、長方形から一番大きな正方形を切りとっていきます",
  point: `<ul><li>a を b でわった余りを r とすると</li></ul>
<span class="formula">gcd(a, b) = gcd(b, r)</span>
<ul><li>わり算をくり返して、余りが 0 になったときの「わる数」が <b>最大公約数</b>。</li>
<li>図では、a×b の長方形から一番大きな正方形を切りとっていく。最後にぴったりしきつめられた <b>一番小さい正方形の1辺</b> が最大公約数。</li></ul>`,
  detail: `<p>なぜ gcd(a, b) = gcd(b, r)？　a = bq + r なので、a と b の公約数は r = a − bq もわり切り、b と r の公約数は a = bq + r もわり切ります。だから公約数の集まりがまったく同じです。</p>
<p>図で考えると：最後の小さい正方形は、1つ前の長方形をぴったりしきつめます。すると その前の長方形も…と さかのぼって、最初の a×b の長方形全体を、この正方形でしきつめられます。つまり 1辺は a と b の公約数。しかも、どの公約数の正方形も同じように切りとりに合うので、これが最大です。</p>
<p>最大公約数が 1 のとき、a と b は「互いに素」といいます。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let a = 252, b = 105, step = 0, steps = [];
    const sa = c.slider("a", { min: 1, max: 300, value: a }, v => { a = v; init(); });
    const sb = c.slider("b", { min: 1, max: 300, value: b }, v => { b = v; init(); });
    c.row(c.btn("次へ", () => { if (step < steps.length) { step++; draw(true); } }, { main: true }), c.btn("最後まで", () => { step = steps.length; draw(true); }), c.btn("はじめから", () => { step = 0; draw(); }));
    c.row(...[[252, 105], [91, 35], [144, 89], [120, 84]].map(([x, y]) => c.btn(`${x} と ${y}`, () => { sa.set(x, true); sb.set(y, true); a = x; b = y; init(); })));
    function init() {
      steps = []; let x = 0, y = 0, w = Math.max(a, b), hh = Math.min(a, b);
      let A = w, B = hh;
      while (B > 0) {
        const q = Math.floor(A / B), r = A % B;
        const sq = [];
        if (w >= hh) { for (let i = 0; i < q; i++) sq.push({ x: x + i * hh, y, s: hh }); x += q * hh; w -= q * hh; }
        else { for (let i = 0; i < q; i++) sq.push({ x, y: y + i * w, s: w }); y += q * w; hh -= q * w; }
        steps.push({ A, B, q, r, sq });
        A = B; B = r;
      }
      step = 0; draw();
    }
    function draw(anim) {
      clear(svg);
      const W = Math.max(a, b), Hh = Math.min(a, b);
      const sc = Math.min(560 / W, 330 / Hh);
      const X = 400 - W * sc / 2, Y = 40;
      s("rect", { x: X, y: Y, width: W * sc, height: Hh * sc, class: "f-pn ink", "stroke-width": 2 }, svg);
      s("text", { x: X + W * sc / 2, y: Y + Hh * sc + 22, "text-anchor": "middle", class: "mono mut", "font-size": 14, text: W }, svg);
      s("text", { x: X - 8, y: Y + Hh * sc / 2 + 5, "text-anchor": "end", class: "mono mut", "font-size": 14, text: Hh }, svg);
      for (let i = 0; i < step; i++) {
        const st = steps[i], col = COLORS[i % 10], last = i === steps.length - 1;
        st.sq.forEach((q, k) => {
          const r = s("rect", { x: X + q.x * sc, y: Y + q.y * sc, width: q.s * sc, height: q.s * sc, fill: col, "fill-opacity": last ? .75 : .35, stroke: "var(--ink)", "stroke-width": 1.2, class: anim && i === step - 1 ? "pop" : "" }, svg);
          if (anim && i === step - 1) r.style.animationDelay = `${k * 0.08}s`;
          if (q.s * sc > 34) s("text", { x: X + (q.x + q.s / 2) * sc, y: Y + (q.y + q.s / 2) * sc + 6, "text-anchor": "middle", class: "mono in", "font-size": Math.min(18, q.s * sc / 3), text: q.s }, svg);
        });
      }
      // わり算の式
      const lineY = Y + Hh * sc + 50;
      steps.forEach((st, i) => {
        if (i >= step) return;
        const y = lineY + i * 26; if (y > 548) return;
        s("rect", { x: 200, y: y - 16, width: 12, height: 12, fill: COLORS[i % 10], "fill-opacity": .6 }, svg);
        s("text", { x: 222, y: y - 5, class: "mono", "font-size": 16, "font-weight": i === step - 1 ? 700 : 400, text: `${st.A} = ${st.B} × ${st.q} + ${st.r}` + (st.r === 0 ? "  → 余り0" : "") }, svg);
      });
      const g = gcd(a, b);
      const done = step === steps.length;
      c.out(done ? `gcd(${a}, ${b}) = <span class="big hl">${g}</span><br><span class="mt">${g}×${g} の正方形で、${W}×${Hh} の長方形がしきつめられる</span>${g === 1 ? `<br><span class="ac">${a} と ${b} は互いに素</span>` : ""}<br><span class="mt">最小公倍数 = ${a}×${b}÷${g} = ${lcm(a, b)}</span>`
        : step === 0 ? `${W}×${Hh} の長方形。「次へ」で切っていこう` : `いまの長方形：${steps[step - 1].B}×${steps[step - 1].r}<br><span class="mt">gcd(${steps[step - 1].A}, ${steps[step - 1].B}) = gcd(${steps[step - 1].B}, ${steps[step - 1].r})</span>`);
    }
    init();
  },
});

/* --- エラトステネスのふるい --- */
sim({
  id: "sieve", cat: "int", name: "エラトステネスのふるい", sub: "倍数を消して素数をさがす",
  formula: `√N 以下の素数でふるえば、のこりは全部素数`,
  hint: "「次の素数でふるう」で、その素数の倍数が消えていきます",
  point: `<ul><li>2 は素数。2 の倍数（2 以外）を消す。</li>
<li>のこった一番小さい数 3 は素数。3 の倍数を消す。…これをくり返す。</li>
<li><b>√N をこえたら、もう消すものはない</b>。のこった数は全部素数。</li></ul>`,
  detail: `<p>N = 100 なら、7 でふるったあと 11 でふるおうとしても、11 の倍数 22, 33, … はすでに 2, 3, 5, 7 の倍数として消えています（11×11 = 121 > 100）。だから √100 = 10 までの素数でふるえば十分です。</p>
<p>「6 列」にすると、2 と 3 以外の素数は 6 でわって 1 余る列と 5 余る列にしか出てきません（6k±1 の形）。6 でわった余りで整数を分けるとわかります。</p>
<p>素数は無限にあります（ユークリッドの証明：素数が有限個だとして、全部かけて 1 をたすと、どの素数でもわり切れない数ができて矛盾）。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let cols = 10, N = 100, crossed = new Map(), primes = [], cur = 1, busy = false;
    c.seg("ならべ方", [{ v: 10, t: "10 列（1〜100）" }, { v: 6, t: "6 列（1〜120）" }], cols, v => { cols = v; N = v === 10 ? 100 : 120; reset(); });
    c.row(c.btn("次の素数でふるう", () => next(), { main: true }), c.btn("全部", () => all()), c.btn("リセット", () => reset()));
    function reset() { crossed = new Map(); primes = []; cur = 1; busy = false; draw(); }
    const pos = n => { const rows = Math.ceil(N / cols), cw = Math.min(72, 760 / cols), ch = Math.min(46, 520 / rows); return { x: 400 - cols * cw / 2 + ((n - 1) % cols) * cw, y: 20 + Math.floor((n - 1) / cols) * ch, cw, ch }; };
    function draw() {
      clear(svg);
      for (let n = 1; n <= N; n++) {
        const { x, y, cw, ch } = pos(n);
        const isP = primes.includes(n), by = crossed.get(n);
        const col = isP ? COLORS[primes.indexOf(n) % 10] : by ? COLORS[primes.indexOf(by) % 10] : null;
        s("rect", { x: x + 2, y: y + 2, width: cw - 4, height: ch - 4, rx: 4, fill: isP ? col : by ? col : "var(--panel)", "fill-opacity": isP ? .9 : by ? .15 : 1, stroke: isP ? "var(--ink)" : "var(--line)", "stroke-width": isP ? 2 : 1 }, svg);
        s("text", { x: x + cw / 2, y: y + ch / 2 + 6, "text-anchor": "middle", class: "mono" + (by || n === 1 ? " mut" : ""), "font-size": 17, "font-weight": isP ? 700 : 400, fill: isP ? "#fff" : null, "text-decoration": by ? "line-through" : null, text: n }, svg);
      }
      readout();
    }
    function nextPrime() { for (let n = cur + 1; n <= N; n++) if (!crossed.has(n)) return n; return null; }
    function next(fast) {
      if (busy) return;
      const p = nextPrime(); if (!p) return;
      primes.push(p); cur = p;
      if (p * p > N) {
        for (let n = p + 1; n <= N; n++) if (!crossed.has(n) && !primes.includes(n)) primes.push(n);
        cur = N; draw(); return;
      }
      const ms = [];
      for (let m = p * 2; m <= N; m += p) if (!crossed.has(m)) ms.push(m);
      if (fast) { ms.forEach(m => crossed.set(m, p)); draw(); return; }
      busy = true; draw();
      ms.forEach((m, i) => c.after(i * 40, () => { crossed.set(m, p); draw(); if (i === ms.length - 1) busy = false; }));
      if (!ms.length) busy = false;
    }
    function all() { if (busy) return; let g = 0; while (nextPrime() && g++ < 200) next(true); }
    function readout() {
      const p = primes[primes.length - 1];
      const done = cur >= N || !nextPrime();
      c.out(done ? `のこった数はすべて素数：<span class="big hl">${primes.length} 個</span><br><span class="mt">${primes.join(", ")}</span>` :
        p ? `<b>${p}</b> の倍数を消した<br><span class="mt">次は ${nextPrime()}。${nextPrime() ** 2 > N ? `${nextPrime()}² = ${nextPrime() ** 2} > ${N} なので、のこりは全部素数！` : `${nextPrime()}² = ${nextPrime() ** 2} ≦ ${N} なので まだふるう`}</span>` : `1 は素数ではない。まず 2 からふるおう`);
    }
    draw();
  },
});

/* --- n進法 --- */
sim({
  id: "base", cat: "int", name: "n 進法", sub: "くり上がりを目で見る",
  formula: `abc<sub>(n)</sub> = a × n² + b × n + c × 1`,
  hint: "「＋1」をおし続けると、玉が n 個たまったところで1つ上の位にくり上がります",
  point: `<ul><li><b>n 進法</b>：n 個たまったら 1 つ上の位へくり上がる数の表し方。</li>
<li>位の重みは右から 1, n, n², n³, …。</li></ul>
<span class="formula">1011₍₂₎ = 1×2³ + 0×2² + 1×2 + 1×1 = 11</span>
<ul><li>10 進法 → n 進法は、<b>n でわった余りを下から</b> ならべる。</li></ul>`,
  detail: `<p>2 進法はコンピュータで使われる表し方。電球のついている（1）・消えている（0）で数を表します。2 進法の位の電球をタップして、いろいろな数をつくってみよう。</p>
<p>10 進法の 11 を 2 進法に：11÷2 = 5 余り 1、5÷2 = 2 余り 1、2÷2 = 1 余り 0、1÷2 = 0 余り 1。余りを下から読んで 1011₍₂₎。</p>
<p>16 進法では 10〜15 を A〜F で表します（カラーコード #FF8800 など）。</p>`,
  build(c) {
    const svg = c.svg(800, 560);
    let base = 2, val = 11, carry = -1;
    const DIG = { 2: 8, 3: 5, 5: 4, 8: 3, 10: 3, 16: 2 };
    c.seg("何進法", [2, 3, 5, 8, 10, 16].map(b => ({ v: b, t: `${b}進法` })), base, v => { base = v; val = Math.min(val, maxV()); draw(); });
    c.row(c.btn("＋1", () => add(1), { main: true }), c.btn("−1", () => add(-1)), c.btn("0 にする", () => { val = 0; draw(); }));
    const maxV = () => base ** DIG[base] - 1;
    const digitsOf = v => { const d = []; for (let i = 0; i < DIG[base]; i++) { d.push(v % base); v = Math.floor(v / base); } return d; };
    const ch = d => "0123456789ABCDEF"[d];
    function add(k) {
      const before = digitsOf(val);
      val = clamp(val + k, 0, maxV());
      const after = digitsOf(val);
      carry = -1;
      if (k > 0) for (let i = 0; i < after.length; i++) if (after[i] < before[i]) carry = i;
      draw();
    }
    function draw() {
      clear(svg);
      const D = DIG[base], d = digitsOf(val);
      const cw = Math.min(150, 720 / D), X0 = 400 + (D / 2 - 0.5) * cw;
      for (let i = 0; i < D; i++) {
        const x = X0 - i * cw;
        const g = s("g", {}, svg);
        s("rect", { x: x - cw / 2 + 5, y: 70, width: cw - 10, height: 330, rx: 6, class: carry >= i ? "f-wms" : "f-chip" }, g);
        s("text", { x, y: 56, "text-anchor": "middle", class: "mono mut", "font-size": 13, text: `${base}${sup(i)} の位` }, g);
        s("text", { x, y: 40, "text-anchor": "middle", class: "mono", "font-size": 14, text: `(${base ** i})` }, g);
        if (base === 2) {
          const on = d[i] === 1;
          const bulb = s("g", { style: "cursor:pointer" }, g);
          s("circle", { cx: x, cy: 200, r: Math.min(34, cw * 0.38), fill: on ? "var(--gold)" : "var(--panel)", stroke: "var(--ink)", "stroke-width": 2 }, bulb);
          if (on) s("circle", { cx: x, cy: 200, r: Math.min(50, cw * 0.48), fill: "var(--gold)", "fill-opacity": .25 }, bulb);
          s("rect", { x: x - 10, y: 200 + Math.min(34, cw * 0.38), width: 20, height: 16, class: "f-ink" }, bulb);
          bulb.addEventListener("click", () => { val += on ? -(2 ** i) : 2 ** i; carry = -1; draw(); });
        } else {
          const r = Math.min(13, cw * 0.14), perRow = Math.max(1, Math.floor((cw - 20) / (r * 2.3)));
          for (let k = 0; k < d[i]; k++) {
            const bx = x + ((k % perRow) - (perRow - 1) / 2) * r * 2.3, by = 385 - r - Math.floor(k / perRow) * r * 2.3;
            s("circle", { cx: bx, cy: by, r, fill: COLORS[i % 10], stroke: "var(--ink)", "stroke-width": 1, class: k === d[i] - 1 && carry === -1 ? "pop" : "" }, g);
          }
          s("text", { x, y: 100, "text-anchor": "middle", class: "mut", "font-size": 12, text: `${base - 1} 個まで` }, g);
        }
        s("text", { x, y: 450, "text-anchor": "middle", class: "mono disp", "font-size": 46, fill: carry >= i && carry >= 0 ? "var(--warm)" : null, text: ch(d[i]) }, g);
        if (base !== 2) {
          const up = s("g", { style: "cursor:pointer" }, g);
          s("rect", { x: x - 36, y: 470, width: 32, height: 28, rx: 4, class: "f-pn thin" }, up); s("text", { x: x - 20, y: 490, "text-anchor": "middle", "font-size": 18, text: "−" }, up);
          up.addEventListener("click", () => { if (d[i] > 0) { val -= base ** i; carry = -1; draw(); } });
          const dn = s("g", { style: "cursor:pointer" }, g);
          s("rect", { x: x + 4, y: 470, width: 32, height: 28, rx: 4, class: "f-pn thin" }, dn); s("text", { x: x + 20, y: 490, "text-anchor": "middle", "font-size": 18, text: "+" }, dn);
          dn.addEventListener("click", () => { if (d[i] < base - 1) { val += base ** i; carry = -1; draw(); } });
        }
      }
      if (carry > 0) { s("text", { x: X0 - carry * cw, y: 140, "text-anchor": "middle", class: "tw disp", "font-size": 20, text: "くり上がり！" }, svg); }
      const str = d.slice().reverse().join("") ;
      const shown = d.slice().reverse().map(ch).join("").replace(/^0+(?=.)/, "");
      const terms = d.map((x, i) => [x, i]).reverse().filter(([x]) => x > 0).map(([x, i]) => `${x}×${base ** i}`);
      c.out(`<span class="big">${shown}<sub>(${base})</sub> = <span class="hl">${val}</span></span><br><span class="mt">${terms.length ? terms.join(" + ") : "0"} = ${val}</span>${base === 2 ? `<br><span class="mt">電球をタップしても変えられる</span>` : ""}`);
    }
    draw();
  },
});

/* --- 不定方程式 --- */
sim({
  id: "dioph", cat: "int", name: "1次不定方程式", sub: "ax + by = c の整数解を格子点で見る",
  formula: `ax + by = c　→　x = x₀ + <span class="ca">(b/g)</span>k,　y = y₀ − <span class="ca">(a/g)</span>k`,
  hint: "直線が格子点（整数の点）をどこで通るか見てみよう。点はいつも同じ間かくでならびます",
  point: `<ul><li>ax + by = c をみたす整数 x, y は、直線上の <b>格子点</b>。</li>
<li>g = gcd(a, b) とすると、<b>c が g でわり切れるときだけ</b> 整数解がある。</li>
<li>1つの解 (x₀, y₀) が見つかれば、全部の解は</li></ul>
<span class="formula">x = x₀ + (b/g)k,　y = y₀ − (a/g)k　（k は整数）</span>`,
  detail: `<p>例：3x + 5y = 1。x = 2, y = −1 が1つの解（3×2 + 5×(−1) = 1）。ほかの解は x = 2 + 5k、y = −1 − 3k。直線にそって、右へ 5・下へ 3 ずつ進むと次の格子点です。</p>
<p>1つの解は、ユークリッドの互除法を逆にたどると見つけられます（拡張ユークリッドの互除法）。</p>
<p>6x + 4y = 3 のように、左辺はいつも 2 の倍数なのに右辺が奇数なら、整数解はありません。直線が格子点を1つも通らないことを図で確かめよう。</p>`,

/* --- 角の二等分線と比 --- */
function T_bis({ AB, AC, BC }) {
  const g = gcd(AB, AC), m = AB / g, n = AC / g, BD = fs(BC * AB, AB + AC), DC = fs(BC * AC, AB + AC);
  return {
    eq: [["BD : DC", 1], [" = ", 1], ["AB : AC", 1, "w"], [` = ${AB} : ${AC} = ${m} : ${n}`, 1], [`　BD = ${BC} × ${m}/${m + n} = ${BD}`, 3]],
    steps: [
      `△ABC で AB = ${AB}、AC = ${AC}、BC = ${BC}。∠A の二等分線と BC の交点 D`,
      `角の二等分線の性質：BD : DC = <b class=cw>AB</b> : <b class=ca>AC</b> = ${AB} : ${AC} = <b>${m} : ${n}</b>`,
      `BC = ${BC} を ${m} : ${n} に分ける（${m + n} 等分して ${m} つ分と ${n} つ分）`,
      `BD = ${BC} × ${m}/${m + n} = <b>${BD}</b>（DC = ${DC}）`,
    ],
    render(T, k) {
      const ax = (AB * AB - AC * AC + BC * BC) / (2 * BC), ay = Math.sqrt(Math.max(0, AB * AB - ax * ax));
      const minX = Math.min(0, ax), maxX = Math.max(BC, ax), sc = Math.min(520 / (maxX - minX), 280 / ay);
      const ox = 400 - (minX + maxX) / 2 * sc, B = { x: ox, y: 400 }, Cc = { x: ox + BC * sc, y: 400 }, A = { x: ox + ax * sc, y: 400 - ay * sc };
      const D = V.lerp(B, Cc, AB / (AB + AC)), g0 = T.at(0);
      s("polygon", { points: `${A.x},${A.y} ${B.x},${B.y} ${Cc.x},${Cc.y}`, class: "ink", fill: "var(--panel)", "stroke-width": 2.5 }, g0);
      seg(g0, A, B, "", { stroke: "var(--warm)", "stroke-width": 4 }); seg(g0, A, Cc, "", { stroke: "var(--accent)", "stroke-width": 4 }); seg(g0, A, D, "ink", { "stroke-width": 2.5 });
      arcAt(g0, A, B, D, 40, "", { fill: "var(--gold)", "fill-opacity": .35 }); arcAt(g0, A, D, Cc, 46, "", { fill: "var(--gold)", "fill-opacity": .2 });
      lenLabel(g0, A, B, String(AB), "var(--warm)", 20); lenLabel(g0, A, Cc, String(AC), "var(--accent)", -20); lenLabel(g0, B, Cc, String(BC), "var(--ink)", -0.01);
      [[A, "A", 0, -16], [B, "B", -20, 10], [Cc, "C", 20, 10], [D, "D", 0, 32]].forEach(([p, nm, dx, dy]) => s("text", { x: p.x + dx, y: p.y + dy, class: "pointlbl", "text-anchor": "middle", text: nm }, g0));
      if (k >= 1) { const gg = T.at(1); seg(gg, B, D, "", { stroke: "var(--warm)", "stroke-width": 8, "stroke-opacity": .5 }); seg(gg, D, Cc, "", { stroke: "var(--accent)", "stroke-width": 8, "stroke-opacity": .5 }); LK.chip(gg, 660, 120, `${m} : ${n}`, "var(--ink)", 24); }
      if (k >= 2) {
        const gg = T.at(2), w = (Cc.x - B.x) / (m + n), y0 = 455;
        for (let i = 0; i < m + n; i++) LK.box(gg, B.x + i * w, y0, w, 34, { fill: i < m ? "var(--warm-soft)" : "var(--accent-soft)", sw: 1.5, rx: 0 });
        LK.brace(gg, B.x, B.x + m * w, y0 + 38, `${m}つ分`, "var(--warm)"); LK.brace(gg, B.x + m * w, Cc.x, y0 + 38, `${n}つ分`, "var(--accent)");
      }
      if (k >= 3) LK.chip(T.at(3), 660, 180, `BD = ${BD}`, "var(--warm)", 24);
    },
  };
}

/* --- 同じものをふくむ順列 --- */
function T_same({ word }) {
  const ch = [...word], n = ch.length, cnt = {};
  ch.forEach(x => { cnt[x] = (cnt[x] || 0) + 1; });
  const keys = Object.keys(cnt), reps = keys.filter(x => cnt[x] > 1);
  const den = keys.reduce((s2, x) => s2 * fact(cnt[x]), 1), v = fact(n) / den;
  const denT = reps.map(x => `${cnt[x]}!`).join(" × ") || "1";
  const col = x => COLORS[keys.indexOf(x) % 10];
  return {
    eq: [[`${n}!`, 1, "w"], [" ÷ (", 2], [denT, 2, "b"], [")", 2], [` = ${fact(n)} ÷ ${den} = ${v}`, 3]],
    steps: [
      `「${word}」の ${n} 文字を 1 列にならべる。${reps.map(x => `${x} が ${cnt[x]} 個`).join("、") || "同じ文字はない"}`,
      `もし同じ文字にも 番号をつけて 全部ちがうと考えると <b class=cw>${n}! = ${fact(n)} 通り</b>`,
      `でも 同じ文字どうしを入れかえても 同じならび。${reps.map(x => `${x} の入れかえ ${cnt[x]}! 通り`).join("、")}が <b class=cb>同じもの</b> として数えられている`,
      `だから ${fact(n)} ÷ ${den} = <b>${v} 通り</b>`,
    ],
    render(T, k) {
      const g0 = T.at(0), w = Math.min(84, 680 / n), x = i => 400 + (i - (n - 1) / 2) * w;
      const seen = {};
      ch.forEach((c2, i) => {
        seen[c2] = (seen[c2] || 0) + 1;
        LK.box(g0, x(i) - w * 0.42, 150, w * 0.84, w * 0.84, { fill: col(c2), stroke: "var(--ink)", sw: 1.5, op: .9 });
        LK.text(g0, x(i), 150 + w * 0.42 + 10, c2, { size: Math.min(34, w * 0.5), bold: true, fill: "#fff" });
        if (k >= 1 && cnt[c2] > 1) LK.text(T.at(1), x(i) + w * 0.3, 150 + w * 0.8, String(seen[c2]), { size: 14, bold: true, fill: "#fff" });
      });
      if (k >= 1) LK.chip(T.at(1), 400, 100, `全部ちがうとすると ${n}! = ${fact(n)} 通り`, "var(--warm)", 20);
      if (k >= 2) {
        const g = T.at(2);
        reps.forEach((x2, ri2) => {
          const y = 300 + ri2 * 70, m2 = cnt[x2];
          for (let i = 0; i < m2; i++) { LK.box(g, 260 + i * 46, y - 20, 40, 40, { fill: col(x2), stroke: "var(--ink)", sw: 1.2 }); LK.text(g, 260 + i * 46 + 20, y + 8, `${x2}${i + 1}`, { size: 14, bold: true, fill: "#fff" }); }
          LK.text(g, 260 + m2 * 46 + 16, y + 8, `→ 入れかえ ${m2}! = ${fact(m2)} 通りは同じ`, { size: 18, bold: true, fill: "var(--blue)", anchor: "start" });
        });
      }
      if (k >= 3) LK.chip(T.at(3), 400, 520, `${fact(n)} ÷ ${den} = ${v} 通り`, "var(--ink)", 24);
    },
  };
}

/* --- 重複順列 --- */
function T_rep({ n, r, what = "人", where = "部屋" }) {
  const v = n ** r;
  const eq = [[`${n}<sup>${r}</sup>`, 0], [" = ", 1]];
  for (let j = 0; j < r; j++) { if (j) eq.push([" × ", j + 1]); eq.push([String(n), j + 1, CYC[j % 5]]); }
  eq.push([` = ${v}`, r + 1]);
  const steps = [`${r} ${what}が それぞれ ${n} つの${where}の どれかに入る（同じ${where}に何${what}入ってもよい）`];
  for (let j = 0; j < r; j++) steps.push(`${j + 1} ${what}目：${n} つの${where}の どれでもよい → <b class=c${CYC[j % 5]}>${n} 通り</b>${j ? "（前の人に関係なく）" : ""}`);
  steps.push(`かけ算：${Array(r).fill(n).join(" × ")} = <b>${v} 通り</b>`);
  return {
    eq, steps,
    render(T, k) {
      const g0 = T.at(0), rw = Math.min(110, 680 / n), RX = i => 400 + (i - (n - 1) / 2) * rw;
      for (let i = 0; i < n; i++) { LK.box(g0, RX(i) - rw * 0.4, 330, rw * 0.8, 110, { fill: "var(--chip)", stroke: "var(--ink)", sw: 1.5 }); LK.text(g0, RX(i), 470, `${where}${"ABCDEFGH"[i]}`, { size: 16, cls: "mut" }); }
      const pw = Math.min(110, 680 / r), PX = j => 400 + (j - (r - 1) / 2) * pw;
      for (let j = 0; j < r; j++) {
        LK.ball(g0, PX(j), 90, COLORS[j % 10], String(j + 1), 24);
        if (k >= j + 1) {
          const g = T.at(j + 1), col = CV[CYC[j % 5]];
          if (T.now(j + 1)) for (let i = 0; i < n; i++) LK.arrow(g, { x: PX(j), y: 116 }, { x: RX(i), y: 326 }, col, 2);
          LK.text(g, PX(j), 160, `${n}通り`, { size: 20, bold: true, fill: col });
        }
      }
      if (k >= r + 1) LK.chip(T.at(r + 1), 400, 530, `${Array(r).fill(n).join(" × ")} = ${v} 通り`, "var(--ink)", 22);
    },
  };
}

      clear(listWrap);
      if (!answered[pi]) { ol = null; return; }
      const det = h("details", { class: "flow" }, h("summary", {}, p.kind === "intro" ? "考え方の流れを見る" : "解き方の流れを見る"));
      ol = h("ol", { class: "steps" });
      p.steps.forEach((st, j) => { const li = h("li", { html: `<span>${termify(st)}</span>` }); li.addEventListener("click", e => { if (!e.target.closest(".term")) go(j); }); ol.appendChild(li); });
      det.appendChild(ol);
      listWrap.appendChild(det);
      if (p.more) listWrap.appendChild(h("details", { class: "flow more" }, h("summary", {}, "📖 それでもわからないときは（くわしい解説）"), h("div", { class: "morebody", html: p.more })));
      mark();
    }
    renderList();
    clear(dots);
    p.steps.forEach((_, j) => { const d = h("i"); d.addEventListener("click", () => { if (answered[pi]) go(j); }); dots.appendChild(d); });
    chipBtns.forEach((b, j) => { b.classList.toggle("cur", j === pi); b.classList.toggle("done", done[j]); });
    $("#hint").hidden = true;
    if (narrowMQ.matches) { k = p.steps.length - 1; clear(G); try { p.render(T, k); } catch (e) { } fitStage(); }
    go(step === "last" ? p.steps.length - 1 : step);
  }
  const allAnswered = () => parts.every((q, i) => !ASK.has(q.kind) || (answered[i] && result[i]));
  function mark() {
    if (ol) [...ol.children].forEach((li, j) => li.className = j < k ? "done" : j === k ? "cur" : "");
    [...dots.children].forEach((d, j) => d.className = j < k ? "on" : j === k ? "cur" : "");
  }
  function go(n) {
    const p = parts[pi], N = p.steps.length;
    if (n >= N) { if (pi < parts.length - 1) goPart(pi + 1, 0); return; }
    if (n < 0) { if (pi > 0) goPart(pi - 1, "last"); return; }
    if (n > 0 && !answered[pi]) { answered[pi] = true; result[pi] = result[pi] || "skip"; save(); goPart(pi, n); return; }
    k = n;
    tick();
    clear(G);
    try { p.render(T, k); } catch (e) { console.error(e); }
    const [kname, kcol] = KIND[p.kind];
    const toks = (p.eq || []).filter(t => (t[3] == null || k <= t[3]) && t[1] <= k);
    const askingNow = ASK.has(p.kind) && !answered[pi];
    document.body.classList.toggle("asking", askingNow);
    $("#fgen").innerHTML = askingNow ? `<span class="tok ghost">？</span>` : toks.map(([html, st, col]) =>
      `<span class="tok${col ? " c" + col : ""}${st > k ? " ghost" : st === k ? " now" : ""}">${html}</span>`).join("");
    let say = p.steps[k];
    if (!answered[pi]) say += `<br><b style="color:var(--warm)">→ まず自分で解いてみよう！</b>`;
    const lastAll = pi === parts.length - 1 && k === N - 1;
    if (k === N - 1) { done[pi] = true; save(); chipBtns[pi].classList.add("done"); if (lastAll && typeof syncTask === "function") syncTask(); }
    if (k === N - 1 && result[pi] === "ng" && p.more) say += `<br><span style="color:var(--muted);font-size:.9em">まちがえたところは「📖 くわしい解説」で確かめよう</span>`;
    if (resumed) { say = `<span style="color:var(--accent);font-size:.9em">▶ 前回の続きから（「◀ もどる」で前の段階へ）</span><br>` + say; resumed = false; }
    if (pi === 0 && k === 0 && u.isTest) say = `<span style="color:var(--accent);font-weight:700">📝 確認テスト：${parts.length} 問中 ${u.pass || 4} 問以上で合格。ヒントなし・1 回勝負！</span><br>` + say;
    else if (pi === 0 && k === 0 && meta.goal) say = `<span style="color:var(--accent);font-weight:700">🎯 めあて：${meta.goal}</span><br>` + say;
    if (lastAll) say += `<br><b style="color:var(--accent)">🎉 この単元はおわり！ 下の「まとめ」を見よう</b>`;
    setTimeout(fitStageHeight, 0);
    c.out(`<div class="lsay"><span class="stepn">ステップ ${k + 1}/${N}</span>${termify(say)}</div>`);
    /* 段階の最後：数字をかえてもう1問 */
    if (varBox) { clear(varBox); if (k === N - 1 && p.variant && answered[pi]) varBox.appendChild(h("button", { type: "button", class: "varbtn", onclick: () => newVariant() }, "🔁 数字をかえて もう1問")); }
    /* 単元の最後：まとめ */
    const testEnd = u.isTest && pi === parts.length - 1 && allAnswered();
    if (sumBox) { clear(sumBox); if (lastAll || testEnd) { sumBox.appendChild(summaryCard()); if (lastAll && !u.isTest && narrowMQ.matches) setTimeout(() => sumBox.scrollIntoView({ behavior: "smooth", block: "start" }), 700); } }
    mark();
    prev.disabled = pi === 0 && k === 0;
    next.disabled = false; nextAct = null;
    next.classList.toggle("main", answered[pi] || !ASK.has(p.kind)); // まだ答えていないときは「解説を見る／とばす」を目立たせない
    const toTest = !u.isTest && VARIANTS[u.id] && SIMS.some(d => d.id === "unittest");
    if (u.isTest) {
      /* テスト：答えたら すぐ次の問題へ（解説は「図の解説をすすめる」で） */
      if (!answered[pi]) next.textContent = "とばす ▶";
      else if (pi < parts.length - 1) { next.textContent = "次の問題 ▶"; nextAct = () => goPart(pi + 1, 0); }
      else if (u.afterTest) { const a = u.afterTest(result); next.textContent = a[0]; nextAct = a[1]; if (testEnd && !u.shownSum) { u.shownSum = true; setTimeout(() => { const sb = sumBox && sumBox.firstChild; if (sb) sb.scrollIntoView({ behavior: "smooth", block: "center" }); }, 400); } }
      else { next.textContent = "結果を見る ▼"; nextAct = () => { if (!allAnswered()) return; go(k); const sb = sumBox && sumBox.firstChild; if (sb) sb.scrollIntoView({ behavior: "smooth", block: "center" }); }; }
    }
    else if (!answered[pi]) next.textContent = "解説を見る ▶";
    else if (k === N - 1) {
      if (!lastAll) next.textContent = `次は ${KIND[parts[pi + 1].kind][0]} ▶`;
      else if (toTest) { next.textContent = "確認テストへ ▶"; nextAct = () => { location.hash = "unittest?u=" + u.id; }; }
      else { next.textContent = "おわり"; next.disabled = true; }
    }
    else next.textContent = "次へ ▶";
  }
  c.refit = () => { const kk = k, p = parts[pi]; k = p.steps.length - 1; clear(G); try { p.render(T, k); } catch (e) { } fitStage(); go(kk); };
  const todo = done.findIndex(d => !d);
  if (hashQuery.part != null) {
    const pp = clamp(+hashQuery.part, 0, parts.length - 1);
    if (hashQuery.retry && ASK.has(parts[pp].kind)) { answered[pp] = false; result[pp] = null; }
    goPart(pp, 0);
  } else { resumed = todo > 0; goPart(todo < 0 ? 0 : todo, 0); }
}

  area.appendChild(box);

    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true }); r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); r.setSize(W, H);
    box.appendChild(r.domElement); box.appendChild(h("div", { class: "s3cap" }, "ドラッグで回す・ピンチやホイールで拡大"));
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, .9));
    const dl = new THREE.DirectionalLight(0xffffff, .75); dl.position.set(3, 6, 4); scene.add(dl);
    const root = new THREE.Group(); scene.add(root);
    const upd = BUILD3[spec.type](spec, root);
    const bb = new THREE.Box3().setFromObject(root), ctr = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3()).length();
    const cam = new THREE.PerspectiveCamera(40, W / H, .1, 200);
    const zf = Math.max(1, 1.25 / (W / H));
    cam.position.set(ctr.x + size * .15 * zf, ctr.y + size * .65 * zf, ctr.z + size * .95 * zf);
    const ctl = new THREE.OrbitControls(cam, r.domElement); ctl.target.copy(ctr); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = .6;
    r.domElement.addEventListener("pointerdown", () => { ctl.autoRotate = false; });
    Object.assign(S3, { r, scene, cam, ctl, upd, root });

      if (!S3.on) return;
      root.traverse(o => { if (o.userData && o.userData.to) o.position.lerp(o.userData.to, .12); });
      const w2 = box.clientWidth, h2 = box.clientHeight;

      text: p => `シュートが入る確率が ${fs(p.pn, p.pd)} の選手が、${p.n} 回シュートする。ちょうど ${p.k} 回入る確率を求めよ。`, scene: p => ({ type: "trials", kind: "ball", n: p.n }) },
  ],
  atleast: [
    { id: "dice", label: "🎲 サイコロ", token: null, defaults: { pn: 1, pd: 6, what: "1の目" },

    { id: "coin", label: "🪙 コイン", token: null, defaults: { pn: 1, pd: 2, what: "表" },
      text: p => `1 枚のコインを ${p.n} 回投げる。表が少なくとも 1 回出る確率を求めよ。`, scene: p => ({ type: "trials", kind: "coin", n: p.n }) },
    { id: "shoot", label: "🏀 シュート", token: null, defaults: { pn: 2, pd: 3, what: "シュート成功" },
      text: p => `シュートが入る確率が ${fs(p.pn, p.pd)} の選手が ${p.n} 回シュートする。少なくとも 1 回入る確率を求めよ。`, scene: p => ({ type: "trials", kind: "ball", n: p.n }) },
  ],
  lot: [
    { id: "sticks", label: "🎟 くじ引き", token: null, scene: p => ({ type: "sticks", total: p.total, wins: p.wins }) },
    { id: "bag", label: "👜 袋から順に取る", token: null, sentence: "赤玉 {wins} 個をふくむ {total} 個の玉。A、B の順に 1 個ずつ取る（もどさない）。B が赤玉を取る確率",
      text: p => `赤玉 ${p.wins} 個と白玉 ${p.total - p.wins} 個が入った袋から、A、B の順に 1 個ずつ取り出す（取り出した玉はもどさない）。B が赤玉を取り出す確率を求めよ。`,
      scene: p => ({ type: "bag", red: p.wins, white: p.total - p.wins }) },
  ],
  cond: [
    { id: "class", label: "🏫 クラス（めがね）", token: null, defaults: { A: "女子", nA: "男子", B: "めがね", ab: 6, anb: 9, nab: 5, nanb: 10 },
      scene: p => ({ type: "crowd", groups: [[p.ab, 0xb8502c], [p.anb, 0xf0b9a5], [p.nab, 0x2f5f9e], [p.nanb, 0xb9c9e0]], legend: [`${p.A}・${p.B}`, `${p.A}`, `${p.nA}・${p.B}`, `${p.nA}`] }) },
    { id: "factory", label: "🏭 工場の不良品", token: null, defaults: { A: "工場X製", nA: "工場Y製", B: "不良品", ab: 3, anb: 27, nab: 2, nanb: 18 },
      make: p => T_cond2({ rows: [[p.ab, p.anb], [p.nab, p.nanb]], A: p.A, nA: p.nA, B: p.B, nB: "良品", unit: "個", intro: `表にまとめる。A = ${p.A}、B = ${p.B}` }),
      text: p => `工場 X で ${p.ab + p.anb} 個、工場 Y で ${p.nab + p.nanb} 個の製品を作った。不良品は X に ${p.ab} 個、Y に ${p.nab} 個あった。工場 X の製品を 1 個えらんだとき、それが不良品である確率は？`,
      scene: p => ({ type: "crowd", groups: [[p.ab, 0xb8502c], [p.anb, 0xf0b9a5], [p.nab, 0x2f5f9e], [p.nanb, 0xb9c9e0]], legend: ["X・不良", "X", "Y・不良", "Y"] }) },
    { id: "club", label: "🚲 部活と通学", token: null, defaults: { A: "運動部", nA: "運動部でない", B: "自転車通学", ab: 12, anb: 8, nab: 6, nanb: 14 },
      text: p => `運動部 ${p.ab + p.anb} 人のうち自転車通学は ${p.ab} 人、運動部でない ${p.nab + p.nanb} 人のうち自転車通学は ${p.nab} 人。運動部の人をえらんだとき、自転車通学である確率は？`,
      scene: p => ({ type: "crowd", groups: [[p.ab, 0xb8502c], [p.anb, 0xf0b9a5], [p.nab, 0x2f5f9e], [p.nanb, 0xb9c9e0]], legend: ["運動部・自転車", "運動部", "自転車", "その他"] }) },
  ],
  test: [
    { id: "disease", label: "🏥 病気の検査", token: null, defaults: { prev: 2, sens: 90, fp: 10 },
      scene: p => { const s2 = Math.round(p.prev * 10), sp = Math.round(s2 * p.sens / 100), fpp = Math.round((1000 - s2) * p.fp / 100); return { type: "crowd", groups: [[sp, 0xb8502c], [s2 - sp, 0xf0b9a5], [fpp, 0x2f5f9e], [1000 - s2 - fpp, 0xd6cfc0]], cols: 40, legend: ["病気・陽性", "病気・陰性", "病気でない・陽性", "病気でない・陰性"] }; } },
    { id: "factory", label: "🏭 不良品の検査機", token: null, defaults: { prev: 3, sens: 95, fp: 4 }, sentence: "不良品が {prev} %。検査機は 不良品の {sens} % を不合格にし、良品の {fp} % もまちがって不合格にする。不合格なら本当に不良品の確率",
      text: p => `ある工場の製品の ${p.prev}% は不良品である。検査機は不良品の ${p.sens}% を不合格にするが、良品の ${p.fp}% もまちがって不合格にする。不合格になった製品が本当に不良品である確率は？`,
      make: p => T_test({ ...p, who: "個", bad: "不良品", good: "良品", posW: "不合格", tool: "検査機" }),
      scene: p => { const s2 = Math.round(p.prev * 10), sp = Math.round(s2 * p.sens / 100), fpp = Math.round((1000 - s2) * p.fp / 100); return { type: "crowd", groups: [[sp, 0xb8502c], [s2 - sp, 0xf0b9a5], [fpp, 0x2f5f9e], [1000 - s2 - fpp, 0xd6cfc0]], cols: 40, legend: ["不良・不合格", "不良・合格", "良品・不合格", "良品・合格"] }; } },
    { id: "spam", label: "📧 迷惑メール判定", token: null, defaults: { prev: 10, sens: 95, fp: 5 }, sentence: "迷惑メールが {prev} %。フィルターは 迷惑メールの {sens} % を見つけ、ふつうのメールの {fp} % もまちがって迷惑と判定。迷惑と判定されたら本当に迷惑メールの確率",
      text: p => `届くメールの ${p.prev}% は迷惑メールである。フィルターは迷惑メールの ${p.sens}% を「迷惑」と判定するが、ふつうのメールの ${p.fp}% もまちがって「迷惑」と判定する。「迷惑」と判定されたメールが本当に迷惑メールである確率は？`,
      make: p => T_test({ ...p, who: "通", bad: "迷惑メール", good: "ふつうのメール", posW: "迷惑と判定", tool: "フィルター" }),
      scene: p => { const s2 = Math.round(p.prev * 10), sp = Math.round(s2 * p.sens / 100), fpp = Math.round((1000 - s2) * p.fp / 100); return { type: "crowd", groups: [[sp, 0xb8502c], [s2 - sp, 0xf0b9a5], [fpp, 0x2f5f9e], [1000 - s2 - fpp, 0xd6cfc0]], cols: 40, legend: ["迷惑・判定", "迷惑・見のがし", "ふつう・判定", "ふつう"] }; } },
  ],
};

<script>
"use strict";
/* ===================== 例題メーカー（先生用） =====================
   問題文の □ に数字を入れる → 公式に数字が入る → その数字どおりの図で 1 ステップずつ解説 */
function maker(def) {
  sim({ id: "mk-" + def.id, cat: def.cat, name: def.name, sub: def.sub, maker: true, lesson: true, build(c) { runMaker(c, def); } });
}
function runMaker(c, def) {
  const svg = c.svg(800, 560), G = s("g", {}, svg);
  document.body.classList.add("unit-mode");
  c.fixedFit = true;
  const F = def.fields;
  const vals = {};
  Object.keys(F).forEach(key => { vals[key] = hashQuery[key] != null ? hashQuery[key] : F[key].def; });
  let custom = hashQuery.q || "";
  let tpl = null, k = 0;
  const T = {
    c, svg,
    at(j) { if (j > k) return document.createElementNS(NS, "g"); const g = s("g", {}, G); if (j === k && k > 0) g.setAttribute("class", "fadein"); return g; },
    now: j => j === k,
    get k() { return k; },
    move(el, from, to, delay, j) {
      el.style.transition = j === k ? "transform .7s cubic-bezier(.3,.7,.2,1)" : "none";
      if (j === k) { el.style.transform = `translate(${from.x}px, ${from.y}px)`; setTimeout(() => { el.style.transform = `translate(${to.x}px, ${to.y}px)`; }, 40 + (delay || 0)); }
      else el.style.transform = `translate(${to.x}px, ${to.y}px)`;
    },
  };
  /* 操作：もどる・次へ */
  const prev = c.btn("◀ もどる", () => go(k - 1)); prev.classList.add("big");
  const next = c.btn("解説をはじめる ▶", () => go(k + 1), { main: true }); next.classList.add("big");
  const again = h("button", { type: "button", class: "mini", title: "このステップの図をもう一度", onclick: () => go(k) }, "↻");
  c.row(prev, again, next).classList.add("navrow");
  c.nav = d => go(k + d);
  let hideAns = store.get("mkHide", true); // 先生が 映すとき 答えが先に見えないように（はじめは かくす）
  document.body.classList.add("has-nav");
  c.on(document, "keydown", e => {
    if (e.target.closest && e.target.closest("input,textarea,select")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(k + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(k - 1); }
  });
  /* 場面（文章題のシチュエーション） */
  const sits = (SITS[def.id] || []).concat(SITS[def.id] ? [{ id: "formula", label: "✏️ 公式だけ", token: null }] : []);
  let sit = sits.find(x => x.id === hashQuery.sit) || sits[0] || { id: "formula", token: null };
  const sentenceOf = () => sit.sentence || def.sentence;
  const text = clear($("#text"));
  if (sits.length > 1) {
    text.appendChild(h("div", { class: "askh" }, "場面をえらぶ"));
    const sb = h("div", { class: "sitbar" });
    sits.forEach(x => sb.appendChild(h("button", { type: "button", class: "sitbtn" + (x === sit ? " on" : ""), onclick: e => {
      sit = x; sb.querySelectorAll(".sitbtn").forEach(b => b.classList.toggle("on", b === e.currentTarget));
      if (x.defaults) Object.assign(vals, x.defaults);
      custom = ""; ta.value = ""; buildForm(); rebuild(); if (S3.on) show3D(sceneSpec(), k);
    } }, x.label)));
    text.appendChild(sb);
  }
  text.appendChild(h("div", { class: "askh" }, "問題の数字を入れる"));
  const form = h("div", { class: "mkform" });
  let inputs = {};
  function buildForm() {
    clear(form); inputs = {};
    sentenceOf().split(/(\{\w+\})/).forEach(part => {
      const m2 = part.match(/^\{(\w+)\}$/);
      if (!m2) { part.split("\n").forEach((line, li) => { if (li) form.appendChild(h("br")); if (line) form.appendChild(document.createTextNode(line)); }); return; }
      const key = m2[1], f = F[key];
      let el;
      if (f.opts) { el = h("select", { class: "mkin" }); f.opts.forEach(([v, t2]) => el.appendChild(h("option", { value: v }, t2))); el.value = vals[key]; }
      else el = h("input", { class: "mkin" + (f.text ? " txt" : ""), type: f.text ? "text" : "number", inputmode: f.text ? null : "numeric", value: vals[key], min: f.min, max: f.max, style: `width:${f.w || (f.text ? 5 : 3.2)}em`, "aria-label": f.label || key });
      el.addEventListener("input", () => { vals[key] = el.value; schedule(); });
      inputs[key] = el;
      form.appendChild(el);
    });
  }
  buildForm();
  text.appendChild(form);
  /* 文章題をランダムにつくる */
  const rollBtn = h("button", { type: "button", class: "varbtn", onclick: () => randomProblem() }, "🎲 文章題をつくる（場面と数字をランダムに）");
  if (sits.length > 1) text.appendChild(rollBtn);
  function randomProblem() {
    const pool = sits.filter(x => x.id !== "formula");
    for (let t = 0; t < 60; t++) {
      const x = pool.length ? pool[rnd(pool.length)] : sit;
      const v = {};
      Object.entries(F).forEach(([key, f]) => {
        if (f.opts) v[key] = f.opts[rnd(f.opts.length)][0];
        else if (f.text) v[key] = vals[key];
        else { const lo = f.rmin ?? f.min, hi = f.rmax ?? Math.min(f.max, lo + 6); v[key] = String(lo + rnd(hi - lo + 1)); }
      });
      if (x.defaults) Object.entries(x.defaults).forEach(([key, dv]) => { if (F[key] && (F[key].text || key === "pn" || key === "pd")) v[key] = String(dv); });
      if (def.rand) Object.assign(v, def.rand());
      const p = {}; Object.keys(F).forEach(key => { p[key] = F[key].text || F[key].opts ? v[key] : Number(v[key]); });
      const bad = Object.entries(F).some(([key, f]) => !f.text && !f.opts && (p[key] < f.min || p[key] > f.max));
      if (bad || (def.check && def.check(p)) || (x.check && x.check(p))) continue;
      sit = x; Object.assign(vals, v);
      text.querySelectorAll(".sitbtn").forEach((b, i) => b.classList.toggle("on", sits[i] === sit));
      custom = ""; ta.value = ""; buildForm(); rebuild(); if (S3.on) show3D(sceneSpec(), k);
      if (narrowMQ.matches) window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
  }
  /* 3D */
  const sceneSpec = () => { try { return sit.scene ? sit.scene(params()) : null; } catch (e) { return null; } };
  c.scene3d = () => sceneSpec();
  c.curStep = () => k;
  const err = h("div", { class: "mkerr" });
  text.appendChild(err);
  if (def.presets) {
    const pr = h("div", { class: "mkpre" }, h("span", {}, "例："));
    def.presets.forEach(([label, v]) => pr.appendChild(h("button", { type: "button", class: "btn", onclick: () => { Object.assign(vals, v); Object.keys(v).forEach(key => { if (inputs[key]) inputs[key].value = v[key]; }); custom = ""; ta.value = ""; rebuild(); } }, label)));
    text.appendChild(pr);
  }
  const ta = h("textarea", { class: "mkta", rows: 3, placeholder: "教科書の問題文をそのまま書いてもOK（上に大きく出ます）" });
  ta.value = custom;
  ta.addEventListener("input", () => { custom = ta.value.trim(); showProblem(); saveHash(); });
  text.appendChild(h("details", { class: "flow", open: custom ? true : null }, h("summary", {}, "✏️ 問題文を自分で書く"), ta));
  const listWrap = h("div", {});
  text.appendChild(listWrap);
  /* 先生の道具：答えをかくす・リンク・保存・印刷 */
  const tools = h("div", { class: "mktools" });
  const hideT = c.toggle("答えをかくす（生徒に考えさせる）", hideAns, v => { hideAns = v; store.set("mkHide", v); go(k); }, "var(--warm)");
  tools.appendChild(hideT.el);
  tools.appendChild(c.btn("🔗 リンクをコピー", () => copyLink()));
  tools.appendChild(c.btn("☆ この例題を保存", () => saveExample()));
  tools.appendChild(c.btn("🖨 印刷", () => window.print()));
  text.appendChild(tools);
  const share = h("div", { class: "mkshare" });
  text.appendChild(share);
  const savedBox = h("details", { class: "flow" });
  text.appendChild(savedBox);
  function renderSaved() {
    clear(savedBox);
    const list = store.get("mkSaved", []);
    savedBox.appendChild(h("summary", {}, `☆ 保存した例題（${list.length}）`));
    if (!list.length) { savedBox.appendChild(h("p", { style: "font-size:13px;color:var(--muted)" }, "「☆ この例題を保存」で、ここに たまります（このブラウザに保存）。")); return; }
    const ul = h("ul", { class: "saved", style: "list-style:none;padding:0;margin:4px 0" });
    list.forEach((it, i) => ul.appendChild(h("li", {}, h("a", { href: it.hash }, it.title), h("button", { type: "button", title: "けす", onclick: () => { list.splice(i, 1); store.set("mkSaved", list); renderSaved(); } }, "✕"))));
    savedBox.appendChild(ul);
  }
  function copyLink() {
    const url = siteBase() + location.hash;
    const ok = () => { share.textContent = "✓ リンクをコピーしました。プリントや連絡に はりつけられます"; };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, () => { share.textContent = url; });
    else share.textContent = url;
  }
  function saveExample() {
    const list = store.get("mkSaved", []);
    const title = `${def.name}：${(custom || $("#fprob").textContent.replace(/^例題/, "")).slice(0, 40)}`;
    if (!list.some(it => it.hash === location.hash)) list.unshift({ hash: location.hash, title });
    store.set("mkSaved", list.slice(0, 50)); renderSaved();
    share.textContent = "☆ 保存しました（下の「保存した例題」から開けます）";
  }
  renderSaved();

  let timer = 0;
  function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 450); }
  const num = key => { const v = vals[key]; if (F[key].text || F[key].opts) return v; return Number(v); };
  function params() { const o = {}; Object.keys(F).forEach(key => { o[key] = num(key); }); return o; }
  function showProblem() {
    const p = params();
    $("#fprob").innerHTML = `<span class="kbadge" style="--kc:var(--blue)">例題</span>${custom ? custom.replace(/[<>&]/g, ch => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[ch])).replace(/\n/g, "<br>") : (sit.text || def.text)(p)}`;
  }
  function saveHash() {
    const q = new URLSearchParams();
    Object.keys(F).forEach(key => q.set(key, vals[key]));
    if (sit && sit.id !== (sits[0] || {}).id) q.set("sit", sit.id);
    if (custom) q.set("q", custom);
    history.replaceState(null, "", `#mk-${def.id}?${q.toString()}`);

  }
  function rebuild() {
    const p = params();
    for (const key of Object.keys(F)) {
      const f = F[key];
      if (f.text || f.opts) continue;
      if (!Number.isInteger(p[key])) { err.textContent = `「${f.label || key}」に整数を入れてください`; return; }
      if (f.min != null && p[key] < f.min || f.max != null && p[key] > f.max) { err.textContent = `「${f.label || key}」は ${f.min}〜${f.max} の数にしてください（図にかける大きさ）`; return; }
    }
    const e = (def.check ? def.check(p) : "") || (sit.check ? sit.check(p) : "");
    if (e) { err.textContent = e; return; }
    err.textContent = "";
    TOKEN.kind = sit.token || null;
    try { tpl = (sit.make || def.make)(p); } catch (ex) { console.error(ex); err.textContent = "この数字では図をかけませんでした"; return; }
    showProblem(); saveHash();
    $("#cubeBtn").hidden = !sceneSpec();
    if (S3.on) { if (sceneSpec()) show3D(sceneSpec(), 0); else hide3D(); }
    clear(listWrap);
    const det = h("details", { class: "flow" }, h("summary", {}, "解説の流れを見る"));
    const ol = h("ol", { class: "steps" });
    tpl.steps.forEach((st, j) => { const li = h("li", { html: `<span>${st}</span>` }); li.addEventListener("click", () => go(j)); ol.appendChild(li); });
    det.appendChild(ol); listWrap.appendChild(det);
    listWrap.ol = ol;
    if (narrowMQ.matches) { k = tpl.steps.length - 1; clear(G); try { tpl.render(T, k); } catch (ex) { } }
    fitStage();
    go(0);
  }
  function go(n) {
    if (!tpl) return;
    const N = tpl.steps.length;
    k = clamp(n, 0, N - 1);
    clear(G);
    TOKEN.kind = sit.token || null;
    try { tpl.render(T, k); } catch (ex) { console.error(ex); }
    step3D(k);
    $("#fgen").innerHTML = (tpl.eq || []).filter(t => (t[3] == null || k <= t[3]) && (!hideAns || t[1] <= k)).map(([html, st, col]) =>
      `<span class="tok${col ? " c" + col : ""}${st > k ? " ghost" : st === k ? " now" : ""}">${html}</span>`).join("");
    c.out(`<div class="lsay"><span style="font-family:var(--font-data);color:var(--muted);font-size:13px">${k + 1}/${N}　</span>${termify(tpl.steps[k])}</div>`);
    setTimeout(fitStageHeight, 0);
    if (listWrap.ol) [...listWrap.ol.children].forEach((li, j) => li.className = j < k ? "done" : j === k ? "cur" : "");
    prev.disabled = k === 0;
    next.disabled = k === N - 1;
    next.textContent = k === 0 ? "解説をはじめる ▶" : k === N - 1 ? "おわり" : "次へ ▶";
  }
  c.refit = () => { if (!tpl) return; const kk = k; k = tpl.steps.length - 1; clear(G); try { tpl.render(T, k); } catch (e) { } fitStage(); go(kk); };
  rebuild();
}

/* ---------- 場合の数 ---------- */
maker({
  id: "perm", cat: "cnt", name: "順列 ₙPᵣ", sub: "□人から□人をえらんでならべる",
  fields: { n: { label: "全体の人数", def: 5, min: 1, max: 8, rmin: 4, rmax: 8 }, r: { label: "ならべる人数", def: 3, min: 1, max: 8, rmin: 2, rmax: 4 } },
  sentence: "{n} 人から {r} 人をえらんで 1 列にならべる",
  text: p => `${p.n} 人から ${p.r} 人をえらんで 1 列にならべる方法は何通りか。`,
