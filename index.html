const DICE_EV = {
  sum: ["和が k", (a, b, k) => a + b === k, (a, b) => a + b],
  sumge: ["和が k 以上", (a, b, k) => a + b >= k, (a, b) => a + b],
  same: ["同じ目", (a, b) => a === b, (a, b) => a + b],
  diff: ["差が k", (a, b, k) => Math.abs(a - b) === k, (a, b) => Math.abs(a - b)],
  prodeven: ["積が偶数", (a, b) => (a * b) % 2 === 0, (a, b) => a * b],

};

}

function fnv(str) { let x = 0x811c9dc5; for (const ch of str) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x; }

/* ---------- 生徒：確認テスト（数字は毎回かわる 5 問） ---------- */
sim({
  id: "unittest", cat: "task", name: "確認テスト", sub: "5 問中 4 問以上で合格", lesson: true, keepHash: true,
  build(c) {
    const id = hashQuery.u, fn = VARIANTS[id];
    if (!fn) {
      clear($("#text"));
      const box = c.html(), w = h("div", { class: "quiz" });
      box.appendChild(w);
      w.appendChild(h("div", { class: "qtext" }, "どの単元のテストをする？"));
      w.appendChild(h("p", {}, `数字は毎回かわる ${TESTN} 問。${PASS} 問以上で合格です。授業をおえてから やってみよう。`));
      w.appendChild(h("div", { class: "rv" }, ...Object.keys(VARIANTS).map(uid => { const st = unitStat(uid); return h("a", { class: "btn" + (st.best >= PASS ? " main" : ""), href: `#unittest?u=${uid}` }, `${unitName(uid)}${st.best != null ? `（${st.best}/${TESTN}）` : ""}`); })));
      c.out(`<span class="mt">単元をえらんでね</span>`);
      return;
    }
    const seen = new Set(), parts = [];
    for (let t = 0; parts.length < TESTN && t < 40; t++) {
      const v = fn();
      if (seen.has(v.problem) && t < 30) continue;
      seen.add(v.problem);
      parts.push({ kind: "test", tpl: v.tpl, title: `第${parts.length + 1}問`, problem: v.problem, choices: v.choices, more: v.more });
    }
    const tid = "test-" + id;
    store.set("unit:" + tid, {});
    let saved = false;
    runUnit(c, {
      id: tid, unitId: id, name: unitName(id) + " 確認テスト", isTest: true, pass: PASS, parts,
      /* テストのあと：合格なら 次の単元（課題があれば 課題の画面）、不合格なら もう一度 */
      afterTest(result) {
        const pass = result.filter(r => r === "ok").length >= PASS, ids = UNIT_IDS(), nx = ids[ids.indexOf(id) + 1], tk = store.get("task", null);
        if (!pass) return ["🔁 新しい問題で もう一度", () => open(`unittest?u=${id}`, false)];
        if (tk && tk.units && tk.units.includes(id)) return [tk.fin ? "🏅 修了証を見る ▶" : "📮 課題の画面へ ▶", () => { location.hash = "task"; }];
        return nx ? [`次の単元「${unitName(nx)}」へ ▶`, () => { location.hash = nx; }] : ["◀ ゲーム・復習へ", () => { location.hash = "review"; }];
      },
      summary(result, goTo) {
        const score = result.filter(r => r === "ok").length, pass = score >= PASS;
        const old = store.get("test:" + id, null);
        if (!saved) { store.set("test:" + id, { score, best: Math.max(score, old ? old.best : 0), date: today() }); saved = true; syncTask(); if (pass && typeof earn === "function") earn(!old || old.best < PASS ? 150 : 50); }
        const best = store.get("test:" + id).best;
        const box = h("div", { class: "summary" });
        if (pass) box.appendChild(h("div", { class: "stamp" }, "合格"));
        box.appendChild(h("h3", {}, `${unitName(id)} 確認テスト：${score} / ${parts.length} 問`));
        const sc2 = h("div", { class: "score" });
        result.forEach((r, i) => sc2.appendChild(r === "ok" ? h("span", { class: "qmark ok" }, `${i + 1}問目 ○`) : h("button", { type: "button", class: "qmark ng", title: "この問題の解説を見る", onclick: () => goTo && goTo(i) }, `${i + 1}問目 × 解説 ▸`)));
        sc2.appendChild(h("div", { html: `${pass ? "合格！ よくできました。" : `あと ${PASS - score} 問で合格。× の問題を おして 解説を見てから、もう一度やってみよう。`}<br>これまでの最高：${best} / ${parts.length}` }));
        box.appendChild(sc2);
        const tk = store.get("task", null);
        if (pass && tk && tk.fin) box.appendChild(h("p", { style: "font-weight:700;color:var(--accent)" }, "🏅 課題を全部クリア！ 修了証ができました"));
        box.appendChild(h("div", { class: "rv", style: "margin-top:10px" },
          h("button", { type: "button", class: "btn" + (pass ? "" : " main"), onclick: () => open(`unittest?u=${id}`, false) }, "🔁 新しい問題で もう一度"),
          h("a", { class: "btn", href: "#" + id }, "📖 授業を見なおす"),
          store.get("task", null) ? h("a", { class: "btn" + (pass ? " main" : ""), href: "#task" }, (store.get("task").fin ? "🏅 修了証を見る" : "📮 課題の画面へ")) : null));
        return box;
      },
    });
  },
});

/* ---------- クラス対戦：データベース ---------- */
function dbBase() {
  const u = (store.get("db", "") || DB_DEFAULT).trim().replace(/\/+$/, "");
  return /^https:\/\/[^\s]+$/.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/.test(u) ? u : "";
}
function pid() { let p = store.get("pid", ""); if (!p) { p = "p" + Math.random().toString(36).slice(2, 10); store.set("pid", p); } return p; }
function api(method, path, body) {
  const o = { method }; if (body !== undefined) o.body = JSON.stringify(body);
  return fetch(dbBase() + "/" + path + ".json", o).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
function listen(path, cb) {
  let tree = null, es = null, poll = null, closed = false;

    const keys = p.split("/").filter(Boolean);

    if (tree === null || typeof tree !== "object") tree = {};
    let o = tree;
    for (let i = 0; i < keys.length - 1; i++) { if (o[keys[i]] == null || typeof o[keys[i]] !== "object") o[keys[i]] = {}; o = o[keys[i]]; }
    if (val === null) delete o[keys[keys.length - 1]]; else o[keys[keys.length - 1]] = val;
  };
  const startPoll = () => { if (poll || closed) return; poll = setInterval(() => { api("GET", path).then(v => { tree = v; cb(tree); }, () => { }); }, 1500); };
  try {
    es = new EventSource(dbBase() + "/" + path + ".json");
    es.addEventListener("put", e => { const d = JSON.parse(e.data); setAt(d.path, d.data); cb(tree); });
    es.addEventListener("patch", e => { const d = JSON.parse(e.data), p = d.path.replace(/\/$/, ""); Object.keys(d.data || {}).forEach(k => setAt(p + "/" + k, d.data[k])); cb(tree); });
    es.onerror = () => { if (es.readyState === 2) startPoll(); };
  } catch (e) { startPoll(); }
  return () => { closed = true; if (es) es.close(); clearInterval(poll); };
}
function syncClock(code) {
  const t0 = Date.now(), p = ROOM(code) + "/clock/" + pid();
  return api("PUT", p, { ".sv": "timestamp" }).then(ts => { const t1 = Date.now(); if (typeof ts === "number") OFF = ts - (t0 + t1) / 2; api("DELETE", p).catch(() => { }); }, () => { });
}
function joinUrl(code) { let u = baseURL() + "#battle?room=" + code; if (dbBase() !== DB_DEFAULT) u += "&db=" + encodeURIComponent(dbBase()); return u; }
function playersOf(room, round) {
  const ps = room && room.players || {};
  return Object.keys(ps).map(k => Object.assign({ id: k }, ps[k])).filter(p => p && p.n && (round == null || p.r === round))
    .sort((a, b) => round == null ? (b.b || 0) - (a.b || 0) : (b.s || 0) - (a.s || 0));
}
let BT = null; // 生徒の対戦の状態
function pushScore(final) {
  if (!G || G.mode !== "battle" || !BT) return;
  if (!final && G.over) return; /* 終わったあとに 前の送信が「おわり」を上書きしないように */
  if (final) clearTimeout(BT.push);
  const t = Date.now();
  if (!final && t - BT.last < 600) { clearTimeout(BT.push); BT.push = setTimeout(() => pushScore(), 650); return; }
  BT.last = t;
  const me = BT.room && BT.room.players && BT.room.players[pid()] || {};
  api("PATCH", ROOM(BT.code) + "/players/" + pid(), { s: G.score, k: G.combo, w: G.ok, m: G.miss, c: G.maxCombo, r: BT.played, b: Math.max(me.b || 0, G.score), d: final ? 1 : 0 }).catch(() => { });
}
/* 結果発表の「賞」：点数だけでなく、正確さ・コンボ・たくさん解いた人も ほめる */
function awardsOf(lst) {
  const out = [], acc = p => (p.w || 0) / Math.max(1, (p.w || 0) + (p.m || 0));
  const best = (f, ok) => { const c2 = lst.filter(ok || (() => true)); if (!c2.length) return null; const v = Math.max(...c2.map(f)); return v > 0 ? { v, who: c2.filter(p => f(p) === v) } : null; };
  const a1 = best(acc, p => (p.w || 0) + (p.m || 0) >= 5); if (a1) out.push({ ico: "🎯", name: "正確さ No.1", val: `${Math.round(a1.v * 100)}%`, who: a1.who });
  const a2 = best(p => p.c || 0); if (a2 && a2.v >= 3) out.push({ ico: "⚡", name: "コンボ No.1", val: `${a2.v} 連続`, who: a2.who });
  const a3 = best(p => p.w || 0); if (a3) out.push({ ico: "📚", name: "正解数 No.1", val: `${a3.v} 問`, who: a3.who });
  return out;
}
const awardsHTML = (aw, me) => aw.length ? `<div class="awards">${aw.map(a => `<span class="aw${me && a.who.some(p => p.id === me) ? " me" : ""}"><i>${a.ico}</i><b>${a.name}</b>${a.who.slice(0, 3).map(p => esc(p.n)).join("・")}${a.who.length > 3 ? " ほか" : ""}<small>${a.val}</small></span>`).join("")}</div>` : "";
/* ランキング表：広さを測って 列数・行数・文字の大きさを決める（40 人でもスクロールなし） */
function rankRows(list, mode, W, H, off = 0) {
  const top = Math.max(1, list.reduce((m, p) => Math.max(m, mode === "best" ? p.b || 0 : p.s || 0), 0));
  const n = list.length; let cols = n <= 10 ? 1 : n <= 24 ? 2 : 3, rowsN = n, more = 0, style = "";
  if (W && H) {
    cols = Math.max(1, Math.min(cols, Math.floor(W / 230)));
    const maxRows = Math.max(1, Math.floor(H / 24));
    rowsN = Math.ceil(n / cols);
    if (rowsN > maxRows) { rowsN = maxRows; more = n - (cols * rowsN - 1); list = list.slice(0, cols * rowsN - 1); }
    rowsN = Math.max(Math.min(8, maxRows), rowsN);
    const fs2 = Math.max(11, Math.min(26, H / rowsN * 0.55));
    style = ` style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rowsN},minmax(0,1fr));font-size:${fs2.toFixed(1)}px"`;

  return `<ol class="rk"${style}>` + list.map((p, i) => {

    if (v !== last) { rank = i + 1 + off; last = v; }
    const medal = rank <= 3 && v > 0 ? ["🥇", "🥈", "🥉"][rank - 1] : rank;
    return `<li class="${rank <= 3 && v > 0 ? "top top" + rank : ""}${p.id === pid() ? " me" : ""}"><span class="rn">${medal}</span><span class="nm">${esc(p.n)}${mode !== "best" && p.k >= 10 && !p.d ? ` <i class="fire">🔥${p.k}</i>` : ""}${mode === "now" && p.d ? ` <i class="fin">おわり</i>` : ""}</span><span class="bar"><i style="width:${(v / top * 100).toFixed(1)}%"></i></span><span class="sc">${fmtN(v)}</span></li>`;
  }).join("") + (more ? `<li class="more">…ほか ${more} 人</li>` : "") + "</ol>";
}

        body = ps.length ? `<div class="chips">${ps.map(p => `<span class="chipn">${esc(p.n)}</span>`).join("")}</div>` : `<div class="gcount"><small>生徒が 部屋番号 ${code} で 入ってくると ここに名前が出ます</small></div>`;
      } else if (r.state === "play" && t < r.startAt) {
        head = `<div class="bhead"><b>第${r.round}回戦　${cfgName(r.cfg)}</b>${tabs}</div>`;
        body = `<div class="gcount"><b>${Math.max(1, Math.ceil((r.startAt - t) / 1000))}</b><small>まもなく スタート！</small></div>`;
      } else {
        lst = playersOf(r, r.round);
        const end = r.state === "end", alive = lst.filter(p => !p.d).length, el2 = Math.max(0, Math.floor((t - r.startAt) / 1000));
        head = `<div class="bhead"><b>${end ? "🎉 第" + r.round + "回戦 結果発表" : `⏱ ${Math.floor(el2 / 60)}:${String(el2 % 60).padStart(2, "0")}　まだプレイ中 ${alive} / ${lst.length} 人`}</b>${tabs}</div>` + (end ? "" : `<div class="tbar host"><i style="width:${lst.length ? alive / lst.length * 100 : 0}%"></i></div>`);
        if (end && lst[0] && lst[0].s > 0) head += `<div class="champ">🥇 ${esc(lst[0].n)} さん　${fmtN(lst[0].s)} 点</div>` + awardsHTML(awardsOf(lst));
        if (!lst.length) { lst = null; body = `<div class="gcount"><small>まだ だれも 答えていません</small></div>`; }
      }
      el.innerHTML = head + `<div class="bbody">${lst ? "" : body}</div>`;
      if (lst) { const bb = el.querySelector(".bbody"); bb.innerHTML = rankRows(lst, lmode === "now" && r.state === "end" ? "end" : lmode, bb.clientWidth, bb.clientHeight); }
    }
  },
});

/* ---------- 生徒：参加・対戦 ---------- */
sim({
  id: "battle", cat: "game", name: "クラス対戦に参加", sub: "部屋番号を入れて参加", lesson: true, keepHash: true,
  build(c) {
    clear($("#text"));
    const box = c.html();
    if (hashQuery.db) { store.set("db", decodeURIComponent(hashQuery.db)); }
    const code0 = String(hashQuery.room || "").replace(/\D/g, "");
    let code = code0, nick = store.get("nick", "");
    BT = null; G = null;
    bindPlay(c, box, () => { G = null; drawWait(); });
    c.cleanups.push(() => { if (BT && BT.stop) BT.stop(); BT = null; G = null; });
    c.on(box, "click", e => {
      const b = e.target.closest("button"); if (!b || b.disabled || !BT || !BT.qp) return;
      if (b.dataset.qp === "leave") { BT.stop && BT.stop(); BT = null; open("game"); return; }
      if (b.dataset.qa != null || b.dataset.qp) BT.qp.click(b);
    });
    c.every(250, () => { if (BT && BT.qp && BT.room && BT.room.kind === "quiz") BT.qp.tick(); });
    const joinForm = msg => {
      clear(box);
      const w = h("div", { class: "quiz task", style: "text-align:center" });
      const ci = h("input", { type: "text", class: "mkin bigin", inputmode: "numeric", maxlength: "4", value: code, placeholder: "0000" });
      const ni = h("input", { type: "text", class: "mkin txt", maxlength: "10", placeholder: "ニックネーム（10文字まで）", value: nick, style: "width:12em;text-align:left" });
      const note = h("div", { class: "mkerr" }, msg || "");
      w.appendChild(h("div", { class: "qtext" }, "🏆 部屋に入る"));
      w.appendChild(h("p", { class: "note" }, "部屋番号"));
      w.appendChild(h("div", {}, ci));
      w.appendChild(h("div", { style: "margin:10px 0" }, ni));
      w.appendChild(h("p", { class: "note" }, "本名ではなく ニックネームでも OK。ランキングに表示されます"));
      w.appendChild(h("div", { class: "rv", style: "justify-content:center" }, h("button", { type: "button", class: "btn main big", onclick: () => join(ci.value.replace(/\D/g, ""), ni.value.trim().slice(0, 10), note) }, "参加する ▶"), h("a", { class: "btn", href: "#game" }, "◀ もどる")));
      w.appendChild(note);
      box.appendChild(w);
      if (code && !nick) ni.focus();
      c.out(`<span class="mt">部屋番号と ニックネームを入れてね</span>`);
    };
    function join(cd, nm, note) {
      if (cd.length !== 4) { note.textContent = "部屋番号は 4 けたです"; return; }
      if (!nm) { note.textContent = "ニックネームを入れてください"; return; }
      note.textContent = "つないでいます…";
      code = cd; nick = nm; store.set("nick", nm);
      const me = ROOM(cd) + "/players/" + pid();
      api("GET", ROOM(cd) + "/state").then(st => { if (!st) throw new Error("nf"); return api("GET", me); })
        .then(old => api("PATCH", me, { n: nm, s: old && old.s || 0, b: old && old.b || 0, r: old && old.r || 0, k: 0 }))
        .then(() => syncClock(cd))
        .then(() => { RW.battles = Math.max(RW.battles, 1); rwSave(); checkBadges(); if (code0 !== cd) history.replaceState(null, "", "#battle?room=" + cd); enter(); })
        .catch(e => { note.textContent = e.message === "nf" ? `部屋 ${cd} が見つかりません` : `つながりません（${e.message}）`; });
    }
    function enter() {
      BT = { code, room: null, played: 0, last: 0, push: null, awarded: {} };
      drawWait();
      BT.stop = listen(ROOM(code), onRoom);
    }
    function onRoom(room) {
      if (!BT) return;
      if (!room) { BT.stop && BT.stop(); BT = null; G = null; joinForm("先生が部屋を閉じました"); return; }
      BT.room = room;
      const me = room.players && room.players[pid()];
      if (!me) { BT.stop && BT.stop(); BT = null; joinForm(""); return; }
      /* クイズ大会（1 問ずつ） */
      if (room.kind === "quiz" && room.round && (room.state === "quiz" || room.state === "end") && (room.state === "quiz" || (BT.qp && BT.qp.round === room.round))) {
        if (!BT.qp) BT.qp = quizPlayer(c, box, code);
        BT.qp.update(room); return;
      }
      if (room.state === "play" && room.round !== BT.played && now() < room.startAt + startT(room.cfg) * 1000 - 3000) {
        BT.played = room.round;
        newGame(room.cfg, room.seed, "battle", room.startAt);
        api("PATCH", ROOM(code) + "/players/" + pid(), { s: 0, k: 0, w: 0, r: room.round, d: 0 }).catch(() => { });
        playShell(box, `部屋 ${code}・第${room.round}回戦`);
        runClock(c, endBattle);
        c.out(`🏆 第${room.round}回戦　${cfgName(room.cfg)}`);
        return;
      }
      if (room.state === "end" && BT.played === room.round && !BT.awarded[room.round]) {
        BT.awarded[room.round] = 1;
        const lst = playersOf(room, room.round), my = lst.map(p => p.id).indexOf(pid());
        if (my >= 0 && my < 3 && lst[my].s > 0) { RW.top3++; earn(50); }
        rwSave(); checkBadges();
      }
      if (!G || G.over) drawWait();
    }
    function endBattle() {
      clearTimeout(BT && BT.push); pushScore(true);
      const coins = afterGame() + 20; rwSave(); earn(coins);
      G.coins = coins; BT.log = G.log;
      setTimeout(drawWait, 300);
    }
    function drawWait() {
      if (!BT) return;
      const room = BT.room;
      clear(box);
      const w = h("div", { class: "quiz task", style: "text-align:center" });
      w.appendChild(h("div", { class: "rv", style: "align-items:center;justify-content:space-between;text-align:left" }, h("button", { type: "button", class: "btn", onclick: () => { BT.stop && BT.stop(); BT = null; open("game"); } }, "◀ ぬける"), h("b", {}, `🏆 部屋 ${code}`), h("span", { class: "ppl" }, `👥 ${room ? playersOf(room).length : 0} 人`)));
      if (!room) w.appendChild(h("p", { class: "qtext" }, "つないでいます…"));
      else if (room.state === "play" && room.round !== BT.played) { w.appendChild(h("p", { class: "qtext" }, `いま 第${room.round}回戦の最中です`)); w.appendChild(h("p", {}, "次の回から参加できます。少し待ってね")); }
      else if (BT.played && room.round === BT.played) {
        const lst = playersOf(room, room.round), my = lst.map(p => p.id).indexOf(pid()), meP = lst[my] || {}, fin = room.state === "end";
        w.appendChild(h("p", { class: "note" }, `第${room.round}回戦 ${fin ? "結果" : "（集計中… みんなが終わるのを待っています）"}`));
        w.appendChild(h("div", { class: "gscore" }, String(my + 1), h("small", {}, ` 位 / ${lst.length} 人`)));
        w.appendChild(h("p", { class: "tstats" }, `${fmtN(meP.s || 0)} 点　✅ ${meP.w || 0} 問${G && G.coins ? `　🪙 +${G.coins}` : ""}`));
        w.appendChild(h("div", { class: "gres", html: rankRows(lst.slice(0, 5), fin ? "end" : "now") }));
        if (fin) { const aw = awardsOf(lst), mine = aw.filter(a => a.who.some(p => p.id === pid())); if (mine.length) w.appendChild(h("p", { class: "phrase", html: `🎉 ${mine.map(a => `${a.ico} <b>${a.name}</b>`).join("・")} をとった！` })); w.appendChild(h("div", { html: awardsHTML(aw, pid()) })); }
        if (fin) w.appendChild(h("p", { class: "note" }, "先生が 次のスタートをおすと 始まります"));
        /* 解説は 全員が終わってから（まだ解いている人に 答えが伝わらないように） */
        if (BT.log && fin) w.appendChild(BT.rv && BT.rvLog === BT.log ? BT.rv : (BT.rvLog = BT.log, BT.rv = reviewBox(BT.log)));
        c.out(`第${room.round}回戦：<span class="big hl">${my + 1}</span> 位 / ${lst.length} 人　${fmtN(meP.s || 0)} 点`);
      } else {
        w.appendChild(h("div", { class: "stamp wait" }, "参加中"));
        w.appendChild(h("p", { class: "qtext" }, `${nick} さん、ようこそ！`));
        w.appendChild(h("p", {}, room.cfg && room.cfg.mode !== "race" ? "先生が スタートをおすと、1 問ずつ 問題が出ます。じっくり考えて 答えよう" : "先生が スタートをおすと 3・2・1 で 全員いっせいに始まります"));
        w.appendChild(h("div", { class: "chips small" }, ...playersOf(room).slice(0, 40).map(p => h("span", { class: "chipn" + (p.id === pid() ? " me" : "") }, p.n))));
        c.out(`🏆 部屋 ${code} に参加中　<span class="mt">先生のスタートを待とう</span>`);
      }
      box.appendChild(w);
    }
    if (!dbBase()) { joinForm("データベースの設定がありません"); return; }
    if (code && nick) {
      /* リンクから来て 名前も入っている → そのまま入る */
      joinForm(""); const note = box.querySelector(".mkerr"); join(code, nick, note);
    } else joinForm("");
  },
});
coinChip();
</script>
<script>
"use strict";
/* ===================== 1 問ずつ じっくり考えるゲーム =====================
   数学は 1 問に時間がかかるので「全員が同じ 1 問を 考える → 答え合わせと解説 → 順位」をくり返す。
   ・🧗 じっくりチャレンジ（ひとり）：❤ 3 つ。1 問ずつ 考える時間があり、答えたら すぐ解説。
   ・🏆 クラス対戦「クイズ大会」：先生の画面に 1 問ずつ出して、全員が スマホで答える。 */
const QLIM = { 1: 40, 2: 75, 3: 120 };              // 考える時間（秒）：★ の数で きまる
const QSPEED = { s: 0.6, n: 1, l: 1.5 };             // 短め・ふつう・長め
const QSPEED_NAME = { s: "短め", n: "ふつう", l: "長め" };
const qLimit = (w, sp) => Math.round(QLIM[w] * (QSPEED[sp] || 1));
/* 点数：正解なら 500〜1000 点（はやいほど 多い。でも 正しさの方が ずっと大事）× むずかしさ × 連続正解 */
function qPoints(remainFrac, w, streakBefore, hint) {
  const base = 500 + 500 * Math.max(0, Math.min(1, remainFrac));
  return Math.round(base * (0.75 + 0.25 * w) * (1 + 0.1 * Math.min(5, streakBefore)) * (hint ? 0.5 : 1));
}
const SHAPES = [["▲", "var(--warm)"], ["◆", "var(--blue)"], ["●", "var(--gold)"], ["■", "var(--accent)"]];
const quizName = cfg => `${GNAME[cfg.m] || cfg.m}・${cfg.n || 10} 問・考える時間 ${QSPEED_NAME[cfg.sp || "n"]}`;

/* 問題カード（スマホでも プロジェクターでも 使う） */
function qCardHTML(q, opt = {}) {
  const counts = opt.counts, total = counts ? Math.max(1, counts.reduce((a, b) => a + b, 0)) : 1;
  return `<div class="qc${opt.big ? " big" : ""}">
    <div class="qcq">${opt.term === false ? q.q : termify(q.q)}</div>
    ${q.fig ? `<div class="qcfig">${q.fig}</div>` : ""}
    <div class="qcch${q.ch.every(c2 => String(c2).replace(/<[^>]+>/g, "").length <= 8) && !opt.counts ? " short" : ""}">${q.ch.map((c2, i) => {
      const right = opt.reveal && c2 === q.ans, mine = opt.mine === i;
      const cls = (opt.reveal ? (right ? " right" : " dim") : "") + (mine ? " mine" : "") + (opt.btn ? "" : " show");
      const bar = counts ? `<i class="cnt" style="width:${(counts[i] / total * 100).toFixed(1)}%"></i><em>${counts[i]} 人</em>` : "";
      return `<${opt.btn ? `button type="button" data-qa="${i}"${opt.disabled ? " disabled" : ""}` : "div"} class="qch${cls}" style="--sc:${SHAPES[i][1]}"><span class="sh">${SHAPES[i][0]}</span><span class="tx">${c2}</span>${bar}${right ? '<span class="ok">✓</span>' : ""}</${opt.btn ? "button" : "div"}>`;
    }).join("")}</div></div>`;
}
const qTimerHTML = (left, lim) => `<div class="qtimer${left < 10 ? " hurry" : ""}"><i style="width:${Math.max(0, left / lim * 100).toFixed(1)}%"></i><span>⏱ のこり ${Math.max(0, Math.ceil(left))} 秒</span></div>`;
const explainHTML = q => `${q.ex ? `<div class="rvex"><b>解説</b>${q.ex}</div>` : ""}${(() => { const fo = formulaOf(q.key); return fo ? `<div class="rvfo">📐 ${fo[0]}：${fo[1]}</div>` : ""; })()}`;

/* ---------- 🧗 じっくりチャレンジ（ひとり） ---------- */
const clCfg = () => Object.assign({ m: "all", sp: "n" }, store.get("climb", {}));
sim({
  id: "climb", cat: "game", name: "じっくりチャレンジ", sub: "1 問ずつ考える・❤ 3 つ", lesson: true, keepHash: true, hidden: true,
  build(c) {
    clear($("#text"));
    const box = c.html(), cfg = clCfg();
    const qs = makeQs(Object.assign({}, cfg, { st: false }), Math.floor(Math.random() * 1e9), 80);
    const S = c.state = { i: -1, lives: 3, score: 0, streak: 0, best: 0, ok: 0, log: [], q: null, start: 0, lim: 0, answered: false, hint: false, pad: null };
    const wrap = h("div", { class: "climb" });
    box.appendChild(wrap);
    c.on(box, "click", e => {
      const b = e.target.closest("button"); if (!b || b.disabled) return;
      if (b.dataset.qa != null) answer(+b.dataset.qa);
      else if (b.dataset.cl === "next") next();
      else if (b.dataset.cl === "hint") { if (!S.answered && !S.hint) { S.hint = true; draw(); } }
      else if (b.dataset.cl === "quit") open("game");
    });
    c.on(document, "keydown", e => { if (!S.answered && /^[1-4]$/.test(e.key) && !e.target.closest("input,textarea")) answer(+e.key - 1); if (S.answered && e.key === "Enter") next(); });
    c.every(200, () => { if (!S.answered && S.q) { const left = S.lim - (Date.now() - S.start) / 1000; if (left <= 0) answer(null); else { const t = wrap.querySelector(".qtimer"); if (t) t.outerHTML = qTimerHTML(left, S.lim); } } });
    function hud() { return `<div class="clhud"><button type="button" class="btn" data-cl="quit" title="やめる">✕</button><span class="lives">${"❤️".repeat(S.lives)}${"🤍".repeat(Math.max(0, 3 - S.lives))}</span><span class="qn">第 <b>${S.i + 1}</b> 問 <span class="stars">${"★".repeat(S.q.w)}</span></span>${S.streak >= 2 ? `<span class="fire">🔥 ${S.streak} 連続</span>` : ""}<span class="sc"><small>スコア</small><b>${fmtN(S.score)}</b></span></div>`; }
    function next() {
      if (S.lives <= 0) return finish();
      S.i++; S.q = qs[S.i % qs.length]; S.lim = qLimit(S.q.w, cfg.sp); S.start = Date.now(); S.answered = false; S.hint = false; S.last = null;
      if (S.pad) S.pad.clear();
      draw();
    }
    function draw() {
      const q = S.q;
      let fb = "";
      if (S.answered) {
        const r = S.last;
        fb = `<div class="clfb ${r.ok ? "ok" : "ng"}"><div class="big">${r.ok ? `✅ 正解！ <b>+${fmtN(r.pts)}</b>` : r.pick == null ? "⏱ 時間切れ… ❤ −1" : "❌ ざんねん… ❤ −1"}</div>
          ${r.ok ? `<div class="sub">${r.heal ? "❤ 5 問連続正解で ハートが 1 つ もどった！　" : ""}${S.streak >= 2 ? `🔥 ${S.streak} 問連続（次は 点数 ×${(1 + 0.1 * Math.min(5, S.streak)).toFixed(1)}）` : ""}</div>` : `<div class="sub">正解は <b>${q.ans}</b></div>`}
          ${explainHTML(q)}
          <div class="rv" style="justify-content:center;margin-top:8px"><button type="button" class="btn main big" data-cl="next">${S.lives > 0 ? "次の問題 ▶" : "結果を見る ▶"}</button></div></div>`;
      }
      wrap.innerHTML = hud() + (S.answered ? "" : qTimerHTML(S.lim - (Date.now() - S.start) / 1000, S.lim)) +
        qCardHTML(q, { btn: !S.answered, reveal: S.answered, mine: S.answered && S.last.pick != null ? q.ch.indexOf(S.last.pick) : -1 }) +
        (S.hint && !S.answered ? hintHTML(q) : "") + fb +
        `<div class="qtools" id="cltools"></div>`;
      const tools = wrap.querySelector("#cltools");
      if (!S.answered) tools.appendChild(h("button", { type: "button", class: "toolbtn" + (S.hint ? " on" : ""), "data-cl": "hint", disabled: S.hint || null }, "💡 公式（点 半分）"));
      if (!S.sc) { S.sc = scratchToggle(); S.pad = S.sc.pad; }
      if (!S.answered) { tools.appendChild(S.sc.btn); wrap.appendChild(S.sc.box); }
      c.out(`🧗 第 ${S.i + 1} 問　${"❤️".repeat(S.lives)}　<span class="big hl">${fmtN(S.score)}</span> 点`);
      if (S.answered) { const f = wrap.querySelector(".clfb"); if (f && f.scrollIntoView) f.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
    }
    function answer(i) {
      if (S.answered) return;
      const q = S.q, t = (Date.now() - S.start) / 1000, pick = i == null ? null : q.ch[i], ok = pick === q.ans;
      S.answered = true;
      let pts = 0, heal = false;
      if (ok) {
        pts = qPoints(1 - t / S.lim, q.w, S.streak, S.hint); S.score += pts; S.streak++; S.ok++; S.best = Math.max(S.best, S.streak);
        if (S.streak % 5 === 0 && S.lives < 3) { S.lives++; heal = true; }
      } else { S.streak = 0; S.lives--; }
      S.last = { ok, pick, pts, heal };
      S.log.push({ q, pick, ok, hint: S.hint });
      draw();
    }
    function finish() {
      const key = "climb-" + cfg.m, prev = RW.best[key] || 0, rec = S.score > prev;
      if (rec) RW.best[key] = S.score;
      if (S.best > RW.maxCombo) RW.maxCombo = S.best;
      rwSave(); earn(Math.floor(S.score / 100));
      const note = h("div", { style: "font-size:14px;min-height:1.4em" });
      const text = `数学Aラボ 🧗じっくりチャレンジ（${GNAME[cfg.m]}）\n${fmtN(S.score)}点！ 第${S.i + 1}問まで・${S.ok}問正解・最大${S.best}連続\n${baseURL()}`;
      clear(wrap);
      wrap.appendChild(h("div", { class: "gres" },
        rec && S.score > 0 ? h("div", { class: "stamp rec" }, "新記録") : null,
        h("div", { class: "gscore" }, fmtN(S.score), h("small", {}, " 点")),
        h("p", { class: "phrase", html: `🧗 <b>第 ${S.i + 1} 問</b> まで進んだ・✅ <b>${S.ok}</b> 問正解` }),
        h("p", { class: "tstats" }, `🔥 最大 ${S.best} 問連続　🪙 +${Math.floor(S.score / 100)}　${GNAME[cfg.m]} のベスト：${fmtN(Math.max(prev, S.score))} 点`),
        h("div", { class: "rv", style: "justify-content:center" },
          h("button", { type: "button", class: "btn main", onclick: () => open("climb", false) }, "↺ もう一度"),
          h("button", { type: "button", class: "btn", onclick: () => brag(text, note) }, "📣 自慢する"),
          h("button", { type: "button", class: "btn", onclick: () => open("game") }, "◀ ゲームのトップ")),
        note, reviewBox(S.log)));
      c.out(`結果 <span class="big hl">${fmtN(S.score)}</span> 点　第 ${S.i + 1} 問まで${rec && S.score > 0 ? "　🎉 新記録！" : ""}`);
    }
    next();
  },
});

/* ---------- 🏆 クラス対戦「クイズ大会」：先生の画面 ----------
   room: { kind: "quiz", state: "quiz"|"end", round, seed, qi, phase: "ask"|"reveal"|"rank", qStart, qEnd, cfg: { m, n, sp } }
   players/{pid}: { n, s, k(連続), c(最大連続), w(正解), m(まちがい), r(回), a: { r, i, c(えらんだ番号), t(秒) } } */
function quizHost(code, H) {
  const QH = { qs: null, seedKey: "", prevRank: {}, rankAt: -1 };

    const qs = qsOf(r);
    if (r.qi + 1 >= qs.length) return api("PATCH", ROOM(code), { state: "end" }).catch(() => { });
    const t0 = Math.round(now() + 3500);
    api("PATCH", ROOM(code), { qi: r.qi + 1, phase: "ask", qStart: t0, qEnd: t0 + qLimit(qs[r.qi + 1].w, r.cfg.sp) * 1000 }).catch(() => { });
  };

  QH.draw = (el, r) => {

        awardsHTML(awardsOf(lst)) + `<div class="bbody"></div>`;

  };
  return QH;
}

/* ---------- 🏆 クラス対戦「クイズ大会」：生徒の画面 ---------- */
function quizPlayer(c, box, code) {

<script>
"use strict";
/* ===================== 🪜 解き方ステップ（タイムアタック用） =====================
   1 問を「考え方 → 式 → 計算」の小さな 4 択に分ける。ステップが合うたびに 点数が入る。
   それぞれ { q, fig, steps: [{ ask, ans, wrong: [...] }], ans（さいごの答え）, ex, link, cat } を返す */
const stp = (ask, ans, wrong) => ({ ask, ans: String(ans), wrong: wrong.map(String) });
/* 選択肢をつくる：答えと同じ・同じ見た目のものを のぞいて 4 つ */
/* 「56 通り」「3/4」「110°」のような 数だけの答え → その値（式やことばは NaN） */
const pureNum = t => { const m = String(t).replace(/<[^>]+>/g, "").trim().match(/^(\d+(?:\.\d+)?(?:\/\d+)?)\s*(通り|個|°)?$/); return m ? numOf(m[1]) : NaN; };
function okWrong(w, ans) {
  const va = pureNum(ans), vw = pureNum(w);
  if (Number.isFinite(va) && Number.isFinite(vw) && Math.abs(va - vw) < 1e-9) return false;     // 答えと同じ値（2 つ正解に見える）
  if (/^\d+\/\d+$/.test(ans) && va <= 1 && vw > 1) return false;                              // 確率なのに 1 より大きい
  const fr = String(w).match(/^(\d+)\/(\d+)$/); if (fr && gcd(+fr[1], +fr[2]) > 1) return false; // 約分していない
  return true;
}
function stepChoices(st) {
  const out = [st.ans];
  st.wrong.forEach(w => { if (w && !out.some(o => o.replace(/<[^>]+>/g, "") === w.replace(/<[^>]+>/g, "")) && okWrong(w, st.ans)) out.push(w); });
  /* たりないとき：答えの中の数字を 少しずらす（「56 通り」→「57 通り」、「→ 3 個・↑ 3 個」→「→ 4 個・↑ 3 個」） */
  const plain = t => t.replace(/<[^>]+>/g, "");
  for (let d = 1; out.length < 4 && d < 40; d++) {
    let t = null;
    const m = st.ans.match(/^(\d+)(\s*\D*)$/);
    /* 数だけの答えのときだけ 近い数をつくる（式やことばは 3 択のままにする：へんな選択肢を つくらない） */
    if (!Number.isFinite(pureNum(st.ans))) break;
    if (/^\d+\/\d+$/.test(st.ans) || /^\d+°$/.test(st.ans)) t = nearWrong(st.ans, d);
    else if (m) t = nearWrong(m[1], d) + m[2];

}
const KIND4 = ["順列（ならべる）", "組合せ（えらぶだけ）", "円順列（まるくならべる）", "重複順列（同じものを何回も使える）"];

      ex: `ならべる → 順列。${P(n, r)} = ${Array.from({ length: r }, (_, i) => n - i).join("×")} = ${a} 通り。`,
      steps: [stp("どの考え方？", KIND4[0], KIND4.slice(1)), stp(`${n} 人から ${r} 人を ならべる 式は？`, P(n, r), [C(n, r), `${n}<sup>${r}</sup>`, `${n} × ${r}`]), stp(`${P(n, r)} を 計算すると？`, a + " 通り", [nCr(n, r) + " 通り", n ** r + " 通り", nPr(n, r - 1) + " 通り"])] };
  },
  comb() {

    return { cat: "場合の数", q: `${n} 人の中から ${r} 人の係をえらぶ方法は何通り？`, ans: a + " 通り", link: "comb",
      ex: `えらぶだけ → 組合せ。${C(n, r)} = ${P(n, r)} ÷ ${r}! = ${nPr(n, r)} ÷ ${fact(r)} = ${a} 通り。`,
      steps: [stp("どの考え方？", KIND4[1], [KIND4[0], KIND4[2], KIND4[3]]), stp(`${n} 人から ${r} 人を えらぶ 式は？`, `${P(n, r)} ÷ ${r}!`, [P(n, r), `${P(n, r)} × ${r}!`, `${n}<sup>${r}</sup> ÷ ${r}!`]), stp(`${P(n, r)} ÷ ${r}! を 計算すると？`, a + " 通り", [nPr(n, r) + " 通り", nCr(n, r - 1) + " 通り", n * r + " 通り"])] };
  },
  circ() {

      ex: `円順列：1 人を固定して のこり ${n - 1} 人をならべる。(${n}−1)! = ${a} 通り。`,
      steps: [stp("どの考え方？", "1 人を固定して のこりをならべる", ["全員を 1 列にならべる", "全員を えらぶだけ", "1 人ずつ 2 通りずつ"]), stp(`${n} 人の 円順列の 式は？`, `(${n} − 1)!`, [`${n}!`, `${n}! ÷ 2`, `(${n} − 1)! ÷ 2`]), stp(`(${n} − 1)! を 計算すると？`, a + " 通り", [fact(n) + " 通り", fact(n - 1) / 2 + " 通り", fact(n - 2) + " 通り"])] };
  },
  route() {
